<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Paid Ads Control Room</title>
  <desc id="svg-desc">Seven-stage control-room feedback loop for paid ads: Meta and LinkedIn performance data streams in via Ads API hourly, Claude and OpenAI generate copy variants, campaigns go live, budget watch checks rules hourly on a loop back to variants while branching anomaly alerts to Slack or email for a human-in-the-loop decision desk at the centre, and a weekly report drops out to Google Sheets.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(59, 130, 246, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #3b82f6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 14px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.8px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 7px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 9.3px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 7px; fill: var(--muted); }
    .chip-text { font-size: 6.5px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.5px; font-weight: 700; fill: var(--accent); }
    .counter-text { font-size: 8.4px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .ring-guide { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.45; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 410 70 Q 528 70 536 118"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 536 198 L 536 246"); animation: p23 9s linear infinite; }
    .p-34 { offset-path: path("M 438 266 L 198 266"); animation: p34 9s linear infinite; }
    .p-42 { offset-path: path("M 46 246 Q 16 112 230 68"); animation: p42 9s linear infinite; }
    .p-45 { offset-path: path("M 140 246 L 140 194"); animation: p45 9s linear infinite; }
    .p-56 { offset-path: path("M 228 164 L 264 164"); animation: p56 9s linear infinite; }
    .p-37 { offset-path: path("M 320 266 L 320 326"); animation: p37 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 19% { opacity:1; offset-distance:100%; } 22%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,24% { opacity:0; offset-distance:0%; } 26% { opacity:1; } 32% { opacity:1; offset-distance:100%; } 35%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p34 { 0%,37% { opacity:0; offset-distance:0%; } 39% { opacity:1; } 46% { opacity:1; offset-distance:100%; } 49%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p42 { 0%,49% { opacity:0; offset-distance:0%; } 51% { opacity:1; } 59% { opacity:1; offset-distance:100%; } 62%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p45 { 0%,54% { opacity:0; offset-distance:0%; } 56% { opacity:1; } 62% { opacity:1; offset-distance:100%; } 65%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,66% { opacity:0; offset-distance:0%; } 68% { opacity:1; } 74% { opacity:1; offset-distance:100%; } 77%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p37 { 0%,79% { opacity:0; offset-distance:0%; } 81% { opacity:1; } 88% { opacity:1; offset-distance:100%; } 91%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .card-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }
    #stage-7 .card-bg { animation: s7Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 18%,28% { stroke: var(--accent); stroke-width: 1.7; } 32%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,28% { stroke: var(--line); stroke-width: 1.1; } 31%,42% { stroke: var(--accent); stroke-width: 1.7; } 46%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,42% { stroke: var(--line); stroke-width: 1.1; } 45%,57% { stroke: var(--accent); stroke-width: 1.7; } 61%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,56% { stroke: var(--line); stroke-width: 1.1; } 59%,70% { stroke: var(--accent); stroke-width: 1.7; } 74%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,68% { stroke: var(--line); stroke-width: 1.1; } 72%,84% { stroke: var(--accent); stroke-width: 1.7; } 88%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s7Hi { 0%,82% { stroke: var(--line); stroke-width: 1.1; } 86%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Spend Counter + Sparkline Draw */
    .spark-line { stroke-dasharray: 70; stroke-dashoffset: 70; animation: drawSpark 9s ease-out infinite; }
    @keyframes drawSpark { 0%,2% { stroke-dashoffset: 70; } 14%,90% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 70; } }
    .sp-1 { opacity: 1; animation: sp1 9s linear infinite; }
    .sp-2 { opacity: 0; animation: sp2 9s linear infinite; }
    .sp-3 { opacity: 0; animation: sp3 9s linear infinite; }
    @keyframes sp1 { 0%,5% { opacity: 1; } 7%,95% { opacity: 0; } 98%,100% { opacity: 1; } }
    @keyframes sp2 { 0%,5% { opacity: 0; } 7%,11% { opacity: 1; } 13%,100% { opacity: 0; } }
    @keyframes sp3 { 0%,11% { opacity: 0; } 13%,94% { opacity: 1; } 98%,100% { opacity: 0; } }

    /* Stage 2: Headlines Type and Swap */
    .hl-1 { transform-box: fill-box; transform-origin: left center; animation: hl1 9s ease-out infinite; }
    .hl-2 { transform-box: fill-box; transform-origin: left center; animation: hl2 9s ease-out infinite; }
    @keyframes hl1 { 0%,15% { transform: scaleX(0.1); opacity: 0.3; } 21%,90% { transform: scaleX(1); opacity: 1; } 98%,100% { transform: scaleX(0.1); opacity: 0.3; } }
    @keyframes hl2 { 0%,19% { transform: scaleX(0.1); opacity: 0.3; } 25%,90% { transform: scaleX(1); opacity: 1; } 98%,100% { transform: scaleX(0.1); opacity: 0.3; } }

    /* Stage 3: Three Mini Ad Cards Pulse */
    .ad-1 { animation: adP1 9s ease-in-out infinite; }
    .ad-2 { animation: adP2 9s ease-in-out infinite; }
    .ad-3 { animation: adP3 9s ease-in-out infinite; }
    @keyframes adP1 { 0%,30%,44%,100% { stroke: var(--line); } 34%,38% { stroke: var(--accent); stroke-width: 1.5; } }
    @keyframes adP2 { 0%,33%,46%,100% { stroke: var(--line); } 37%,41% { stroke: var(--accent); stroke-width: 1.5; } }
    @keyframes adP3 { 0%,36%,48%,100% { stroke: var(--line); } 40%,44% { stroke: var(--accent); stroke-width: 1.5; } }

    /* Stage 4: Gauge Needle Sweeps */
    .gauge-needle { transform-box: fill-box; transform-origin: 50% 90%; animation: sweepGauge 9s ease-in-out infinite; }
    @keyframes sweepGauge {
      0%,42% { transform: rotate(-32deg); }
      50% { transform: rotate(18deg); }
      56%,90% { transform: rotate(8deg); }
      98%,100% { transform: rotate(-32deg); }
    }

    /* Stage 5: Warning Triangle Flashes Once */
    .warn-tri { animation: warnFlash 9s ease-in-out infinite; opacity: 0.4; }
    @keyframes warnFlash {
      0%,58% { opacity: 0.4; }
      62%,66% { opacity: 1; }
      70%,100% { opacity: 0.45; }
    }

    /* Stage 6: Approve Chip Ticks */
    .app-tick { stroke-dasharray: 18; stroke-dashoffset: 18; animation: drawApp 9s ease-out infinite; }
    @keyframes drawApp { 0%,73% { stroke-dashoffset: 18; } 80%,94% { stroke-dashoffset: 0; } 99%,100% { stroke-dashoffset: 18; } }

    /* Stage 7: Report Rows Fill + End Tick */
    .rep-1 { transform-box: fill-box; transform-origin: left center; animation: r1 9s ease-out infinite; }
    .rep-2 { transform-box: fill-box; transform-origin: left center; animation: r2 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 26; stroke-dashoffset: 26; animation: drawFinal 9s ease-out infinite; }
    @keyframes r1 { 0%,84% { transform: scaleX(0.05); opacity: 0.25; } 89%,96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(0.05); opacity: 0.25; } }
    @keyframes r2 { 0%,87% { transform: scaleX(0.05); opacity: 0.25; } 92%,96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(0.05); opacity: 0.25; } }
    @keyframes drawFinal { 0%,89% { stroke-dashoffset: 26; } 94%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 26; } }
  </style>

  <!-- Header -->
  <text x="20" y="23" class="title-main">Paid Ads Control Room</text>
  <text x="620" y="23" text-anchor="end" class="method-text">Ads API → variants → budget watch → human gate</text>

  <!-- Subtle Circular Ring Guide -->
  <ellipse cx="320" cy="182" rx="224" ry="118" class="ring-guide" />

    <defs>
    <mask id="cutout-paid-ads">
      <rect width="640" height="400" fill="white" />
      <rect x="450.5" y="64.5" width="83.0" height="19.0" rx="8.0" fill="black" />
      <rect x="484.5" y="212.5" width="103.0" height="19.0" rx="8.0" fill="black" />
      <rect x="30.5" y="88.5" width="91.0" height="19.0" rx="8.0" fill="black" />
      <rect x="96.5" y="210.5" width="87.0" height="19.0" rx="8.0" fill="black" />
      <rect x="278.5" y="288.5" width="83.0" height="19.0" rx="8.0" fill="black" />
    </mask>
  </defs>

  <!-- Flow Connectors -->
  <g mask="url(#cutout-paid-ads)">
  <path d="M 410 70 Q 528 70 536 118" class="flow-path flow-accent" />
  <path d="M 536 198 L 536 246" class="flow-path" />
  <path d="M 438 266 L 198 266" class="flow-path" />
  <path d="M 46 246 Q 16 112 230 68" class="flow-path" />
  <path d="M 140 246 L 140 194" class="flow-path flow-accent" />
  <path d="M 228 164 L 264 164" class="flow-path" />
  <path d="M 418 168 L 454 168" class="flow-path flow-accent" />
  <path d="M 320 266 L 320 326" class="flow-path flow-accent" />
  </g>
<!-- Travelling Packets -->
  <circle r="3.4" class="packet p-12" />
  <circle r="3.4" class="packet p-23" />
  <circle r="3.4" class="packet p-34" />
  <circle r="3.4" class="packet p-42" />
  <circle r="3.4" class="packet p-45" />
  <circle r="3.4" class="packet p-56" />
  <circle r="3.4" class="packet p-37" />

  <!-- Connector Chips -->
  <g transform="translate(492, 74)">
    <rect x="-40" y="-8" width="80" height="16" rx="8" class="chip-bg" />
    <text x="0" y="2.5" text-anchor="middle" class="chip-text-accent">Ads API · hourly</text>
  </g>
  <g transform="translate(536, 222)">
    <rect x="-50" y="-8" width="100" height="16" rx="8" class="chip-bg" />
    <text x="0" y="2.5" text-anchor="middle" class="chip-text">→ Meta / LinkedIn Ads</text>
  </g>
  <g transform="translate(76, 98)">
    <rect x="-44" y="-8" width="88" height="16" rx="8" class="chip-bg" />
    <text x="0" y="2.5" text-anchor="middle" class="chip-text">rules check · hourly</text>
  </g>
  <g transform="translate(140, 220)">
    <rect x="-42" y="-8" width="84" height="16" rx="8" class="chip-bg" />
    <text x="0" y="2.5" text-anchor="middle" class="chip-text-accent">alert → Slack/email</text>
  </g>
  <g transform="translate(320, 298)">
    <rect x="-40" y="-8" width="80" height="16" rx="8" class="chip-bg" />
    <text x="0" y="2.5" text-anchor="middle" class="chip-text-accent">→ Google Sheets</text>
  </g>

  <!-- STAGE 1: TRIGGER "Account data flows in" (Ring, Top) -->
  <g id="stage-1" class="node">
    <rect x="230" y="38" width="180" height="66" rx="10" class="card-bg" />
    <text x="240" y="53" class="stage-num">01 · TRIGGER</text>
    <text x="240" y="65" class="stage-title">Account data flows in</text>
    <text x="240" y="77" class="stage-copy">Meta · LinkedIn</text>

    <!-- Spend Counter + Sparkline -->
    <text x="240" y="94" class="counter-text sp-1">$1.2k</text>
    <text x="240" y="94" class="counter-text sp-2">$1.8k</text>
    <text x="240" y="94" class="counter-text sp-3">$2.4k</text>
    <path d="M 284 94 L 304 89 L 324 92 L 348 82 L 372 86 L 396 77" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="spark-line" />
  </g>

  <!-- STAGE 2: "Variants generated" (Ring, Right) -->
  <g id="stage-2" class="node">
    <rect x="454" y="118" width="166" height="80" rx="10" class="card-bg" />
    <text x="464" y="133" class="stage-num">02 · VARIANTS</text>
    <text x="464" y="145" class="stage-title">Variants generated</text>

    <g class="ai-badge">
      <rect x="464" y="152" width="38" height="14" rx="7" class="chip-bg" />
      <text x="483" y="161.5" text-anchor="middle" class="chip-text-accent">Claude</text>
      <rect x="506" y="152" width="40" height="14" rx="7" class="chip-bg" />
      <text x="526" y="161.5" text-anchor="middle" class="chip-text-accent">OpenAI</text>
    </g>

    <rect x="464" y="173" width="136" height="4.5" rx="2.2" fill="var(--ink)" fill-opacity="0.45" class="hl-1" />
    <rect x="464" y="182" width="112" height="4.5" rx="2.2" fill="var(--accent)" fill-opacity="0.6" class="hl-2" />
  </g>

  <!-- STAGE 3: "Campaigns live" (Ring, Bottom Right) -->
  <g id="stage-3" class="node">
    <rect x="438" y="246" width="182" height="74" rx="10" class="card-bg" />
    <text x="448" y="261" class="stage-num">03 · LIVE</text>
    <text x="448" y="273" class="stage-title">Campaigns live</text>

    <rect x="448" y="282" width="48" height="28" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1" class="ad-1" />
    <text x="472" y="299" text-anchor="middle" class="chip-text">Ad A</text>

    <rect x="504" y="282" width="48" height="28" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1" class="ad-2" />
    <text x="528" y="299" text-anchor="middle" class="chip-text-accent">Ad B</text>

    <rect x="560" y="282" width="48" height="28" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1" class="ad-3" />
    <text x="584" y="299" text-anchor="middle" class="chip-text">Ad C</text>
  </g>

  <!-- STAGE 4: "Budget watch" (Ring, Bottom Left) -->
  <g id="stage-4" class="node">
    <rect x="20" y="246" width="178" height="74" rx="10" class="card-bg" />
    <text x="30" y="261" class="stage-num">04 · WATCH</text>
    <text x="30" y="273" class="stage-title">Budget watch</text>
    <text x="30" y="287" class="stage-copy">Spend checked</text>
    <text x="30" y="298" class="stage-copy">against team rules</text>

    <!-- Safe-band Gauge -->
    <g transform="translate(152, 298)">
      <path d="M -22 0 A 22 22 0 0 1 22 0" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round" />
      <path d="M -12 -18 A 22 22 0 0 1 12 -18" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" />
      <line x1="0" y1="0" x2="0" y2="-16" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" class="gauge-needle" />
      <circle cx="0" cy="0" r="2.5" fill="var(--accent)" />
    </g>
  </g>

  <!-- STAGE 5: "Anomaly flagged" (Branch Inward) -->
  <g id="stage-5" class="node">
    <rect x="78" y="124" width="150" height="70" rx="10" class="card-bg" />
    <text x="88" y="139" class="stage-num">05 · ANOMALY</text>
    <text x="88" y="151" class="stage-title">Anomaly flagged</text>
    <text x="88" y="165" class="stage-copy">Overspend or</text>
    <text x="88" y="176" class="stage-copy">dead ad caught</text>

    <!-- Warning Triangle -->
    <g class="warn-tri" transform="translate(198, 168)">
      <polygon points="0,-13 12,8 -12,8" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round" />
      <line x1="0" y1="-6" x2="0" y2="1" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="0" cy="4.5" r="1" fill="var(--accent)" />
    </g>
  </g>

  <!-- STAGE 6: "You decide" (CENTRE Desk) -->
  <g id="stage-6" class="node">
    <rect x="264" y="132" width="154" height="86" rx="10" class="card-bg" />
    <text x="274" y="147" class="stage-num">06 · CENTRE DESK</text>
    <text x="274" y="159" class="stage-title">You decide</text>

    <g class="ai-badge">
      <rect x="274" y="166" width="84" height="14" rx="7" class="chip-bg" />
      <text x="316" y="175.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>

    <!-- Approve / Decline Chips -->
    <g transform="translate(274, 188)">
      <rect x="0" y="0" width="66" height="18" rx="9" class="chip-bg" />
      <path d="M 10 9 L 13 12 L 18 6" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="app-tick" />
      <text x="41" y="11.5" text-anchor="middle" class="chip-text-accent">Approve</text>

      <rect x="72" y="0" width="58" height="18" rx="9" class="chip-bg" />
      <text x="101" y="11.5" text-anchor="middle" class="chip-text">Decline</text>
    </g>
  </g>

  <!-- STAGE 7: "Weekly report ready" (Drops Out Bottom) -->
  <g id="stage-7" class="node">
    <rect x="220" y="326" width="200" height="64" rx="10" class="card-bg" />
    <text x="230" y="341" class="stage-num">07 · REPORT</text>
    <text x="230" y="353" class="stage-title">Weekly report ready</text>

    <rect x="230" y="362" width="136" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.45" class="rep-1" />
    <rect x="230" y="371" width="110" height="4.5" rx="2" fill="var(--muted)" fill-opacity="0.5" class="rep-2" />

    <circle cx="394" cy="360" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 389 360 L 392.5 363.5 L 399.5 356.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
