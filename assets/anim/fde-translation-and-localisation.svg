<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Translation &amp; Localisation</title>
  <desc id="svg-desc">Six-stage parallel language lanes workflow for translation and localisation: source content arrives from CMS export via webhook, passes a glossary gate locking brand names and units, splits into five simultaneous language lanes (ES, FR, DE, JA, ZH) powered by Claude, Gemini and DeepL with mid-lane local adaptation markers, crosses a human-in-the-loop review bar to the finish line, and delivers all locales together to the CMS.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(245, 158, 11, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #f59e0b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.5px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.5px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.4px; fill: var(--muted); }
    .chip-text { font-size: 6px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 110 214 L 138 214"); animation: p12 9s linear infinite; }
    .p-23a { offset-path: path("M 212 79 L 234 79"); animation: p23 9s linear infinite; }
    .p-23b { offset-path: path("M 212 145 L 234 145"); animation: p23 9s linear infinite; }
    .p-23c { offset-path: path("M 212 211 L 234 211"); animation: p23 9s linear infinite; }
    .p-23d { offset-path: path("M 212 277 L 234 277"); animation: p23 9s linear infinite; }
    .p-23e { offset-path: path("M 212 343 L 234 343"); animation: p23 9s linear infinite; }
    .p-56 { offset-path: path("M 538 211 L 556 211"); animation: p56 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 17% { opacity:1; offset-distance:100%; } 20%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,26% { opacity:0; offset-distance:0%; } 28% { opacity:1; } 33% { opacity:1; offset-distance:100%; } 36%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,78% { opacity:0; offset-distance:0%; } 80% { opacity:1; } 86% { opacity:1; offset-distance:100%; } 89%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .lane-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 17%,29% { stroke: var(--accent); stroke-width: 1.7; } 33%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,29% { stroke: var(--line); stroke-width: 1.1; } 33%,58% { stroke: var(--accent); stroke-width: 1.7; } 62%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,60% { stroke: var(--line); stroke-width: 1.1; } 64%,79% { stroke: var(--accent); stroke-width: 1.7; } 83%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,79% { stroke: var(--line); stroke-width: 1.1; } 83%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Source Lines Type */
    .src-type { transform-box: fill-box; transform-origin: left center; animation: srTy 9s ease-out infinite; }
    @keyframes srTy { 0%,1% { transform: scaleX(0.1); opacity:0.3; } 10%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.1); opacity:0.3; } }

    /* Stage 2: Glossary Term Chips Stamp */
    .gl-stamp { transform-box: fill-box; transform-origin: center; animation: glSt 9s ease-out infinite; }
    @keyframes glSt { 0%,15% { opacity:0.25; transform:scale(1.2); } 23%,90% { opacity:1; transform:scale(1); } 98%,100% { opacity:0.25; } }

    /* Stage 3: Simultaneous Typing Across Lanes */
    .ln-type { transform-box: fill-box; transform-origin: left center; animation: lnTy 9s ease-out infinite; }
    @keyframes lnTy { 0%,30% { transform: scaleX(0.05); opacity:0.25; } 44%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.25; } }

    /* Stage 4: Adaptation Chips Flip On */
    .ad-flip { transform-box: fill-box; transform-origin: center; animation: adFl 9s ease-out infinite; }
    @keyframes adFl { 0%,46% { opacity:0.2; transform:scale(0.75); } 56%,92% { opacity:1; transform:scale(1); } 98%,100% { opacity:0.2; } }

    /* Stage 5 and 6: Review Sweep + Ticks + Pack Stack */
    .rev-sweep { animation: rvSw 9s ease-in-out infinite; }
    .rev-tick { stroke-dasharray: 14; stroke-dashoffset: 14; animation: rvCk 9s ease-out infinite; }
    .pack-stack { animation: pkSt 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }

    @keyframes rvSw { 0%,60% { opacity:0.2; transform:translateY(0); } 70% { opacity:0.85; transform:translateY(240px); } 78%,100% { opacity:0.2; transform:translateY(0); } }
    @keyframes rvCk { 0%,64% { stroke-dashoffset: 14; } 74%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 14; } }
    @keyframes pkSt { 0%,80% { opacity:0.3; transform:translateX(-6px); } 88%,96% { opacity:1; transform:translateX(0); } 100% { opacity:0.3; } }
    @keyframes drawFinal { 0%,86% { stroke-dashoffset: 24; } 93%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Translation &amp; Localisation</text>
  <text x="620" y="21" text-anchor="end" class="method-text">CMS webhook → glossary → 5 parallel lanes → all locales</text>

  <!-- AI Badges for 5 Lanes -->
  <g class="ai-badge">
    <rect x="234" y="32" width="38" height="13" rx="6.5" class="chip-bg" /><text x="253" y="41" text-anchor="middle" class="chip-text-accent">Claude</text>
    <rect x="276" y="32" width="40" height="13" rx="6.5" class="chip-bg" /><text x="296" y="41" text-anchor="middle" class="chip-text-accent">Gemini</text>
    <rect x="320" y="32" width="38" height="13" rx="6.5" class="chip-bg" /><text x="339" y="41" text-anchor="middle" class="chip-text-accent">DeepL</text>
  </g>

    <defs>
    <mask id="cutout-translation-and-localisation">
      <rect width="640" height="400" fill="white" />
      <rect x="46.5" y="29.5" width="83.0" height="17.0" rx="7.0" fill="black" />
      <rect x="147.5" y="29.5" width="55.0" height="17.0" rx="7.0" fill="black" />
      <rect x="550.5" y="83.0" width="75.0" height="18.0" rx="7.5" fill="black" />
    </mask>
  </defs>

  <!-- Flow Connectors -->
  <g mask="url(#cutout-translation-and-localisation)">
  <path d="M 110 214 L 138 214" class="flow-path" />
  <path d="M 212 79 L 234 79" class="flow-path flow-accent" />
  <path d="M 212 145 L 234 145" class="flow-path flow-accent" />
  <path d="M 212 211 L 234 211" class="flow-path flow-accent" />
  <path d="M 212 277 L 234 277" class="flow-path flow-accent" />
  <path d="M 212 343 L 234 343" class="flow-path flow-accent" />
  <path d="M 538 211 L 556 211" class="flow-path flow-accent" />
  </g>
<!-- Finish Line -->
  <line x1="546" y1="52" x2="546" y2="370" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.65" />

  <!-- Travelling Packets -->
  <circle r="3" class="packet p-12" />
  <circle r="2.8" class="packet p-23a" />
  <circle r="2.8" class="packet p-23b" />
  <circle r="2.8" class="packet p-23c" />
  <circle r="2.8" class="packet p-23d" />
  <circle r="2.8" class="packet p-23e" />
  <circle r="3.1" class="packet p-56" />

  <!-- Connector Chips -->
  <g transform="translate(88, 38)">
    <rect x="-40" y="-7" width="80" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text">CMS export → webhook</text>
  </g>
  <g transform="translate(175, 38)">
    <rect x="-26" y="-7" width="52" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text-accent">your glossary</text>
  </g>
  <g transform="translate(588, 92)">
    <rect x="-36" y="-7.5" width="72" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ CMS, all locales</text>
  </g>

  <!-- STAGE 1: TRIGGER "Source content lands" (Far Left, Tall Card) -->
  <g id="stage-1" class="node">
    <rect x="16" y="52" width="94" height="318" rx="10" class="card-bg" />
    <text x="24" y="68" class="stage-num">01 · TRIGGER</text>
    <text x="24" y="80" class="stage-title">Source content</text>
    <text x="24" y="91" class="stage-title">lands</text>
    <text x="24" y="106" class="stage-copy">EN master copy</text>

    <rect x="24" y="122" width="76" height="5" rx="2" fill="var(--accent)" class="src-type" />
    <rect x="24" y="136" width="66" height="5" rx="2" fill="var(--ink)" fill-opacity="0.45" class="src-type" />
    <rect x="24" y="150" width="72" height="5" rx="2" fill="var(--ink)" fill-opacity="0.45" class="src-type" />
    <rect x="24" y="164" width="58" height="5" rx="2" fill="var(--muted)" fill-opacity="0.45" class="src-type" />
  </g>

  <!-- STAGE 2: "Glossary locks terms" (Left Gate) -->
  <g id="stage-2" class="node">
    <rect x="138" y="52" width="74" height="318" rx="10" class="card-bg" />
    <text x="145" y="68" class="stage-num">02 · GATE</text>
    <text x="145" y="80" class="stage-title">Glossary</text>
    <text x="145" y="91" class="stage-title">locks terms</text>

    <g class="gl-stamp">
      <rect x="144" y="114" width="62" height="22" rx="5" class="chip-bg" />
      <text x="175" y="124" text-anchor="middle" class="chip-text-accent">brand names</text>
      <text x="175" y="132" text-anchor="middle" class="stage-copy">stay fixed</text>

      <rect x="144" y="148" width="62" height="22" rx="5" class="chip-bg" />
      <text x="175" y="158" text-anchor="middle" class="chip-text-accent">units → local</text>
      <text x="175" y="166" text-anchor="middle" class="stage-copy">locked</text>
    </g>
  </g>

  <!-- STAGE 3: FIVE PARALLEL LANGUAGE LANES -->
  <g id="stage-3" class="node">
    <!-- ES -->
    <rect x="234" y="52" width="252" height="54" rx="8" class="card-bg lane-bg" />
    <text x="244" y="68" class="stage-num">ES</text>
    <text x="262" y="68" class="stage-title">Hola</text>
    <rect x="244" y="76" width="118" height="5" rx="2" fill="var(--accent)" fill-opacity="0.7" class="ln-type" />
    <rect x="244" y="86" width="96" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.4" class="ln-type" />

    <!-- FR -->
    <rect x="234" y="118" width="252" height="54" rx="8" class="card-bg lane-bg" />
    <text x="244" y="134" class="stage-num">FR</text>
    <text x="262" y="134" class="stage-title">Bonjour</text>
    <rect x="244" y="142" width="118" height="5" rx="2" fill="var(--accent)" fill-opacity="0.7" class="ln-type" />
    <rect x="244" y="152" width="96" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.4" class="ln-type" />

    <!-- DE -->
    <rect x="234" y="184" width="252" height="54" rx="8" class="card-bg lane-bg" />
    <text x="244" y="200" class="stage-num">DE</text>
    <text x="262" y="200" class="stage-title">Hallo</text>
    <rect x="244" y="208" width="118" height="5" rx="2" fill="var(--accent)" fill-opacity="0.7" class="ln-type" />
    <rect x="244" y="218" width="96" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.4" class="ln-type" />

    <!-- JA -->
    <rect x="234" y="250" width="252" height="54" rx="8" class="card-bg lane-bg" />
    <text x="244" y="266" class="stage-num">JA</text>
    <text x="262" y="266" class="stage-title">こんにちは</text>
    <rect x="244" y="274" width="118" height="5" rx="2" fill="var(--accent)" fill-opacity="0.7" class="ln-type" />
    <rect x="244" y="284" width="96" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.4" class="ln-type" />

    <!-- ZH -->
    <rect x="234" y="316" width="252" height="54" rx="8" class="card-bg lane-bg" />
    <text x="244" y="332" class="stage-num">ZH</text>
    <text x="262" y="332" class="stage-title">你好</text>
    <rect x="244" y="340" width="118" height="5" rx="2" fill="var(--accent)" fill-opacity="0.7" class="ln-type" />
    <rect x="244" y="350" width="96" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.4" class="ln-type" />
  </g>

  <!-- STAGE 4: "Local adaptation" (Mid-Lane Markers) -->
  <g id="stage-4" class="node">
    <g class="ad-flip">
      <rect x="382" y="70" width="88" height="16" rx="8" class="chip-bg" />
      <text x="426" y="80.5" text-anchor="middle" class="chip-text-accent">km → miles</text>

      <rect x="382" y="136" width="88" height="16" rx="8" class="chip-bg" />
      <text x="426" y="146.5" text-anchor="middle" class="chip-text-accent">€ format</text>

      <rect x="382" y="202" width="88" height="16" rx="8" class="chip-bg" />
      <text x="426" y="212.5" text-anchor="middle" class="chip-text-accent">date format</text>
    </g>
  </g>

  <!-- STAGE 5: "Human review" (Right, Before Finish Line) -->
  <g id="stage-5" class="node">
    <rect x="498" y="52" width="40" height="318" rx="9" class="card-bg" />
    <g class="ai-badge">
      <rect x="472" y="32" width="84" height="13" rx="6.5" class="chip-bg" />
      <text x="514" y="41" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>
    <rect x="504" y="74" width="28" height="16" rx="4" fill="var(--accent)" fill-opacity="0.22" class="rev-sweep" />
    <path d="M 512 145 L 516 149 L 523 141" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="rev-tick" />
    <path d="M 512 277 L 516 281 L 523 273" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="rev-tick" />
  </g>

  <!-- STAGE 6: "All markets live together" (Far Right Stack, End) -->
  <g id="stage-6" class="node">
    <rect x="556" y="118" width="70" height="186" rx="10" class="card-bg" />
    <text x="591" y="135" text-anchor="middle" class="stage-num">06 · LIVE</text>
    <text x="591" y="147" text-anchor="middle" class="stage-title">All markets</text>

    <g transform="translate(566, 160)"><g class="pack-stack">
      <rect x="0" y="0" width="50" height="11" rx="3" class="chip-bg" />
      <rect x="0" y="15" width="50" height="11" rx="3" class="chip-bg" />
      <rect x="0" y="30" width="50" height="11" rx="3" class="chip-bg" />
      <rect x="0" y="45" width="50" height="11" rx="3" class="chip-bg" />
      <rect x="0" y="60" width="50" height="11" rx="3" class="chip-bg" />
    </g></g>

    <circle cx="591" cy="272" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 586 272 L 589.5 275.5 L 596.5 268.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
