<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Documents &amp; Invoices</title>
  <desc id="svg-desc">Six-stage sorting conveyor with scanner arch workflow for documents and invoices: PDFs, scans and photos drop onto the conveyor belt from email inbox and upload, pass under a Claude and OpenAI computer-vision scanner arch that reads fields, get classified by type, verify totals, drop into three labelled bins (Accounting, Expenses, Contracts) while a mismatched card diverts down the exception chute to a human tray, and file into Drive folders.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(20, 184, 166, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #14b8a6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.6px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.6px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.5px; fill: var(--muted); }
    .chip-text { font-size: 6.1px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.1px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .belt-track { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 63 106 L 63 72 L 184 72 L 184 92"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 242 152 L 258 152"); animation: p23 9s linear infinite; }
    .p-34 { offset-path: path("M 342 152 L 356 152"); animation: p34 9s linear infinite; }
    .p-45a { offset-path: path("M 450 132 Q 474 74 498 74"); animation: p45 9s linear infinite; }
    .p-45b { offset-path: path("M 450 152 L 498 152"); animation: p45 9s linear infinite; }
    .p-45c { offset-path: path("M 450 172 Q 474 230 498 230"); animation: p45 9s linear infinite; }
    .p-4t { offset-path: path("M 403 196 L 403 238 L 342 238 L 342 278"); animation: p4t 9s linear infinite; }
    .p-56 { offset-path: path("M 561 264 L 561 312"); animation: p56 9s linear infinite; }
    .p-t6 { offset-path: path("M 428 348 L 478 348"); animation: p56 9s linear infinite; }

    @keyframes p12 { 0%,8% { opacity:0; offset-distance:0%; } 10% { opacity:1; } 17% { opacity:1; offset-distance:100%; } 20%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,30% { opacity:0; offset-distance:0%; } 32% { opacity:1; } 36% { opacity:1; offset-distance:100%; } 39%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p34 { 0%,42% { opacity:0; offset-distance:0%; } 44% { opacity:1; } 48% { opacity:1; offset-distance:100%; } 51%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p45 { 0%,56% { opacity:0; offset-distance:0%; } 58% { opacity:1; } 64% { opacity:1; offset-distance:100%; } 67%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p4t { 0%,58% { opacity:0; offset-distance:0%; } 60% { opacity:1; } 67% { opacity:1; offset-distance:100%; } 70%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,78% { opacity:0; offset-distance:0%; } 80% { opacity:1; } 87% { opacity:1; offset-distance:100%; } 90%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .card-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .bin-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 18%,34% { stroke: var(--accent); stroke-width: 1.7; } 38%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,32% { stroke: var(--line); stroke-width: 1.1; } 35%,46% { stroke: var(--accent); stroke-width: 1.7; } 50%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,44% { stroke: var(--line); stroke-width: 1.1; } 47%,60% { stroke: var(--accent); stroke-width: 1.7; } 64%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,58% { stroke: var(--line); stroke-width: 1.1; } 62%,80% { stroke: var(--accent); stroke-width: 1.7; } 84%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,80% { stroke: var(--line); stroke-width: 1.1; } 84%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Cards Drop onto Belt */
    .doc-drop { animation: dDrop 9s ease-out infinite; }
    @keyframes dDrop { 0% { opacity:0.25; transform:translateY(-8px); } 10%,90% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.25; } }

    /* Stage 2: Arch Light Sweep + Field Chips Pop */
    .ocr-sweep { animation: ocrBar 9s ease-in-out infinite; opacity: 0; }
    .fld-pop { transform-box: fill-box; transform-origin: center; animation: fPop 9s ease-out infinite; }
    @keyframes ocrBar { 0%,18% { opacity:0; transform:translateY(0); } 21% { opacity:0.95; transform:translateY(0); } 30% { opacity:0.95; transform:translateY(30px); } 33%,100% { opacity:0; transform:translateY(30px); } }
    @keyframes fPop { 0%,22% { opacity:0.2; transform:scale(0.6); } 31%,90% { opacity:1; transform:scale(1); } 98%,100% { opacity:0.2; } }

    /* Stage 3: Type Stamp Lands */
    .type-stamp { transform-box: fill-box; transform-origin: center; animation: stType 9s ease-out infinite; }
    @keyframes stType { 0%,34% { opacity:0.2; transform:scale(1.3); } 42%,92% { opacity:1; transform:scale(1); } 98%,100% { opacity:0.2; } }

    /* Stage 4: Match Tick + Mismatch Wobble */
    .tot-tick { stroke-dasharray: 14; stroke-dashoffset: 14; animation: tTick 9s ease-out infinite; }
    .wobble-card { transform-box: fill-box; transform-origin: center; animation: wob 9s ease-in-out infinite; }
    @keyframes tTick { 0%,46% { stroke-dashoffset: 14; } 53%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 14; } }
    @keyframes wob { 0%,48%,62%,100% { transform: rotate(0deg); } 52% { transform: rotate(-4deg); } 56% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } }

    /* Stage 5: Bins Fill Staggered + Tray Drop */
    .bin-fill-1 { transform-box: fill-box; transform-origin: left center; animation: bf1 9s ease-out infinite; }
    .bin-fill-2 { transform-box: fill-box; transform-origin: left center; animation: bf2 9s ease-out infinite; }
    .bin-fill-3 { transform-box: fill-box; transform-origin: left center; animation: bf3 9s ease-out infinite; }
    .tray-drop { animation: trIn 9s ease-out infinite; }
    @keyframes bf1 { 0%,60% { transform: scaleX(0.15); opacity:0.35; } 68%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.15); } }
    @keyframes bf2 { 0%,64% { transform: scaleX(0.15); opacity:0.35; } 72%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.15); } }
    @keyframes bf3 { 0%,68% { transform: scaleX(0.15); opacity:0.35; } 76%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.15); } }
    @keyframes trIn { 0%,60% { opacity:0.25; transform:translateY(-8px); } 70%,92% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.25; } }

    /* Stage 6: Final Tick */
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }
    @keyframes drawFinal { 0%,86% { stroke-dashoffset: 24; } 93%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Documents &amp; Invoices</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Inbox + upload → OCR scanner arch → 3 bins + human tray → Drive</text>

  <!-- Horizontal Conveyor Belt -->
  <rect x="16" y="196" width="434" height="12" rx="6" class="belt-track" />
  <circle cx="32" cy="202" r="2.5" fill="var(--muted)" opacity="0.5" />
  <circle cx="132" cy="202" r="2.5" fill="var(--muted)" opacity="0.5" />
  <circle cx="232" cy="202" r="2.5" fill="var(--muted)" opacity="0.5" />
  <circle cx="332" cy="202" r="2.5" fill="var(--muted)" opacity="0.5" />
  <circle cx="432" cy="202" r="2.5" fill="var(--muted)" opacity="0.5" />

  <!-- Flow Connectors -->
  <path d="M 63 106 L 63 72 L 184 72 L 184 92" class="flow-path" />
  <path d="M 242 152 L 258 152" class="flow-path flow-accent" />
  <path d="M 342 152 L 356 152" class="flow-path flow-accent" />
  <path d="M 450 132 Q 474 74 498 74" class="flow-path flow-accent" />
  <path d="M 450 152 L 498 152" class="flow-path" />
  <path d="M 450 172 Q 474 230 498 230" class="flow-path" />
  <path d="M 403 196 L 403 238 L 342 238 L 342 278" class="flow-path" />
  <path d="M 561 264 L 561 312" class="flow-path flow-accent" />
  <path d="M 428 348 L 478 348" class="flow-path flow-accent" />

  <!-- Travelling Packets -->
  <circle r="3.1" class="packet p-12" />
  <circle r="3" class="packet p-23" />
  <circle r="3" class="packet p-34" />
  <circle r="3" class="packet p-45a" />
  <circle r="3" class="packet p-45b" />
  <circle r="3" class="packet p-45c" />
  <circle r="3.1" class="packet p-4t" />
  <circle r="3.1" class="packet p-56" />
  <circle r="3.1" class="packet p-t6" />

  <!-- Connector Chips -->
  <g transform="translate(124, 72)">
    <rect x="-42" y="-7.5" width="84" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">email inbox + upload</text>
  </g>
  <g transform="translate(462, 46)">
    <rect x="-42" y="-7.5" width="84" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ accounting software</text>
  </g>
  <g transform="translate(561, 288)">
    <rect x="-32" y="-7.5" width="64" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ Drive folders</text>
  </g>

  <!-- STAGE 1: TRIGGER "Documents land" (Belt Start) -->
  <g id="stage-1" class="node">
    <rect x="16" y="106" width="94" height="90" rx="9" class="card-bg" />
    <text x="24" y="121" class="stage-num">01 · TRIGGER</text>
    <text x="24" y="133" class="stage-title">Documents land</text>
    <g class="doc-drop" transform="translate(26, 144)">
      <rect x="0" y="0" width="20" height="26" rx="3" class="chip-bg" />
      <rect x="24" y="4" width="20" height="26" rx="3" class="chip-bg" />
      <rect x="48" y="0" width="20" height="26" rx="3" class="chip-bg" />
    </g>
    <text x="24" y="186" class="stage-copy">PDFs, scans, photos</text>
  </g>

  <!-- STAGE 2: "Scanner reads" (Scanner Arch Bridge) -->
  <g id="stage-2" class="node">
    <rect x="126" y="92" width="116" height="104" rx="12" class="card-bg" />
    <text x="134" y="107" class="stage-num">02 · ARCH</text>
    <text x="134" y="119" class="stage-title">Scanner reads</text>
    <g class="ai-badge">
      <rect x="134" y="125" width="34" height="12" rx="6" class="chip-bg" />
      <text x="151" y="133.5" text-anchor="middle" class="chip-text-accent">Claude</text>
      <rect x="171" y="125" width="36" height="12" rx="6" class="chip-bg" />
      <text x="189" y="133.5" text-anchor="middle" class="chip-text-accent">OpenAI</text>
      <rect x="134" y="140" width="76" height="12" rx="6" class="chip-bg" />
      <text x="172" y="148.5" text-anchor="middle" class="chip-text-accent">computer vision · OCR</text>
    </g>

    <!-- Document + Light Sweep + Field Chips -->
    <rect x="136" y="157" width="30" height="32" rx="3" class="chip-bg" />
    <line x1="138" y1="158" x2="164" y2="158" stroke="var(--accent)" stroke-width="1.6" class="ocr-sweep" />
    <g class="fld-pop">
      <rect x="172" y="157" width="28" height="12" rx="6" class="chip-bg" /><text x="186" y="165.5" text-anchor="middle" class="chip-text">date</text>
      <rect x="204" y="157" width="28" height="12" rx="6" class="chip-bg" /><text x="218" y="165.5" text-anchor="middle" class="chip-text-accent">total</text>
      <rect x="172" y="173" width="30" height="12" rx="6" class="chip-bg" /><text x="187" y="181.5" text-anchor="middle" class="chip-text">from</text>
    </g>
  </g>

  <!-- STAGE 3: "Type sorted" (Centre) -->
  <g id="stage-3" class="node">
    <rect x="258" y="108" width="84" height="88" rx="9" class="card-bg" />
    <text x="266" y="123" class="stage-num">03 · SORT</text>
    <text x="266" y="135" class="stage-title">Type sorted</text>
    <g class="type-stamp" transform="translate(274, 146)">
      <rect x="0" y="0" width="52" height="22" rx="4" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.2" />
      <text x="26" y="13.5" text-anchor="middle" class="chip-text-accent">INVOICE</text>
    </g>
    <text x="266" y="184" class="stage-copy">Inv / Rec / Cont</text>
  </g>

  <!-- STAGE 4: "Totals checked" (Centre Right) -->
  <g id="stage-4" class="node">
    <rect x="356" y="108" width="94" height="88" rx="9" class="card-bg" />
    <text x="364" y="123" class="stage-num">04 · CHECK</text>
    <text x="364" y="135" class="stage-title">Totals checked</text>

    <text x="364" y="154" class="chip-text">$420 = $420</text>
    <path d="M 426 149 L 429 152 L 435 146" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" class="tot-tick" />

    <g class="wobble-card" transform="translate(364, 162)">
      <rect x="0" y="0" width="68" height="22" rx="4" class="chip-bg" />
      <text x="8" y="13.5" class="stage-copy">1 mismatch !</text>
    </g>
  </g>

  <!-- STAGE 5: THREE BINS + HUMAN TRAY -->
  <g id="stage-5" class="node">
    <!-- Bin 1: Accounting -->
    <rect x="498" y="60" width="126" height="52" rx="8" class="card-bg bin-bg" />
    <text x="508" y="75" class="stage-num">05A · BIN</text>
    <text x="508" y="88" class="stage-title">Accounting</text>
    <rect x="508" y="96" width="98" height="5" rx="2.5" fill="var(--accent)" class="bin-fill-1" />

    <!-- Bin 2: Expenses -->
    <rect x="498" y="124" width="126" height="52" rx="8" class="card-bg bin-bg" />
    <text x="508" y="139" class="stage-num">05B · BIN</text>
    <text x="508" y="152" class="stage-title">Expenses</text>
    <rect x="508" y="160" width="98" height="5" rx="2.5" fill="var(--accent)" fill-opacity="0.7" class="bin-fill-2" />

    <!-- Bin 3: Contracts -->
    <rect x="498" y="188" width="126" height="76" rx="8" class="card-bg bin-bg" />
    <text x="508" y="203" class="stage-num">05C · BIN</text>
    <text x="508" y="216" class="stage-title">Contracts</text>
    <text x="508" y="229" class="stage-copy">Key dates noted</text>
    <rect x="508" y="242" width="98" height="5" rx="2.5" fill="var(--accent)" fill-opacity="0.55" class="bin-fill-3" />

    <!-- Human Tray (Foreground) -->
    <rect x="256" y="278" width="172" height="106" rx="10" class="card-bg bin-bg" />
    <text x="266" y="295" class="stage-num">05D · EXCEPTION CHUTE</text>
    <text x="266" y="308" class="stage-title">Human tray</text>
    <g class="tray-drop" transform="translate(266, 320)">
      <rect x="0" y="0" width="148" height="36" rx="6" class="chip-bg" />
      <text x="10" y="16" class="chip-text-accent">Mismatched invoice #408</text>
      <text x="10" y="28" class="stage-copy">Held for quick review</text>
    </g>
  </g>

  <!-- STAGE 6: "Filed + entered" (Bottom Right, End) -->
  <g id="stage-6" class="node">
    <rect x="478" y="312" width="146" height="74" rx="10" class="card-bg" />
    <text x="488" y="328" class="stage-num">06 · FILED</text>
    <text x="488" y="341" class="stage-title">Filed + entered</text>
    <text x="488" y="357" class="stage-copy">Data in systems</text>
    <text x="488" y="368" class="stage-copy">Docs stored</text>

    <circle cx="598" cy="354" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 593 354 L 596.5 357.5 L 603.5 350.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
