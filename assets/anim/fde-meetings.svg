<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Meetings &amp; Action Items</title>
  <desc id="svg-desc">Six-stage pipeline with extraction fan-out and fan-in workflow for meetings: a recording lands on the top waveform bar via Zoom, Teams or Meet, speech-to-text transcribes down the left card, Claude summarises, three parallel extraction cards pull decisions, action items with owners, and open questions, a human confirms in a minute, and notes plus tasks send to email and Planner or Asana.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(20, 184, 166, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #14b8a6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.6px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.6px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.5px; fill: var(--muted); }
    .chip-text { font-size: 6.1px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.1px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 82 82 L 82 118"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 82 242 L 82 284"); animation: p23 9s linear infinite; }
    .p-34a { offset-path: path("M 152 304 L 178 304 L 178 98 L 270 98 L 270 118"); animation: p34 9s linear infinite; }
    .p-34b { offset-path: path("M 152 304 L 178 304 L 178 98 L 414 98 L 414 118"); animation: p34 9s linear infinite; }
    .p-34c { offset-path: path("M 152 304 L 178 304 L 178 98 L 558 98 L 558 118"); animation: p34 9s linear infinite; }
    .p-45a { offset-path: path("M 270 228 L 270 296"); animation: p45 9s linear infinite; }
    .p-45b { offset-path: path("M 414 228 Q 414 268 330 296"); animation: p45 9s linear infinite; }
    .p-45c { offset-path: path("M 558 228 Q 558 274 360 296"); animation: p45 9s linear infinite; }
    .p-56 { offset-path: path("M 376 342 L 474 342"); animation: p56 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 18% { opacity:1; offset-distance:100%; } 21%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,24% { opacity:0; offset-distance:0%; } 26% { opacity:1; } 31% { opacity:1; offset-distance:100%; } 34%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p34 { 0%,38% { opacity:0; offset-distance:0%; } 40% { opacity:1; } 48% { opacity:1; offset-distance:100%; } 51%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p45 { 0%,60% { opacity:0; offset-distance:0%; } 62% { opacity:1; } 69% { opacity:1; offset-distance:100%; } 72%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,78% { opacity:0; offset-distance:0%; } 80% { opacity:1; } 87% { opacity:1; offset-distance:100%; } 90%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .card-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .fan-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 17%,29% { stroke: var(--accent); stroke-width: 1.7; } 33%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,28% { stroke: var(--line); stroke-width: 1.1; } 31%,43% { stroke: var(--accent); stroke-width: 1.7; } 47%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,42% { stroke: var(--line); stroke-width: 1.1; } 46%,64% { stroke: var(--accent); stroke-width: 1.7; } 68%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,64% { stroke: var(--line); stroke-width: 1.1; } 68%,81% { stroke: var(--accent); stroke-width: 1.7; } 85%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,80% { stroke: var(--line); stroke-width: 1.1; } 84%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Waveform Bars Play */
    .wv-a { transform-box: fill-box; transform-origin: center; animation: wvA 1.4s ease-in-out infinite; }
    .wv-b { transform-box: fill-box; transform-origin: center; animation: wvB 1.4s ease-in-out infinite 0.25s; }
    .wv-c { transform-box: fill-box; transform-origin: center; animation: wvC 1.4s ease-in-out infinite 0.5s; }
    @keyframes wvA { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.2); } }
    @keyframes wvB { 0%,100% { transform: scaleY(0.7); } 50% { transform: scaleY(1.3); } }
    @keyframes wvC { 0%,100% { transform: scaleY(0.45); } 50% { transform: scaleY(1.15); } }

    /* Stage 2: Transcript Lines Type Rapidly */
    .tr-1 { transform-box: fill-box; transform-origin: left center; animation: tr1 9s ease-out infinite; }
    .tr-2 { transform-box: fill-box; transform-origin: left center; animation: tr2 9s ease-out infinite; }
    .tr-3 { transform-box: fill-box; transform-origin: left center; animation: tr3 9s ease-out infinite; }
    @keyframes tr1 { 0%,15% { transform: scaleX(0.05); opacity:0.25; } 20%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.25; } }
    @keyframes tr2 { 0%,18% { transform: scaleX(0.05); opacity:0.25; } 23%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.25; } }
    @keyframes tr3 { 0%,21% { transform: scaleX(0.05); opacity:0.25; } 26%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.25; } }

    /* Stage 3: Summary Compresses to Bold Lines */
    .sum-b { transform-box: fill-box; transform-origin: left center; animation: sumC 9s ease-out infinite; }
    @keyframes sumC { 0%,30% { transform: scaleX(0.2); opacity:0.35; } 38%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.2); opacity:0.35; } }

    /* Stage 4: Stamp Lands, Avatars Attach, Questions Pop */
    .stamp-d { transform-box: fill-box; transform-origin: center; animation: stD 9s ease-out infinite; }
    .av-pop { transform-box: fill-box; transform-origin: center; animation: avP 9s ease-out infinite; }
    .q-pop { transform-box: fill-box; transform-origin: center; animation: qP 9s ease-out infinite; }
    @keyframes stD { 0%,45% { opacity:0.25; transform:scale(1.3); } 51%,92% { opacity:1; transform:scale(1); } 98%,100% { opacity:0.25; } }
    @keyframes avP { 0%,49% { opacity:0.25; transform:scale(0.6); } 55%,92% { opacity:1; transform:scale(1); } 98%,100% { opacity:0.25; } }
    @keyframes qP { 0%,53% { opacity:0.25; transform:scale(0.6); } 59%,92% { opacity:1; transform:scale(1); } 98%,100% { opacity:0.25; } }

    /* Stage 5 and 6: Confirm Tick + Sent Cards + End Tick */
    .conf-tick { stroke-dasharray: 18; stroke-dashoffset: 18; animation: drawConf 9s ease-out infinite; }
    .send-fly { animation: flyOut 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }
    @keyframes drawConf { 0%,68% { stroke-dashoffset: 18; } 76%,94% { stroke-dashoffset: 0; } 99%,100% { stroke-dashoffset: 18; } }
    @keyframes flyOut { 0%,82% { opacity:0.35; transform:translateX(-6px); } 89%,96% { opacity:1; transform:translateX(0); } 100% { opacity:0.35; } }
    @keyframes drawFinal { 0%,88% { stroke-dashoffset: 24; } 94%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Meetings &amp; Action Items</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Recording → transcript → 3-way extract → email + Planner/Asana</text>

  <!-- Flow Connectors -->
  <path d="M 82 82 L 82 118" class="flow-path" />
  <path d="M 82 242 L 82 284" class="flow-path flow-accent" />
  <path d="M 152 304 L 178 304 L 178 98 L 558 98 L 558 118" class="flow-path flow-accent" />
  <path d="M 270 98 L 270 118" class="flow-path flow-accent" />
  <path d="M 414 98 L 414 118" class="flow-path flow-accent" />
  <path d="M 270 228 L 270 296" class="flow-path" />
  <path d="M 414 228 Q 414 268 330 296" class="flow-path" />
  <path d="M 558 228 Q 558 274 360 296" class="flow-path" />
  <path d="M 376 342 L 474 342" class="flow-path flow-accent" />

  <!-- Travelling Packets -->
  <circle r="3.1" class="packet p-12" />
  <circle r="3.1" class="packet p-23" />
  <circle r="3" class="packet p-34a" />
  <circle r="3" class="packet p-34b" />
  <circle r="3" class="packet p-34c" />
  <circle r="3" class="packet p-45a" />
  <circle r="3" class="packet p-45b" />
  <circle r="3" class="packet p-45c" />
  <circle r="3.2" class="packet p-56" />

  <!-- Connector Chips -->
  <g transform="translate(82, 100)">
    <rect x="-42" y="-7.5" width="84" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">Zoom / Teams / Meet</text>
  </g>
  <g transform="translate(82, 263)">
    <rect x="-18" y="-7.5" width="36" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">API</text>
  </g>
  <g transform="translate(178, 200)">
    <rect x="-20" y="-7.5" width="40" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">extract</text>
  </g>
  <g transform="translate(425, 342)">
    <rect x="-44" y="-8" width="88" height="16" rx="8" class="chip-bg" />
    <text x="0" y="2.3" text-anchor="middle" class="chip-text-accent">→ email + Planner/Asana</text>
  </g>

  <!-- STAGE 1: TRIGGER "Recording lands" (Top Recording Bar) -->
  <g id="stage-1" class="node">
    <rect x="16" y="34" width="608" height="48" rx="10" class="card-bg" />
    <text x="26" y="51" class="stage-num">01 · TRIGGER</text>
    <text x="26" y="64" class="stage-title">Recording lands</text>
    <text x="26" y="75" class="stage-copy">Meeting ends</text>

    <!-- Waveform Bars -->
    <g transform="translate(178, 58)">
      <rect x="0" y="-8" width="5" height="16" rx="2" fill="var(--accent)" class="wv-a" />
      <rect x="18" y="-14" width="5" height="28" rx="2" fill="var(--accent)" class="wv-b" />
      <rect x="36" y="-10" width="5" height="20" rx="2" fill="var(--accent)" class="wv-c" />
      <rect x="54" y="-16" width="5" height="32" rx="2" fill="var(--accent)" class="wv-a" />
      <rect x="72" y="-11" width="5" height="22" rx="2" fill="var(--accent)" class="wv-b" />
      <rect x="90" y="-15" width="5" height="30" rx="2" fill="var(--accent)" class="wv-c" />
      <rect x="108" y="-9" width="5" height="18" rx="2" fill="var(--accent)" class="wv-a" />
      <rect x="126" y="-14" width="5" height="28" rx="2" fill="var(--accent)" class="wv-b" />
      <rect x="144" y="-11" width="5" height="22" rx="2" fill="var(--accent)" class="wv-c" />
      <rect x="162" y="-16" width="5" height="32" rx="2" fill="var(--accent)" class="wv-a" />
      <rect x="180" y="-10" width="5" height="20" rx="2" fill="var(--accent)" class="wv-b" />
      <rect x="198" y="-13" width="5" height="26" rx="2" fill="var(--accent)" class="wv-c" />
      <rect x="216" y="-8" width="5" height="16" rx="2" fill="var(--accent)" class="wv-a" />
      <rect x="234" y="-15" width="5" height="30" rx="2" fill="var(--accent)" class="wv-b" />
      <rect x="252" y="-10" width="5" height="20" rx="2" fill="var(--accent)" class="wv-c" />
      <rect x="270" y="-14" width="5" height="28" rx="2" fill="var(--accent)" class="wv-a" />
      <rect x="288" y="-9" width="5" height="18" rx="2" fill="var(--accent)" class="wv-b" />
      <rect x="306" y="-12" width="5" height="24" rx="2" fill="var(--accent)" class="wv-c" />
      <rect x="324" y="-15" width="5" height="30" rx="2" fill="var(--accent)" class="wv-a" />
      <rect x="342" y="-10" width="5" height="20" rx="2" fill="var(--accent)" class="wv-b" />
      <rect x="360" y="-13" width="5" height="26" rx="2" fill="var(--accent)" class="wv-c" />
      <rect x="378" y="-8" width="5" height="16" rx="2" fill="var(--accent)" class="wv-a" />
      <rect x="396" y="-12" width="5" height="24" rx="2" fill="var(--accent)" class="wv-b" />
      <rect x="414" y="-7" width="5" height="14" rx="2" fill="var(--accent)" class="wv-c" />
    </g>
  </g>

  <!-- STAGE 2: "Transcribed" (Left, Below Bar) -->
  <g id="stage-2" class="node">
    <rect x="16" y="118" width="136" height="124" rx="10" class="card-bg" />
    <text x="25" y="133" class="stage-num">02 · TRANSCRIBE</text>
    <text x="25" y="145" class="stage-title">Transcribed</text>
    <g class="ai-badge">
      <rect x="25" y="151" width="60" height="13" rx="6.5" class="chip-bg" />
      <text x="55" y="160" text-anchor="middle" class="chip-text-accent">speech-to-text</text>
    </g>
    <text x="25" y="176" class="stage-copy">Fireflies · Otter</text>

    <rect x="25" y="186" width="114" height="4.5" rx="2" fill="var(--accent)" fill-opacity="0.7" class="tr-1" />
    <rect x="25" y="196" width="98" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.45" class="tr-2" />
    <rect x="25" y="206" width="108" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.45" class="tr-2" />
    <rect x="25" y="216" width="84" height="4.5" rx="2" fill="var(--muted)" fill-opacity="0.45" class="tr-3" />
    <rect x="25" y="226" width="96" height="4.5" rx="2" fill="var(--muted)" fill-opacity="0.45" class="tr-3" />
  </g>

  <!-- STAGE 3: "Summarised" (Bottom Left) -->
  <g id="stage-3" class="node">
    <rect x="16" y="284" width="136" height="102" rx="10" class="card-bg" />
    <text x="25" y="299" class="stage-num">03 · SUMMARISE</text>
    <text x="25" y="311" class="stage-title">Summarised</text>
    <g class="ai-badge">
      <rect x="25" y="317" width="38" height="13" rx="6.5" class="chip-bg" />
      <text x="44" y="326" text-anchor="middle" class="chip-text-accent">Claude</text>
    </g>

    <rect x="25" y="338" width="110" height="6" rx="2.5" fill="var(--accent)" fill-opacity="0.75" class="sum-b" />
    <rect x="25" y="350" width="92" height="6" rx="2.5" fill="var(--ink)" fill-opacity="0.5" class="sum-b" />
    <rect x="25" y="362" width="100" height="6" rx="2.5" fill="var(--ink)" fill-opacity="0.5" class="sum-b" />
  </g>

  <!-- STAGE 4: FAN-OUT (Three Cards in a Row) -->
  <g id="stage-4" class="node">
    <!-- Decisions -->
    <rect x="204" y="118" width="132" height="110" rx="10" class="card-bg fan-bg" />
    <text x="214" y="134" class="stage-num">04A · EXTRACT</text>
    <text x="214" y="146" class="stage-title">Decisions</text>
    <g class="stamp-d" transform="translate(242, 162)">
      <rect x="0" y="0" width="56" height="28" rx="5" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
      <text x="28" y="17" text-anchor="middle" class="chip-text-accent">DECIDED</text>
    </g>
    <text x="214" y="212" class="stage-copy">Key call outcomes</text>

    <!-- Action items + owners -->
    <rect x="348" y="118" width="132" height="110" rx="10" class="card-bg fan-bg" />
    <text x="358" y="134" class="stage-num">04B · EXTRACT</text>
    <text x="358" y="146" class="stage-title">Action items</text>
    <text x="358" y="157" class="stage-copy">+ owners</text>
    <g class="av-pop" transform="translate(360, 168)">
      <circle cx="8" cy="8" r="7" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="1" />
      <rect x="20" y="5" width="76" height="5" rx="2" fill="var(--ink)" fill-opacity="0.45" />
      <circle cx="8" cy="28" r="7" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="1" />
      <rect x="20" y="25" width="66" height="5" rx="2" fill="var(--ink)" fill-opacity="0.45" />
    </g>

    <!-- Open questions -->
    <rect x="492" y="118" width="132" height="110" rx="10" class="card-bg fan-bg" />
    <text x="502" y="134" class="stage-num">04C · EXTRACT</text>
    <text x="502" y="146" class="stage-title">Open questions</text>
    <g class="q-pop" transform="translate(528, 166)">
      <circle cx="12" cy="14" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.1" />
      <text x="12" y="18" text-anchor="middle" class="stage-title">?</text>
      <circle cx="46" cy="14" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.1" />
      <text x="46" y="18" text-anchor="middle" class="stage-title">?</text>
    </g>
    <text x="502" y="212" class="stage-copy">Follow-up items</text>
  </g>

  <!-- STAGE 5: "You confirm" (Bottom Centre) -->
  <g id="stage-5" class="node">
    <rect x="204" y="296" width="172" height="90" rx="10" class="card-bg" />
    <text x="214" y="312" class="stage-num">05 · CONFIRM</text>
    <text x="214" y="325" class="stage-title">You confirm</text>
    <g class="ai-badge">
      <rect x="214" y="333" width="84" height="14" rx="7" class="chip-bg" />
      <text x="256" y="342.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>
    <text x="214" y="366" class="stage-copy">1-minute summary check</text>
    <circle cx="348" cy="348" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.2" />
    <path d="M 343 348 L 346.5 351.5 L 353.5 344.5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="conf-tick" />
  </g>

  <!-- STAGE 6: "Notes + tasks sent" (Bottom Right, End) -->
  <g id="stage-6" class="node">
    <rect x="474" y="296" width="150" height="90" rx="10" class="card-bg" />
    <text x="484" y="312" class="stage-num">06 · SENT</text>
    <text x="484" y="325" class="stage-title">Notes + tasks sent</text>

    <g class="send-fly" transform="translate(484, 336)">
      <rect x="0" y="0" width="46" height="16" rx="4" class="chip-bg" />
      <text x="23" y="10.5" text-anchor="middle" class="chip-text">Notes</text>
      <rect x="52" y="0" width="46" height="16" rx="4" class="chip-bg" />
      <text x="75" y="10.5" text-anchor="middle" class="chip-text-accent">Tasks</text>
    </g>

    <circle cx="598" cy="364" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 593 364 L 596.5 367.5 L 603.5 360.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
