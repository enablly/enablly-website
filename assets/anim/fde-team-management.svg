<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Team Management</title>
  <desc id="svg-desc">Six-stage dispatch hub-and-spoke workflow with return pings for team management: meeting decisions arrive via webhook, Claude writes and routes tasks from the central hub to Planner or Asana across four owner nodes (Design, Sales, Ops, Support), status pings return to the hub, Power Automate sends scheduled nudges, an overdue exception waves a flag down an escalation path, and a compiled status summary lands in the manager's inbox.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(20, 184, 166, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #14b8a6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.6px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.7px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.8px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.6px; fill: var(--muted); }
    .chip-text { font-size: 6.2px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.2px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    .flow-return { fill: none; stroke: var(--muted); stroke-width: 0.95; stroke-dasharray: 2 3; opacity: 0.7; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .packet-ret { fill: var(--ink); opacity: 0; }
    .p-12 { offset-path: path("M 87 124 L 87 170"); animation: p12 9s linear infinite; }
    .p-23a { offset-path: path("M 182 200 Q 256 68 332 68"); animation: p23 9s linear infinite; }
    .p-23b { offset-path: path("M 182 216 Q 290 130 404 130"); animation: p23 9s linear infinite; }
    .p-23c { offset-path: path("M 182 236 Q 290 198 404 198"); animation: p23 9s linear infinite; }
    .p-23d { offset-path: path("M 182 254 Q 256 262 332 262"); animation: p23 9s linear infinite; }
    .p-ret1 { offset-path: path("M 404 138 Q 290 142 182 224"); animation: pret 9s linear infinite; }
    .p-ret2 { offset-path: path("M 332 270 Q 256 274 182 262"); animation: pret 9s linear infinite; }
    .p-24 { offset-path: path("M 102 294 L 102 354 L 190 354"); animation: p24 9s linear infinite; }
    .p-35 { offset-path: path("M 442 256 L 498 246"); animation: p35 9s linear infinite; }
    .p-56 { offset-path: path("M 561 278 L 561 318"); animation: p56 9s linear infinite; }
    .p-46 { offset-path: path("M 352 354 L 434 354"); animation: p46 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 18% { opacity:1; offset-distance:100%; } 21%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,27% { opacity:0; offset-distance:0%; } 29% { opacity:1; } 36% { opacity:1; offset-distance:100%; } 39%,100% { opacity:0; offset-distance:100%; } }
    @keyframes pret { 0%,44% { opacity:0; offset-distance:0%; } 46% { opacity:0.85; } 53% { opacity:0.85; offset-distance:100%; } 56%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p24 { 0%,52% { opacity:0; offset-distance:0%; } 54% { opacity:1; } 61% { opacity:1; offset-distance:100%; } 64%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p35 { 0%,64% { opacity:0; offset-distance:0%; } 66% { opacity:1; } 72% { opacity:1; offset-distance:100%; } 75%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,75% { opacity:0; offset-distance:0%; } 77% { opacity:1; } 84% { opacity:1; offset-distance:100%; } 87%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p46 { 0%,77% { opacity:0; offset-distance:0%; } 79% { opacity:1; } 86% { opacity:1; offset-distance:100%; } 89%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .owner-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 18%,32% { stroke: var(--accent); stroke-width: 1.7; } 36%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,32% { stroke: var(--line); stroke-width: 1.1; } 36%,54% { stroke: var(--accent); stroke-width: 1.7; } 58%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,54% { stroke: var(--line); stroke-width: 1.1; } 58%,70% { stroke: var(--accent); stroke-width: 1.7; } 74%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,66% { stroke: var(--line); stroke-width: 1.1; } 70%,82% { stroke: var(--accent); stroke-width: 1.9; } 86%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,80% { stroke: var(--line); stroke-width: 1.1; } 84%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Decision Lines Type */
    .dec-1 { transform-box: fill-box; transform-origin: left center; animation: dl1 9s ease-out infinite; }
    .dec-2 { transform-box: fill-box; transform-origin: left center; animation: dl2 9s ease-out infinite; }
    @keyframes dl1 { 0%,2% { transform: scaleX(0.05); opacity:0.3; } 8%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.3; } }
    @keyframes dl2 { 0%,5% { transform: scaleX(0.05); opacity:0.3; } 11%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.3; } }

    /* Stage 2: Task Cards Fan Inside Hub */
    .fan-l { transform-box: fill-box; transform-origin: bottom center; animation: fL 9s ease-in-out infinite; }
    .fan-r { transform-box: fill-box; transform-origin: bottom center; animation: fR 9s ease-in-out infinite; }
    @keyframes fL { 0%,18% { transform: rotate(0deg); } 25%,32% { transform: rotate(-10deg); } 40%,100% { transform: rotate(0deg); } }
    @keyframes fR { 0%,18% { transform: rotate(0deg); } 25%,32% { transform: rotate(10deg); } 40%,100% { transform: rotate(0deg); } }

    /* Stage 3: Owner Checkboxes Tick Staggered */
    .ow-1 { stroke-dasharray: 14; stroke-dashoffset: 14; animation: o1 9s ease-out infinite; }
    .ow-2 { stroke-dasharray: 14; stroke-dashoffset: 14; animation: o2 9s ease-out infinite; }
    .ow-3 { stroke-dasharray: 14; stroke-dashoffset: 14; animation: o3 9s ease-out infinite; }
    .ow-4 { stroke-dasharray: 14; stroke-dashoffset: 14; animation: o4 9s ease-out infinite; }
    @keyframes o1 { 0%,35% { stroke-dashoffset: 14; } 40%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 14; } }
    @keyframes o2 { 0%,38% { stroke-dashoffset: 14; } 43%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 14; } }
    @keyframes o3 { 0%,41% { stroke-dashoffset: 14; } 46%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 14; } }
    @keyframes o4 { 0%,44% { stroke-dashoffset: 14; } 49%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 14; } }

    /* Stage 4: Bell Pulses Twice */
    .nudge-bell { transform-box: fill-box; transform-origin: top center; animation: bellPulse 9s ease-in-out infinite; }
    @keyframes bellPulse { 0%,57%,68%,100% { transform: rotate(0deg); } 60% { transform: rotate(12deg); } 62% { transform: rotate(-10deg); } 64% { transform: rotate(10deg); } 66% { transform: rotate(-6deg); } }

    /* Stage 5: Exception Flag Waves */
    .flag-wave { transform-box: fill-box; transform-origin: left center; animation: waveF 9s ease-in-out infinite; }
    @keyframes waveF { 0%,68%,84%,100% { transform: rotate(0deg); } 72% { transform: rotate(-8deg); } 76% { transform: rotate(8deg); } 80% { transform: rotate(-6deg); } }

    /* Stage 6: Summary Lines Fill + End Tick */
    .sum-1 { transform-box: fill-box; transform-origin: left center; animation: sm1 9s ease-out infinite; }
    .sum-2 { transform-box: fill-box; transform-origin: left center; animation: sm2 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }
    @keyframes sm1 { 0%,82% { transform: scaleX(0.05); opacity:0.3; } 88%,96% { transform: scaleX(1); opacity:1; } 100% { transform: scaleX(0.05); opacity:0.3; } }
    @keyframes sm2 { 0%,85% { transform: scaleX(0.05); opacity:0.3; } 91%,96% { transform: scaleX(1); opacity:1; } 100% { transform: scaleX(0.05); opacity:0.3; } }
    @keyframes drawFinal { 0%,88% { stroke-dashoffset: 24; } 94%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Team Management &amp; Follow-Up</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Meeting notes → hub → 4 owners → inbox</text>

    <defs>
    <mask id="cutout-team-management">
      <rect width="640" height="400" fill="white" />
      <rect x="39.5" y="138.0" width="95.0" height="18.0" rx="7.5" fill="black" />
      <rect x="224.5" y="137.0" width="75.0" height="18.0" rx="7.5" fill="black" />
      <rect x="88.5" y="345.0" width="71.0" height="18.0" rx="7.5" fill="black" />
      <rect x="535.5" y="289.0" width="51.0" height="18.0" rx="7.5" fill="black" />
      <rect x="363.5" y="345.0" width="59.0" height="18.0" rx="7.5" fill="black" />
    </mask>
  </defs>

  <!-- Flow Connectors (Out & Back Spokes) -->
  <g mask="url(#cutout-team-management)">
  <path d="M 87 124 L 87 170" class="flow-path" />
  <path d="M 182 200 Q 256 68 332 68" class="flow-path flow-accent" />
  <path d="M 182 216 Q 290 130 404 130" class="flow-path flow-accent" />
  <path d="M 182 236 Q 290 198 404 198" class="flow-path flow-accent" />
  <path d="M 182 254 Q 256 262 332 262" class="flow-path flow-accent" />
  </g>
<!-- Thinner Return Ping Paths -->
  <path d="M 404 138 Q 290 142 182 224" class="flow-return" />
  <path d="M 332 270 Q 256 274 182 262" class="flow-return" />

  <path d="M 102 294 L 102 354 L 190 354" class="flow-path" />
  <path d="M 442 256 L 498 246" class="flow-path" />
  <path d="M 561 278 L 561 318" class="flow-path flow-accent" />
  <path d="M 352 354 L 434 354" class="flow-path flow-accent" />

  <!-- Travelling Packets (Out & Return Pings) -->
  <circle r="3.2" class="packet p-12" />
  <circle r="3" class="packet p-23a" />
  <circle r="3" class="packet p-23b" />
  <circle r="3" class="packet p-23c" />
  <circle r="3" class="packet p-23d" />
  <circle r="2.4" class="packet-ret p-ret1" />
  <circle r="2.4" class="packet-ret p-ret2" />
  <circle r="3.1" class="packet p-24" />
  <circle r="3" class="packet p-35" />
  <circle r="3.1" class="packet p-56" />
  <circle r="3.1" class="packet p-46" />

  <!-- Connector Chips -->
  <g transform="translate(87, 147)">
    <rect x="-46" y="-7.5" width="92" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">Meeting notes → webhook</text>
  </g>
  <g transform="translate(262, 146)">
    <rect x="-36" y="-7.5" width="72" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ Planner / Asana</text>
  </g>
  <g transform="translate(124, 354)">
    <rect x="-34" y="-7.5" width="68" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">scheduled nudge</text>
  </g>
  <g transform="translate(561, 298)">
    <rect x="-24" y="-7.5" width="48" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">escalation</text>
  </g>
  <g transform="translate(393, 354)">
    <rect x="-28" y="-7.5" width="56" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ your inbox</text>
  </g>

  <!-- STAGE 1: TRIGGER "Decisions land" (Top Left) -->
  <g id="stage-1" class="node">
    <rect x="16" y="40" width="142" height="84" rx="10" class="card-bg" />
    <text x="25" y="55" class="stage-num">01 · TRIGGER</text>
    <text x="25" y="67" class="stage-title">Decisions land</text>
    <text x="25" y="79" class="stage-copy">Meeting notes + chat</text>
    <rect x="25" y="88" width="114" height="4.5" rx="2" fill="var(--accent)" fill-opacity="0.7" class="dec-1" />
    <rect x="25" y="97" width="94" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.45" class="dec-2" />
    <rect x="25" y="106" width="104" height="4.5" rx="2" fill="var(--muted)" fill-opacity="0.45" class="dec-2" />
  </g>

  <!-- STAGE 2: HUB "Tasks written + routed" (Centre-Left Hub) -->
  <g id="stage-2" class="node">
    <rect x="24" y="170" width="158" height="124" rx="14" class="card-bg" />
    <text x="34" y="186" class="stage-num">02 · HUB</text>
    <text x="34" y="198" class="stage-title">Tasks written + routed</text>

    <g class="ai-badge">
      <rect x="34" y="205" width="38" height="14" rx="7" class="chip-bg" />
      <text x="53" y="214.5" text-anchor="middle" class="chip-text-accent">Claude</text>
    </g>

    <!-- Fanning Task Cards Inside Hub -->
    <g transform="translate(88, 232)">
      <rect x="0" y="0" width="32" height="42" rx="4" class="chip-bg fan-l" />
      <rect x="4" y="0" width="32" height="42" rx="4" class="chip-bg fan-r" />
      <rect x="2" y="0" width="32" height="42" rx="4" class="chip-bg" />
      <rect x="7" y="10" width="22" height="3.5" rx="1.5" fill="var(--accent)" />
      <rect x="7" y="18" width="18" height="3.5" rx="1.5" fill="var(--ink)" fill-opacity="0.4" />
    </g>
    <text x="34" y="280" class="stage-copy">Assigned</text>
  </g>

  <!-- STAGE 3: OWNERS (Four Owner Nodes in Right-Hand Arc) -->
  <g id="stage-3" class="node">
    <!-- Design -->
    <rect x="332" y="40" width="110" height="54" rx="9" class="card-bg owner-bg" />
    <text x="342" y="55" class="stage-num">03A · OWNER</text>
    <text x="342" y="67" class="stage-title">Design</text>
    <text x="342" y="81" class="stage-copy">Mockups task</text>
    <rect x="418" y="56" width="14" height="14" rx="3" class="chip-bg" />
    <path d="M 421 63 L 424 66 L 429 60" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="ow-1" />

    <!-- Sales -->
    <rect x="404" y="104" width="110" height="54" rx="9" class="card-bg owner-bg" />
    <text x="414" y="119" class="stage-num">03B · OWNER</text>
    <text x="414" y="131" class="stage-title">Sales</text>
    <text x="414" y="145" class="stage-copy">Follow-up call</text>
    <rect x="490" y="120" width="14" height="14" rx="3" class="chip-bg" />
    <path d="M 493 127 L 496 130 L 501 124" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="ow-2" />

    <!-- Ops -->
    <rect x="404" y="170" width="110" height="54" rx="9" class="card-bg owner-bg" />
    <text x="414" y="185" class="stage-num">03C · OWNER</text>
    <text x="414" y="197" class="stage-title">Ops</text>
    <text x="414" y="211" class="stage-copy">Vendor check</text>
    <rect x="490" y="186" width="14" height="14" rx="3" class="chip-bg" />
    <path d="M 493 193 L 496 196 L 501 190" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="ow-3" />

    <!-- Support -->
    <rect x="332" y="234" width="110" height="54" rx="9" class="card-bg owner-bg" />
    <text x="342" y="249" class="stage-num">03D · OWNER</text>
    <text x="342" y="261" class="stage-title">Support</text>
    <text x="342" y="275" class="stage-copy">Ticket reply</text>
    <rect x="418" y="250" width="14" height="14" rx="3" class="chip-bg" />
    <path d="M 421 257 L 424 260 L 429 254" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="ow-4" />
  </g>

  <!-- STAGE 4: "Progress chased" (Bottom Centre) -->
  <g id="stage-4" class="node">
    <rect x="190" y="318" width="162" height="70" rx="10" class="card-bg" />
    <text x="200" y="333" class="stage-num">04 · CHASE</text>
    <text x="200" y="345" class="stage-title">Progress chased</text>
    <g class="ai-badge">
      <rect x="200" y="352" width="70" height="14" rx="7" class="chip-bg" />
      <text x="235" y="361.5" text-anchor="middle" class="chip-text-accent">Power Automate</text>
    </g>
    <!-- Bell Icon Pulsing -->
    <g transform="translate(324, 344)"><g class="nudge-bell">
      <path d="M 0 0 C -5 0 -7 5 -7 11 L -9 14 H 9 L 7 11 C 7 5 5 0 0 0 Z" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="1.3" />
      <circle cx="0" cy="17" r="2" fill="var(--accent)" />
    </g></g>
  </g>

  <!-- STAGE 5: "Exception flagged" (Owner Exception + Flag) -->
  <g id="stage-5" class="node">
    <rect x="498" y="214" width="126" height="64" rx="10" class="card-bg" />
    <text x="507" y="229" class="stage-num">05 · EXCEPTION</text>
    <text x="507" y="241" class="stage-title">Exception flagged</text>
    <text x="507" y="254" class="stage-copy">Overdue / blocked</text>

    <!-- Waving Flag -->
    <g transform="translate(602, 232)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round" />
      <polygon points="0,0 14,4 0,10" fill="var(--accent)" class="flag-wave" />
    </g>
  </g>

  <!-- STAGE 6: "Status summary ready" (Bottom Right, End) -->
  <g id="stage-6" class="node">
    <rect x="434" y="318" width="190" height="70" rx="10" class="card-bg" />
    <text x="444" y="333" class="stage-num">06 · SUMMARY</text>
    <text x="444" y="345" class="stage-title">Status summary ready</text>

    <rect x="444" y="355" width="128" height="4.5" rx="2" fill="var(--ink)" fill-opacity="0.45" class="sum-1" />
    <rect x="444" y="365" width="106" height="4.5" rx="2" fill="var(--muted)" fill-opacity="0.45" class="sum-2" />

    <circle cx="598" cy="356" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 593 356 L 596.5 359.5 L 603.5 352.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
