<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Proposals &amp; Quotations</title>
  <desc id="svg-desc">Seven-stage document assembly line workflow for proposals and quotations: a client enquiry arrives via Zapier, a template is placed on the horizontal conveyor, Claude slots in sections from past proposals, client details fill from CRM, Microsoft Copilot builds pricing from the rate card, a human reviews and approves, and the final proposal seals to PDF and Google Drive.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(59, 130, 246, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #3b82f6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.6px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.7px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.6px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.6px; fill: var(--muted); }
    .chip-text { font-size: 6.2px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.2px; font-weight: 700; fill: var(--accent); }
    .counter-text { font-size: 8.2px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .bin-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 2; }
    .belt-track { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 61 132 L 61 106 L 151 106 L 151 146"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 151 246 L 151 290 L 236 290 L 236 246"); animation: p23 9s linear infinite; }
    .p-b3 { offset-path: path("M 243 84 L 243 132"); animation: pb3 9s linear infinite; }
    .p-34 { offset-path: path("M 290 190 L 306 190"); animation: p34 9s linear infinite; }
    .p-b4 { offset-path: path("M 352 84 L 352 132"); animation: pb4 9s linear infinite; }
    .p-45 { offset-path: path("M 398 190 L 414 190"); animation: p45 9s linear infinite; }
    .p-b5 { offset-path: path("M 462 84 L 462 132"); animation: pb5 9s linear infinite; }
    .p-56 { offset-path: path("M 510 190 L 526 190"); animation: p56 9s linear infinite; }
    .p-67 { offset-path: path("M 575 246 L 575 296"); animation: p67 9s linear infinite; }

    @keyframes p12 { 0%,8% { opacity:0; offset-distance:0%; } 10% { opacity:1; } 17% { opacity:1; offset-distance:100%; } 20%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,20% { opacity:0; offset-distance:0%; } 22% { opacity:1; } 29% { opacity:1; offset-distance:100%; } 32%,100% { opacity:0; offset-distance:100%; } }
    @keyframes pb3 { 0%,30% { opacity:0; offset-distance:0%; } 32% { opacity:1; } 38% { opacity:1; offset-distance:100%; } 41%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p34 { 0%,41% { opacity:0; offset-distance:0%; } 43% { opacity:1; } 47% { opacity:1; offset-distance:100%; } 50%,100% { opacity:0; offset-distance:100%; } }
    @keyframes pb4 { 0%,44% { opacity:0; offset-distance:0%; } 46% { opacity:1; } 52% { opacity:1; offset-distance:100%; } 55%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p45 { 0%,55% { opacity:0; offset-distance:0%; } 57% { opacity:1; } 61% { opacity:1; offset-distance:100%; } 64%,100% { opacity:0; offset-distance:100%; } }
    @keyframes pb5 { 0%,58% { opacity:0; offset-distance:0%; } 60% { opacity:1; } 66% { opacity:1; offset-distance:100%; } 69%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,69% { opacity:0; offset-distance:0%; } 71% { opacity:1; } 75% { opacity:1; offset-distance:100%; } 78%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p67 { 0%,80% { opacity:0; offset-distance:0%; } 82% { opacity:1; } 89% { opacity:1; offset-distance:100%; } 92%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .card-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }
    #stage-7 .card-bg { animation: s7Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,13% { stroke: var(--accent); stroke-width: 1.7; } 17%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 17%,28% { stroke: var(--accent); stroke-width: 1.7; } 32%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,28% { stroke: var(--line); stroke-width: 1.1; } 31%,44% { stroke: var(--accent); stroke-width: 1.7; } 48%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,43% { stroke: var(--line); stroke-width: 1.1; } 46%,58% { stroke: var(--accent); stroke-width: 1.7; } 62%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,57% { stroke: var(--line); stroke-width: 1.1; } 60%,72% { stroke: var(--accent); stroke-width: 1.7; } 76%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,71% { stroke: var(--line); stroke-width: 1.1; } 74%,84% { stroke: var(--accent); stroke-width: 1.7; } 88%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s7Hi { 0%,84% { stroke: var(--line); stroke-width: 1.1; } 87%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Email Lines Highlight */
    .em-line { animation: emHl 9s ease-out infinite; }
    @keyframes emHl { 0%,2% { opacity: 0.35; } 8%,90% { opacity: 1; } 98%,100% { opacity: 0.35; } }

    /* Stage 2: Empty Outline Fades In */
    .doc-skel { animation: skelIn 9s ease-out infinite; }
    @keyframes skelIn { 0%,16% { opacity: 0.2; } 24%,90% { opacity: 1; } 98%,100% { opacity: 0.2; } }

    /* Stage 3: Section Blocks Drop In */
    .sec-drop-1 { animation: drop1 9s ease-out infinite; }
    .sec-drop-2 { animation: drop2 9s ease-out infinite; }
    @keyframes drop1 { 0%,31% { opacity:0.2; transform:translateY(-8px); } 38%,90% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.2; } }
    @keyframes drop2 { 0%,35% { opacity:0.2; transform:translateY(-8px); } 42%,90% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.2; } }

    /* Stage 4: Blank Fields Fill */
    .fld-1 { transform-box: fill-box; transform-origin: left center; animation: fl1 9s ease-out infinite; }
    .fld-2 { transform-box: fill-box; transform-origin: left center; animation: fl2 9s ease-out infinite; }
    @keyframes fl1 { 0%,46% { transform: scaleX(0.1); opacity:0.25; } 52%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.1); opacity:0.25; } }
    @keyframes fl2 { 0%,49% { transform: scaleX(0.1); opacity:0.25; } 55%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.1); opacity:0.25; } }

    /* Stage 5: Pricing Rows + Total Counts Up */
    .tot-1 { opacity: 1; animation: t1 9s linear infinite; }
    .tot-2 { opacity: 0; animation: t2 9s linear infinite; }
    .tot-3 { opacity: 0; animation: t3 9s linear infinite; }
    @keyframes t1 { 0%,62% { opacity:1; } 64%,95% { opacity:0; } 98%,100% { opacity:1; } }
    @keyframes t2 { 0%,62% { opacity:0; } 64%,68% { opacity:1; } 70%,100% { opacity:0; } }
    @keyframes t3 { 0%,68% { opacity:0; } 70%,94% { opacity:1; } 98%,100% { opacity:0; } }

    /* Stage 6 and 7: Review Tick + Final Seal Tick */
    .rev-tick { stroke-dasharray: 18; stroke-dashoffset: 18; animation: drawRev 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 26; stroke-dashoffset: 26; animation: drawFinal 9s ease-out infinite; }
    @keyframes drawRev { 0%,74% { stroke-dashoffset: 18; } 81%,94% { stroke-dashoffset: 0; } 99%,100% { stroke-dashoffset: 18; } }
    @keyframes drawFinal { 0%,88% { stroke-dashoffset: 26; } 94%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 26; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Proposals &amp; Quotations</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Email → Zapier → feeder bins → PDF + Drive</text>

  <!-- Three Overhead Feeder Bins -->
  <g>
    <rect x="196" y="42" width="94" height="42" rx="8" class="bin-bg" />
    <text x="243" y="59" text-anchor="middle" class="stage-copy">FEEDER BIN 1</text>
    <text x="243" y="72" text-anchor="middle" class="stage-title">Past proposals</text>

    <rect x="306" y="42" width="92" height="42" rx="8" class="bin-bg" />
    <text x="352" y="59" text-anchor="middle" class="stage-copy">FEEDER BIN 2</text>
    <text x="352" y="72" text-anchor="middle" class="stage-title">Client details</text>

    <rect x="414" y="42" width="96" height="42" rx="8" class="bin-bg" />
    <text x="462" y="59" text-anchor="middle" class="stage-copy">FEEDER BIN 3</text>
    <text x="462" y="72" text-anchor="middle" class="stage-title">Rate card</text>
  </g>

  <!-- Horizontal Conveyor Belt -->
  <rect x="16" y="254" width="608" height="12" rx="6" class="belt-track" />
  <circle cx="32" cy="260" r="2.5" fill="var(--muted)" opacity="0.5" />
  <circle cx="152" cy="260" r="2.5" fill="var(--muted)" opacity="0.5" />
  <circle cx="272" cy="260" r="2.5" fill="var(--muted)" opacity="0.5" />
  <circle cx="392" cy="260" r="2.5" fill="var(--muted)" opacity="0.5" />
  <circle cx="512" cy="260" r="2.5" fill="var(--muted)" opacity="0.5" />
  <circle cx="608" cy="260" r="2.5" fill="var(--muted)" opacity="0.5" />

    <defs>
    <mask id="cutout-proposals-and-quotations">
      <rect width="640" height="400" fill="white" />
      <rect x="64.5" y="97.0" width="83.0" height="18.0" rx="7.5" fill="black" />
      <rect x="158.5" y="281.0" width="71.0" height="18.0" rx="7.5" fill="black" />
      <rect x="203.5" y="99.0" width="79.0" height="18.0" rx="7.5" fill="black" />
      <rect x="324.5" y="99.0" width="55.0" height="18.0" rx="7.5" fill="black" />
      <rect x="430.5" y="99.0" width="63.0" height="18.0" rx="7.5" fill="black" />
      <rect x="541.5" y="263.0" width="67.0" height="18.0" rx="7.5" fill="black" />
    </mask>
  </defs>

  <!-- Flow Connectors -->
  <g mask="url(#cutout-proposals-and-quotations)">
  <path d="M 61 132 L 61 106 L 151 106 L 151 146" class="flow-path" />
  <path d="M 151 246 L 151 290 L 236 290 L 236 246" class="flow-path" />
  <path d="M 243 84 L 243 132" class="flow-path flow-accent" />
  <path d="M 290 190 L 306 190" class="flow-path flow-accent" />
  <path d="M 352 84 L 352 132" class="flow-path flow-accent" />
  <path d="M 398 190 L 414 190" class="flow-path flow-accent" />
  <path d="M 462 84 L 462 132" class="flow-path flow-accent" />
  <path d="M 510 190 L 526 190" class="flow-path" />
  <path d="M 575 246 L 575 296" class="flow-path flow-accent" />
  </g>
<!-- Travelling Packets -->
  <circle r="3.1" class="packet p-12" />
  <circle r="3.1" class="packet p-23" />
  <circle r="3.1" class="packet p-b3" />
  <circle r="3.1" class="packet p-34" />
  <circle r="3.1" class="packet p-b4" />
  <circle r="3.1" class="packet p-45" />
  <circle r="3.1" class="packet p-b5" />
  <circle r="3.1" class="packet p-56" />
  <circle r="3.2" class="packet p-67" />

  <!-- Connector Chips -->
  <g transform="translate(106, 106)">
    <rect x="-40" y="-7.5" width="80" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">New email → Zapier</text>
  </g>
  <g transform="translate(194, 290)">
    <rect x="-34" y="-7.5" width="68" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">template library</text>
  </g>
  <g transform="translate(243, 108)">
    <rect x="-38" y="-7.5" width="76" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">from past proposals</text>
  </g>
  <g transform="translate(352, 108)">
    <rect x="-26" y="-7.5" width="52" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">CRM record</text>
  </g>
  <g transform="translate(462, 108)">
    <rect x="-30" y="-7.5" width="60" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">rate structure</text>
  </g>
  <g transform="translate(575, 272)">
    <rect x="-32" y="-7.5" width="64" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ PDF + Drive</text>
  </g>

  <!-- STAGE 1: TRIGGER "Enquiry lands" -->
  <g id="stage-1" class="node">
    <rect x="16" y="132" width="90" height="114" rx="9" class="card-bg" />
    <text x="24" y="147" class="stage-num">01 · TRIGGER</text>
    <text x="24" y="159" class="stage-title">Enquiry lands</text>
    <rect x="24" y="170" width="74" height="44" rx="5" class="chip-bg" />
    <path d="M 26 172 L 61 190 L 96 172" fill="none" stroke="var(--line)" stroke-width="1" />
    <rect x="30" y="196" width="52" height="4" rx="2" fill="var(--accent)" class="em-line" />
    <rect x="30" y="204" width="40" height="4" rx="2" fill="var(--ink)" fill-opacity="0.45" class="em-line" />
    <text x="24" y="232" class="stage-copy">Client request</text>
  </g>

  <!-- STAGE 2: "Template matched" -->
  <g id="stage-2" class="node">
    <rect x="118" y="146" width="66" height="100" rx="9" class="card-bg" />
    <text x="125" y="160" class="stage-num">02 · BASE</text>
    <text x="125" y="172" class="stage-title">Template</text>
    <rect x="131" y="182" width="40" height="48" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3 2" class="doc-skel" />
    <text x="151" y="208" text-anchor="middle" class="stage-copy">Doc</text>
  </g>

  <!-- STAGE 3: "Sections slotted in" -->
  <g id="stage-3" class="node">
    <rect x="196" y="132" width="94" height="114" rx="9" class="card-bg" />
    <text x="204" y="147" class="stage-num">03 · SECTIONS</text>
    <text x="204" y="159" class="stage-title">Sections slotted</text>
    <g class="ai-badge">
      <rect x="204" y="165" width="38" height="13" rx="6.5" class="chip-bg" />
      <text x="223" y="174" text-anchor="middle" class="chip-text-accent">Claude</text>
    </g>
    <!-- Growing Doc -->
    <rect x="206" y="184" width="74" height="52" rx="4" class="chip-bg" />
    <rect x="212" y="191" width="62" height="12" rx="3" fill="var(--accent)" fill-opacity="0.22" class="sec-drop-1" />
    <rect x="212" y="207" width="62" height="12" rx="3" fill="var(--accent)" fill-opacity="0.35" class="sec-drop-2" />
    <rect x="212" y="223" width="44" height="6" rx="2" fill="var(--ink)" fill-opacity="0.35" class="sec-drop-2" />
  </g>

  <!-- STAGE 4: "Client details filled" -->
  <g id="stage-4" class="node">
    <rect x="306" y="132" width="92" height="114" rx="9" class="card-bg" />
    <text x="314" y="147" class="stage-num">04 · DETAILS</text>
    <text x="314" y="159" class="stage-title">Client filled</text>
    <rect x="314" y="170" width="76" height="66" rx="4" class="chip-bg" />
    <text x="320" y="183" class="stage-copy">Name &amp; scope</text>
    <rect x="320" y="189" width="62" height="5" rx="2" fill="var(--accent)" fill-opacity="0.65" class="fld-1" />
    <rect x="320" y="199" width="54" height="5" rx="2" fill="var(--ink)" fill-opacity="0.45" class="fld-2" />
    <rect x="320" y="209" width="48" height="5" rx="2" fill="var(--ink)" fill-opacity="0.45" class="fld-2" />
    <rect x="320" y="219" width="58" height="5" rx="2" fill="var(--accent)" fill-opacity="0.45" class="fld-2" />
  </g>

  <!-- STAGE 5: "Pricing built" -->
  <g id="stage-5" class="node">
    <rect x="414" y="132" width="96" height="114" rx="9" class="card-bg" />
    <text x="422" y="147" class="stage-num">05 · PRICING</text>
    <text x="422" y="159" class="stage-title">Pricing built</text>
    <g class="ai-badge">
      <rect x="422" y="165" width="74" height="13" rx="6.5" class="chip-bg" />
      <text x="459" y="174" text-anchor="middle" class="chip-text-accent">Microsoft Copilot</text>
    </g>
    <rect x="422" y="184" width="80" height="52" rx="4" class="chip-bg" />
    <rect x="428" y="191" width="66" height="4" rx="2" fill="var(--ink)" fill-opacity="0.4" />
    <rect x="428" y="199" width="66" height="4" rx="2" fill="var(--ink)" fill-opacity="0.4" />
    <text x="462" y="224" text-anchor="middle" class="counter-text tot-1">$4,200</text>
    <text x="462" y="224" text-anchor="middle" class="counter-text tot-2">$8,600</text>
    <text x="462" y="224" text-anchor="middle" class="counter-text tot-3">$12,400</text>
  </g>

  <!-- STAGE 6: "You review" (Conveyor End, Gate) -->
  <g id="stage-6" class="node">
    <rect x="526" y="132" width="98" height="114" rx="9" class="card-bg" />
    <text x="534" y="147" class="stage-num">06 · GATE</text>
    <text x="534" y="159" class="stage-title">You review</text>
    <g class="ai-badge">
      <rect x="534" y="165" width="82" height="13" rx="6.5" class="chip-bg" />
      <text x="575" y="174" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>
    <rect x="546" y="186" width="58" height="44" rx="4" class="chip-bg" />
    <path d="M 566 208 L 572 214 L 584 202" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="rev-tick" />
  </g>

  <!-- STAGE 7: "Proposal ready" (Far Right Bottom, End) -->
  <g id="stage-7" class="node">
    <rect x="468" y="296" width="156" height="90" rx="10" class="card-bg" />
    <text x="478" y="312" class="stage-num">07 · READY</text>
    <text x="478" y="325" class="stage-title">Proposal ready</text>
    <text x="478" y="341" class="stage-copy">Polished, sendable</text>
    <text x="478" y="352" class="stage-copy">quote &amp; terms</text>

    <circle cx="598" cy="348" r="12" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 592 348 L 596 352 L 604 344" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
