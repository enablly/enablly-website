<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Customer Support Triage</title>
  <desc id="svg-desc">Six-stage river-delta triage workflow for customer support: messages pour in from chat, email and social via webhook per message, OpenAI and Claude classify intent at the delta head, splitting into three channels of different widths and speeds (wide calm RAG help-centre channel for common questions, medium HubSpot and Zendesk channel for billing, and narrow fast-lane for urgent issues), ending in a settled queue health summary in Zendesk views.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(20, 184, 166, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #14b8a6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.6px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.6px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.5px; fill: var(--muted); }
    .chip-text { font-size: 6.1px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.1px; font-weight: 700; fill: var(--accent); }
    .counter-text { font-size: 9px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .pool-bg { fill: var(--accent); fill-opacity: 0.1; stroke: var(--accent); stroke-opacity: 0.45; stroke-width: 0.9; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .river-wide { fill: none; stroke: var(--accent); stroke-width: 12; stroke-opacity: 0.12; stroke-linecap: round; }
    .river-med { fill: none; stroke: var(--accent); stroke-width: 7; stroke-opacity: 0.14; stroke-linecap: round; }
    .river-fast { fill: none; stroke: var(--accent); stroke-width: 3; stroke-opacity: 0.25; stroke-linecap: round; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    .flow-fast { stroke-dasharray: 6 3; animation: dashFlow 0.45s linear infinite; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 244 63 L 336 63"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 384 96 Q 210 108 117 128"); animation: p23 9s linear infinite; }
    .p-24 { offset-path: path("M 454 96 Q 380 112 331 128"); animation: p24 9s linear infinite; }
    .p-25 { offset-path: path("M 534 96 L 534 128"); animation: p25 9s linear infinite; }
    .p-36 { offset-path: path("M 117 304 L 117 336"); animation: p36 9s linear infinite; }
    .p-46 { offset-path: path("M 331 304 L 331 336"); animation: p36 9s linear infinite; }
    .p-56 { offset-path: path("M 534 304 L 534 336"); animation: p36 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 18% { opacity:1; offset-distance:100%; } 21%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,27% { opacity:0; offset-distance:0%; } 29% { opacity:1; } 39% { opacity:1; offset-distance:100%; } 42%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p24 { 0%,34% { opacity:0; offset-distance:0%; } 36% { opacity:1; } 44% { opacity:1; offset-distance:100%; } 47%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p25 { 0%,42% { opacity:0; offset-distance:0%; } 44% { opacity:1; } 49% { opacity:1; offset-distance:100%; } 52%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p36 { 0%,74% { opacity:0; offset-distance:0%; } 76% { opacity:1; } 83% { opacity:1; offset-distance:100%; } 86%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .card-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 18%,33% { stroke: var(--accent); stroke-width: 1.7; } 37%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,32% { stroke: var(--line); stroke-width: 1.1; } 36%,54% { stroke: var(--accent); stroke-width: 1.7; } 58%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,40% { stroke: var(--line); stroke-width: 1.1; } 44%,64% { stroke: var(--accent); stroke-width: 1.7; } 68%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,48% { stroke: var(--line); stroke-width: 1.1; } 52%,72% { stroke: var(--accent); stroke-width: 1.7; } 76%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,78% { stroke: var(--line); stroke-width: 1.1; } 82%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Queue Counter Ticks */
    .cnt-1 { opacity: 1; animation: c1 9s linear infinite; }
    .cnt-2 { opacity: 0; animation: c2 9s linear infinite; }
    .cnt-3 { opacity: 0; animation: c3 9s linear infinite; }
    @keyframes c1 { 0%,5% { opacity:1; } 7%,95% { opacity:0; } 98%,100% { opacity:1; } }
    @keyframes c2 { 0%,5% { opacity:0; } 7%,11% { opacity:1; } 13%,100% { opacity:0; } }
    @keyframes c3 { 0%,11% { opacity:0; } 13%,94% { opacity:1; } 98%,100% { opacity:0; } }

    /* Stage 2: Scan Beam Sweeps Bubbles + Tags Appear */
    .scan-beam { animation: beamX 9s ease-in-out infinite; opacity: 0; }
    .tag-pop { opacity: 0; animation: tgPop 9s ease-out infinite; }
    @keyframes beamX { 0%,17% { opacity:0; transform:translateX(0px); } 21% { opacity:0.9; transform:translateX(0px); } 30% { opacity:0.9; transform:translateX(84px); } 33%,100% { opacity:0; transform:translateX(84px); } }
    @keyframes tgPop { 0%,20% { opacity:0; } 28%,90% { opacity:1; } 98%,100% { opacity:0; } }

    /* Stage 3: Answer Bubble Types Out */
    .ans-1 { transform-box: fill-box; transform-origin: left center; animation: an1 9s ease-out infinite; }
    .ans-2 { transform-box: fill-box; transform-origin: left center; animation: an2 9s ease-out infinite; }
    @keyframes an1 { 0%,34% { transform: scaleX(0.05); opacity:0.25; } 42%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.25; } }
    @keyframes an2 { 0%,38% { transform: scaleX(0.05); opacity:0.25; } 46%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.25; } }

    /* Stage 4: Record Card Slides In */
    .rec-slide { animation: recIn 9s ease-out infinite; }
    @keyframes recIn { 0%,44% { opacity:0.25; transform:translateX(12px); } 54%,92% { opacity:1; transform:translateX(0); } 98%,100% { opacity:0.25; } }

    /* Stage 5: Urgent Bubble Races Straight Down */
    .fast-drop { animation: fDrop 9s ease-in infinite; }
    @keyframes fDrop { 0%,51% { opacity:0.3; transform:translateY(-22px); } 58%,92% { opacity:1; transform:translateY(16px); } 98%,100% { opacity:0.3; transform:translateY(-22px); } }

    /* Stage 6: Summary Tick */
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }
    @keyframes drawFinal { 0%,86% { stroke-dashoffset: 24; } 93%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Customer Support Triage</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Chat / email / social → AI triage → 3 delta channels → Zendesk</text>

  <!-- River-Delta Channels (Wide Calm, Medium, Narrow Fast) -->
  <path d="M 384 96 Q 210 108 117 128" class="river-wide" />
  <path d="M 454 96 Q 380 112 331 128" class="river-med" />
  <path d="M 534 96 L 534 128" class="river-fast" />

  <!-- Flow Connectors -->
  <path d="M 244 63 L 336 63" class="flow-path" />
  <path d="M 384 96 Q 210 108 117 128" class="flow-path flow-accent" />
  <path d="M 454 96 Q 380 112 331 128" class="flow-path flow-accent" />
  <path d="M 534 96 L 534 128" class="flow-path flow-accent flow-fast" />
  <path d="M 117 304 L 117 336" class="flow-path" />
  <path d="M 331 304 L 331 336" class="flow-path flow-accent" />
  <path d="M 534 304 L 534 336" class="flow-path flow-fast" />

  <!-- Travelling Packets -->
  <circle r="3.1" class="packet p-12" />
  <circle r="3.1" class="packet p-23" />
  <circle r="3.1" class="packet p-24" />
  <circle r="3.1" class="packet p-25" />
  <circle r="3" class="packet p-36" />
  <circle r="3" class="packet p-46" />
  <circle r="3" class="packet p-56" />

  <!-- Connector Chips -->
  <g transform="translate(290, 63)">
    <rect x="-40" y="-7.5" width="80" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">webhook per message</text>
  </g>
  <g transform="translate(216, 112)">
    <rect x="-28" y="-7" width="56" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text-accent">docs lookup</text>
  </g>
  <g transform="translate(331, 320)">
    <rect x="-36" y="-7.5" width="72" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ Zendesk views</text>
  </g>

  <!-- STAGE 1: TRIGGER "Messages pour in" (Top Left, River Source) -->
  <g id="stage-1" class="node">
    <rect x="16" y="34" width="228" height="58" rx="10" class="card-bg" />
    <text x="26" y="49" class="stage-num">01 · TRIGGER</text>
    <text x="26" y="61" class="stage-title">Messages pour in</text>
    <text x="26" y="74" class="stage-copy">chat · email · social</text>

    <!-- Counter -->
    <text x="210" y="60" text-anchor="middle" class="counter-text cnt-1">12</text>
    <text x="210" y="60" text-anchor="middle" class="counter-text cnt-2">28</text>
    <text x="210" y="60" text-anchor="middle" class="counter-text cnt-3">46</text>
    <text x="210" y="72" text-anchor="middle" class="stage-copy">in queue</text>
  </g>

  <!-- STAGE 2: "Triage reads intent" (Delta Head) -->
  <g id="stage-2" class="node">
    <rect x="336" y="34" width="288" height="62" rx="10" class="card-bg" />
    <text x="346" y="49" class="stage-num">02 · DELTA HEAD</text>
    <text x="346" y="61" class="stage-title">Triage reads intent</text>

    <g class="ai-badge">
      <rect x="346" y="68" width="36" height="13" rx="6.5" class="chip-bg" />
      <text x="364" y="77" text-anchor="middle" class="chip-text-accent">OpenAI</text>
      <rect x="386" y="68" width="36" height="13" rx="6.5" class="chip-bg" />
      <text x="404" y="77" text-anchor="middle" class="chip-text-accent">Claude</text>
      <rect x="426" y="68" width="68" height="13" rx="6.5" class="chip-bg" />
      <text x="460" y="77" text-anchor="middle" class="chip-text-accent">intent classification</text>
    </g>

    <!-- Scan Beam + Tagged Bubbles -->
    <g transform="translate(506, 46)">
      <circle cx="14" cy="18" r="10" class="chip-bg" />
      <text x="14" y="21.5" text-anchor="middle" class="stage-title tag-pop">?</text>
      <circle cx="44" cy="18" r="10" class="chip-bg" />
      <text x="44" y="21.5" text-anchor="middle" class="stage-title tag-pop">£</text>
      <circle cx="74" cy="18" r="10" class="chip-bg" />
      <text x="74" y="21.5" text-anchor="middle" class="chip-text-accent tag-pop">!</text>
      <line x1="0" y1="4" x2="0" y2="34" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="scan-beam" />
    </g>
  </g>

  <!-- STAGE 3: CHANNEL A "Common — answered instantly" (Wide Calm Channel, Left) -->
  <g id="stage-3" class="node">
    <rect x="16" y="128" width="202" height="176" rx="10" class="card-bg" />
    <text x="26" y="144" class="stage-num">03 · CHANNEL A (WIDE)</text>
    <text x="26" y="157" class="stage-title">Common — answered</text>

    <g class="ai-badge">
      <rect x="26" y="164" width="76" height="14" rx="7" class="chip-bg" />
      <text x="64" y="173.5" text-anchor="middle" class="chip-text-accent">RAG · help centre</text>
    </g>

    <!-- Typing Answer Bubble -->
    <rect x="26" y="188" width="180" height="58" rx="6" class="chip-bg" />
    <text x="34" y="203" class="stage-copy">Help-doc reply</text>
    <rect x="34" y="211" width="152" height="5" rx="2.5" fill="var(--accent)" fill-opacity="0.7" class="ans-1" />
    <rect x="34" y="222" width="128" height="5" rx="2.5" fill="var(--ink)" fill-opacity="0.45" class="ans-2" />
    <rect x="34" y="233" width="104" height="5" rx="2.5" fill="var(--muted)" fill-opacity="0.45" class="ans-2" />

    <!-- Outcome Pool -->
    <rect x="26" y="264" width="180" height="28" rx="6" class="pool-bg" />
    <text x="116" y="281" text-anchor="middle" class="chip-text-accent">Answered automatically</text>
  </g>

  <!-- STAGE 4: CHANNEL B "Billing — prepared for a human" (Medium Channel, Centre) -->
  <g id="stage-4" class="node">
    <rect x="234" y="128" width="194" height="176" rx="10" class="card-bg" />
    <text x="244" y="144" class="stage-num">04 · CHANNEL B (MEDIUM)</text>
    <text x="244" y="157" class="stage-title">Billing — prepared</text>

    <g class="ai-badge">
      <rect x="244" y="164" width="42" height="14" rx="7" class="chip-bg" />
      <text x="265" y="173.5" text-anchor="middle" class="chip-text-accent">HubSpot</text>
      <rect x="290" y="164" width="42" height="14" rx="7" class="chip-bg" />
      <text x="311" y="173.5" text-anchor="middle" class="chip-text-accent">Zendesk</text>
      <rect x="336" y="164" width="52" height="14" rx="7" class="chip-bg" />
      <text x="362" y="173.5" text-anchor="middle" class="chip-text-accent">tool calling</text>
    </g>

    <!-- Record Card Slides In Beside Question -->
    <rect x="244" y="188" width="78" height="58" rx="6" class="chip-bg" />
    <text x="252" y="205" class="stage-copy">Invoice #412</text>
    <text x="252" y="218" class="stage-copy">question</text>

    <g class="rec-slide">
      <rect x="330" y="188" width="88" height="58" rx="6" class="chip-bg" />
      <text x="338" y="204" class="chip-text-accent">Account record</text>
      <rect x="338" y="212" width="66" height="4" rx="2" fill="var(--ink)" fill-opacity="0.45" />
      <rect x="338" y="222" width="52" height="4" rx="2" fill="var(--muted)" fill-opacity="0.45" />
    </g>

    <!-- Outcome Pool -->
    <rect x="244" y="264" width="174" height="28" rx="6" class="pool-bg" />
    <text x="331" y="281" text-anchor="middle" class="chip-text-accent">Agent finishes with full context</text>
  </g>

  <!-- STAGE 5: CHANNEL C "Urgent — fast lane" (Narrow Fast Channel, Right) -->
  <g id="stage-5" class="node">
    <rect x="444" y="128" width="180" height="176" rx="10" class="card-bg" />
    <text x="454" y="144" class="stage-num">05 · CHANNEL C (FAST)</text>
    <text x="454" y="157" class="stage-title">Urgent — fast lane</text>
    <text x="454" y="170" class="stage-copy">No AI answer · skips queue</text>

    <!-- Fast-Drop Urgent Bubble + Streaks -->
    <line x1="534" y1="184" x2="534" y2="252" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3" />
    <g class="fast-drop" transform="translate(534, 214)">
      <circle cx="0" cy="0" r="12" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="1.4" />
      <text x="0" y="4" text-anchor="middle" class="stage-title">!</text>
    </g>

    <!-- Outcome Pool -->
    <rect x="454" y="264" width="160" height="28" rx="6" class="pool-bg" />
    <text x="534" y="281" text-anchor="middle" class="chip-text-accent">With a human immediately</text>
  </g>

  <!-- STAGE 6: "Queue health" (Bottom Strip, End) -->
  <g id="stage-6" class="node">
    <rect x="16" y="336" width="608" height="52" rx="10" class="card-bg" />
    <text x="26" y="353" class="stage-num">06 · QUEUE HEALTH</text>
    <text x="26" y="366" class="stage-title">All three pools settled</text>
    <text x="26" y="377" class="stage-copy">Common auto-replied · Billing prepped · Urgent escalated</text>

    <rect x="498" y="351" width="76" height="22" rx="11" class="chip-bg" />
    <text x="536" y="364.5" text-anchor="middle" class="chip-text-accent">all routed</text>

    <circle cx="598" cy="362" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 593 362 L 596.5 365.5 L 603.5 358.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
