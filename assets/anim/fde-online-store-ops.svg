<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Online Store Operations</title>
  <desc id="svg-desc">Seven-stage storefront hub with three orbiting loops workflow for online store operations: product data arrives via Shopify sync webhook into the central Claude-powered store hub, surrounded by three orbital loops (listing loop at top with photos workflow, two-way stock loop on the right syncing Shopify and marketplaces, and order-watch loop at bottom), flagged items drop into a human-in-the-loop review tray at bottom-left, and all channels update cleanly at bottom-right.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(245, 158, 11, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #f59e0b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.5px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.5px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.4px; fill: var(--muted); }
    .chip-text { font-size: 6px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6px; font-weight: 700; fill: var(--accent); }
    .counter-text { font-size: 9px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .orbit-ring { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 134 192 L 230 192"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 298 146 L 298 122"); animation: p23 9s linear infinite; }
    .p-24 { offset-path: path("M 366 192 L 420 192"); animation: p24 9s linear infinite; }
    .p-25 { offset-path: path("M 298 244 L 298 264"); animation: p25 9s linear infinite; }
    .p-56 { offset-path: path("M 206 322 L 196 322"); animation: p56 9s linear infinite; }
    .p-67 { offset-path: path("M 392 342 L 454 342"); animation: p67 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 18% { opacity:1; offset-distance:100%; } 21%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,24% { opacity:0; offset-distance:0%; } 26% { opacity:1; } 31% { opacity:1; offset-distance:100%; } 34%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p24 { 0%,40% { opacity:0; offset-distance:0%; } 42% { opacity:1; } 47% { opacity:1; offset-distance:100%; } 50%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p25 { 0%,56% { opacity:0; offset-distance:0%; } 58% { opacity:1; } 63% { opacity:1; offset-distance:100%; } 66%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,70% { opacity:0; offset-distance:0%; } 72% { opacity:1; } 76% { opacity:1; offset-distance:100%; } 79%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p67 { 0%,80% { opacity:0; offset-distance:0%; } 82% { opacity:1; } 88% { opacity:1; offset-distance:100%; } 91%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .orbit-ring { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .orbit-ring { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .orbit-ring { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }
    #stage-7 .card-bg { animation: s7Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 17%,29% { stroke: var(--accent); stroke-width: 1.7; } 33%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,27% { stroke: var(--line); stroke-width: 1.2; } 30%,44% { stroke: var(--accent); stroke-width: 1.8; } 48%,100% { stroke: var(--line); stroke-width: 1.2; } }
    @keyframes s4Hi { 0%,42% { stroke: var(--line); stroke-width: 1.2; } 45%,59% { stroke: var(--accent); stroke-width: 1.8; } 63%,100% { stroke: var(--line); stroke-width: 1.2; } }
    @keyframes s5Hi { 0%,57% { stroke: var(--line); stroke-width: 1.2; } 60%,74% { stroke: var(--accent); stroke-width: 1.8; } 78%,100% { stroke: var(--line); stroke-width: 1.2; } }
    @keyframes s6Hi { 0%,71% { stroke: var(--line); stroke-width: 1.1; } 74%,84% { stroke: var(--accent); stroke-width: 1.7; } 88%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s7Hi { 0%,82% { stroke: var(--line); stroke-width: 1.1; } 85%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Internal Animations */
    .prod-stack { animation: prSt 9s ease-out infinite; }
    .awning-bar { transform-box: fill-box; transform-origin: left center; animation: awDraw 9s ease-out infinite; }
    .list-orbit { animation: lsOrb 9s ease-in-out infinite; }
    .stk-1 { opacity: 1; animation: st1 9s linear infinite; }
    .stk-2 { opacity: 0; animation: st2 9s linear infinite; }
    .stk-3 { opacity: 0; animation: st3 9s linear infinite; }
    .flag-drop { animation: flDr 9s ease-out infinite; }
    .rev-tick { stroke-dasharray: 16; stroke-dashoffset: 16; animation: rvCk 9s ease-out infinite; }
    .ch-pop { animation: chLt 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }

    @keyframes prSt { 0% { opacity:0.3; transform:translateY(-6px); } 10%,90% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.3; } }
    @keyframes awDraw { 0%,15% { transform: scaleX(0.15); } 25%,92% { transform: scaleX(1); } 98%,100% { transform: scaleX(0.15); } }
    @keyframes lsOrb { 0%,28% { transform: translateX(-18px); } 38%,90% { transform: translateX(18px); } 98%,100% { transform: translateX(-18px); } }
    @keyframes st1 { 0%,46% { opacity:1; } 48%,95% { opacity:0; } 98%,100% { opacity:1; } }
    @keyframes st2 { 0%,46% { opacity:0; } 48%,54% { opacity:1; } 56%,100% { opacity:0; } }
    @keyframes st3 { 0%,54% { opacity:0; } 56%,94% { opacity:1; } 98%,100% { opacity:0; } }
    @keyframes flDr { 0%,62% { transform: translate(0, 0); opacity:0.4; } 70%,92% { transform: translate(-28px, 24px); opacity:1; } 98%,100% { transform: translate(0, 0); opacity:0.4; } }
    @keyframes rvCk { 0%,73% { stroke-dashoffset: 16; } 80%,94% { stroke-dashoffset: 0; } 99%,100% { stroke-dashoffset: 16; } }
    @keyframes chLt { 0%,82% { stroke: var(--line); } 88%,96% { stroke: var(--accent); stroke-width: 1.3; } 100% { stroke: var(--line); } }
    @keyframes drawFinal { 0%,86% { stroke-dashoffset: 24; } 93%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Online Store Operations</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Shopify webhook → store hub → 3 orbital loops → all channels</text>

    <defs>
    <mask id="cutout-online-store-ops">
      <rect width="640" height="400" fill="white" />
      <rect x="138.5" y="183.0" width="87.0" height="18.0" rx="7.5" fill="black" />
      <rect x="393.5" y="333.0" width="59.0" height="18.0" rx="7.5" fill="black" />
    </mask>
  </defs>

  <!-- Flow Connectors -->
  <g mask="url(#cutout-online-store-ops)">
  <path d="M 134 192 L 230 192" class="flow-path" />
  <path d="M 298 146 L 298 122" class="flow-path flow-accent" />
  <path d="M 366 192 L 420 192" class="flow-path flow-accent" />
  <path d="M 298 244 L 298 264" class="flow-path flow-accent" />
  <path d="M 206 322 L 196 322" class="flow-path" />
  <path d="M 392 342 L 454 342" class="flow-path flow-accent" />
  </g>
<!-- Travelling Packets -->
  <circle r="3" class="packet p-12" />
  <circle r="2.9" class="packet p-23" />
  <circle r="2.9" class="packet p-24" />
  <circle r="2.9" class="packet p-25" />
  <circle r="2.9" class="packet p-56" />
  <circle r="3.1" class="packet p-67" />

  <!-- Connector Chips -->
  <g transform="translate(182, 192)">
    <rect x="-42" y="-7.5" width="84" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">Shopify sync · webhook</text>
  </g>
  <g transform="translate(423, 342)">
    <rect x="-28" y="-7.5" width="56" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ all channels</text>
  </g>

  <!-- STAGE 1: TRIGGER "Product data lands" (Left) -->
  <g id="stage-1" class="node">
    <rect x="16" y="144" width="118" height="96" rx="10" class="card-bg" />
    <text x="25" y="159" class="stage-num">01 · TRIGGER</text>
    <text x="25" y="171" class="stage-title">Product data</text>
    <text x="25" y="182" class="stage-title">lands</text>
    <g transform="translate(25, 192)"><g class="prod-stack">
      <rect x="0" y="0" width="96" height="10" rx="3" class="chip-bg" />
      <rect x="0" y="14" width="84" height="10" rx="3" class="chip-bg" />
      <rect x="0" y="28" width="90" height="10" rx="3" class="chip-bg" />
    </g></g>
  </g>

  <!-- STAGE 2: HUB "Store hub" (Centre) -->
  <g id="stage-2" class="node">
    <rect x="230" y="146" width="136" height="98" rx="12" class="card-bg" />
    <rect x="236" y="150" width="124" height="6" rx="3" fill="var(--accent)" fill-opacity="0.45" class="awning-bar" />
    <text x="242" y="170" class="stage-num">02 · STORE HUB</text>
    <text x="242" y="183" class="stage-title">Store hub</text>
    <g class="ai-badge">
      <rect x="242" y="190" width="38" height="14" rx="7" class="chip-bg" />
      <text x="261" y="199.5" text-anchor="middle" class="chip-text-accent">Claude</text>
    </g>
    <text x="242" y="220" class="stage-copy">Single source of truth</text>
    <text x="242" y="232" class="stage-copy">for catalogue &amp; stock</text>
  </g>

  <!-- STAGE 3: LISTING LOOP (Top Orbit) -->
  <g id="stage-3" class="node">
    <ellipse cx="298" cy="82" rx="116" ry="40" class="orbit-ring" />
    <text x="298" y="60" text-anchor="middle" class="stage-num">03 · LISTING LOOP</text>
    <text x="298" y="72" text-anchor="middle" class="stage-title">Titles &amp; descriptions</text>
    <g transform="translate(274, 80)"><g class="list-orbit">
      <rect x="0" y="0" width="48" height="22" rx="4" class="chip-bg" />
      <rect x="6" y="7" width="36" height="3.5" rx="1.5" fill="var(--accent)" />
      <rect x="6" y="14" width="28" height="3.5" rx="1.5" fill="var(--ink)" fill-opacity="0.4" />
    </g></g>
    <rect x="150" y="52" width="64" height="14" rx="7" class="chip-bg" />
    <text x="182" y="61.5" text-anchor="middle" class="chip-text-accent">photos workflow</text>
  </g>

  <!-- STAGE 4: STOCK LOOP (Right Orbit, Two-Way) -->
  <g id="stage-4" class="node">
    <ellipse cx="520" cy="192" rx="100" ry="52" class="orbit-ring" />
    <text x="520" y="168" text-anchor="middle" class="stage-num">04 · STOCK LOOP</text>
    <text x="520" y="180" text-anchor="middle" class="stage-title">Two-way sync</text>

    <text x="520" y="206" text-anchor="middle" class="counter-text stk-1">48 left</text>
    <text x="520" y="206" text-anchor="middle" class="counter-text stk-2">46 left</text>
    <text x="520" y="206" text-anchor="middle" class="counter-text stk-3">44 left</text>

    <rect x="430" y="132" width="52" height="14" rx="7" class="chip-bg" />
    <text x="456" y="141.5" text-anchor="middle" class="chip-text-accent">↔ Shopify</text>
    <rect x="546" y="132" width="64" height="14" rx="7" class="chip-bg" />
    <text x="578" y="141.5" text-anchor="middle" class="chip-text-accent">↔ marketplace</text>
  </g>

  <!-- STAGE 5: ORDER WATCH (Bottom Orbit) -->
  <g id="stage-5" class="node">
    <ellipse cx="298" cy="304" rx="94" ry="38" class="orbit-ring" />
    <text x="298" y="294" text-anchor="middle" class="stage-num">05 · ORDER WATCH</text>
    <text x="298" y="306" text-anchor="middle" class="stage-title">Orders scanned</text>
    <text x="298" y="319" text-anchor="middle" class="stage-copy">Delays &amp; issues caught</text>
    <circle cx="226" cy="302" r="5" fill="var(--accent)" class="flag-drop" />
  </g>

  <!-- STAGE 6: "You approve key changes" (Bottom-Left Tray) -->
  <g id="stage-6" class="node">
    <rect x="16" y="298" width="180" height="90" rx="10" class="card-bg" />
    <text x="26" y="314" class="stage-num">06 · REVIEW TRAY</text>
    <text x="26" y="326" class="stage-title">You approve changes</text>
    <g class="ai-badge">
      <rect x="26" y="334" width="84" height="14" rx="7" class="chip-bg" />
      <text x="68" y="343.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>
    <path d="M 156 356 L 160 360 L 168 352" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" class="rev-tick" />
    <text x="26" y="370" class="stage-copy">Flagged items confirmed</text>
  </g>

  <!-- STAGE 7: "Store current everywhere" (Bottom Right, End) -->
  <g id="stage-7" class="node">
    <rect x="454" y="298" width="170" height="90" rx="10" class="card-bg" />
    <text x="464" y="314" class="stage-num">07 · LIVE</text>
    <text x="464" y="326" class="stage-title">Store current</text>

    <rect x="464" y="338" width="38" height="16" rx="8" class="chip-bg ch-pop" /><text x="483" y="348.5" text-anchor="middle" class="chip-text">Web</text>
    <rect x="506" y="338" width="38" height="16" rx="8" class="chip-bg ch-pop" /><text x="525" y="348.5" text-anchor="middle" class="chip-text">Shop</text>
    <rect x="464" y="360" width="54" height="16" rx="8" class="chip-bg ch-pop" /><text x="491" y="370.5" text-anchor="middle" class="chip-text-accent">Channels</text>

    <circle cx="598" cy="356" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 593 356 L 596.5 359.5 L 603.5 352.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
