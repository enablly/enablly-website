<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Presentations &amp; Decks</title>
  <desc id="svg-desc">Seven-stage vertical slide-stack assembly workflow for presentations and decks: bullets and data arrive from a shared doc and Sheet, Claude structures the narrative, Power Automate builds PowerPoint slides in a growing layered stack, Microsoft Copilot draws charts from data, speaker notes write to the notes pane, a human refines, and the finished deck saves to Google Drive or SharePoint.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(139, 92, 246, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #8b5cf6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 14px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.8px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 7.4px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 9.8px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 7.4px; fill: var(--muted); }
    .brand-text { font-size: 7.4px; font-weight: 600; fill: var(--ink); }
    .chip-text { font-size: 6.8px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.8px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .slide-layer { fill: var(--surface); stroke: var(--accent); stroke-opacity: 0.5; stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 100 122 L 100 152"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 186 196 C 230 196, 250 180, 290 180"); animation: p23 9s linear infinite; }
    .p-34 { offset-path: path("M 430 190 L 430 140"); animation: p34 9s linear infinite; }
    .p-45 { offset-path: path("M 290 220 C 230 250, 210 296, 186 296"); animation: p45 9s linear infinite; }
    .p-56 { offset-path: path("M 186 334 L 222 350"); animation: p56 9s linear infinite; }
    .p-67 { offset-path: path("M 390 350 L 466 350"); animation: p67 9s linear infinite; }

    @keyframes p12 { 0%, 8% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 18% { offset-distance: 100%; opacity: 1; } 20%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes p23 { 0%, 22% { offset-distance: 0%; opacity: 0; } 24% { opacity: 1; } 32% { offset-distance: 100%; opacity: 1; } 34%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes p34 { 0%, 38% { offset-distance: 0%; opacity: 0; } 40% { opacity: 1; } 48% { offset-distance: 100%; opacity: 1; } 50%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes p45 { 0%, 52% { offset-distance: 0%; opacity: 0; } 54% { opacity: 1; } 62% { offset-distance: 100%; opacity: 1; } 64%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes p56 { 0%, 66% { offset-distance: 0%; opacity: 0; } 68% { opacity: 1; } 75% { offset-distance: 100%; opacity: 1; } 77%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes p67 { 0%, 79% { offset-distance: 0%; opacity: 0; } 81% { opacity: 1; } 89% { offset-distance: 100%; opacity: 1; } 91%, 100% { offset-distance: 100%; opacity: 0; } }

    .highlight-ring { fill: none; stroke: var(--accent); stroke-width: 1.8; opacity: 0; }
    #stage-1 .highlight-ring { animation: lit1 9s ease-in-out infinite; }
    #stage-2 .highlight-ring { animation: lit2 9s ease-in-out infinite; }
    #stage-3 .highlight-ring { animation: lit3 9s ease-in-out infinite; }
    #stage-4 .highlight-ring { animation: lit4 9s ease-in-out infinite; }
    #stage-5 .highlight-ring { animation: lit5 9s ease-in-out infinite; }
    #stage-6 .highlight-ring { animation: lit6 9s ease-in-out infinite; }
    #stage-7 .highlight-ring { animation: lit7 9s ease-in-out infinite; }

    @keyframes lit1 { 0%, 96%, 100% { opacity: 0.2; } 3%, 12% { opacity: 1; } 16% { opacity: 0.25; } }
    @keyframes lit2 { 0%, 14% { opacity: 0; } 18%, 27% { opacity: 1; } 31%, 95% { opacity: 0.25; } 100% { opacity: 0; } }
    @keyframes lit3 { 0%, 28% { opacity: 0; } 32%, 44% { opacity: 1; } 48%, 95% { opacity: 0.25; } 100% { opacity: 0; } }
    @keyframes lit4 { 0%, 44% { opacity: 0; } 48%, 58% { opacity: 1; } 62%, 95% { opacity: 0.25; } 100% { opacity: 0; } }
    @keyframes lit5 { 0%, 58% { opacity: 0; } 62%, 71% { opacity: 1; } 75%, 95% { opacity: 0.25; } 100% { opacity: 0; } }
    @keyframes lit6 { 0%, 71% { opacity: 0; } 75%, 83% { opacity: 1; } 87%, 95% { opacity: 0.25; } 100% { opacity: 0; } }
    @keyframes lit7 { 0%, 84% { opacity: 0; } 88%, 96% { opacity: 1; } 100% { opacity: 0; } }

    .ai-pulse { fill: var(--accent); transform-box: fill-box; transform-origin: center; animation: aiPulse 1.5s ease-in-out infinite; }
    @keyframes aiPulse { 0%, 100% { opacity: 0.45; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.25); } }

    /* Stage 1: Bullet lines typing */
    .bul-1, .bul-2 { transform-box: fill-box; transform-origin: left center; }
    .bul-1 { animation: b1 9s ease-out infinite; }
    .bul-2 { animation: b2 9s ease-out infinite; }
    @keyframes b1 { 0%, 96%, 100% { transform: scaleX(0.1); opacity: 0.2; } 5%, 92% { transform: scaleX(1); opacity: 0.95; } }
    @keyframes b2 { 0%, 3%, 96%, 100% { transform: scaleX(0.1); opacity: 0.2; } 9%, 92% { transform: scaleX(1); opacity: 0.8; } }

    /* Stage 2: Bullet rows shuffling */
    .shf-1 { animation: sf1 9s ease-in-out infinite; }
    .shf-2 { animation: sf2 9s ease-in-out infinite; }
    @keyframes sf1 { 0%, 16% { transform: translateY(8px); } 23%, 94% { transform: translateY(0px); } 98%, 100% { transform: translateY(8px); } }
    @keyframes sf2 { 0%, 16% { transform: translateY(-8px); } 23%, 94% { transform: translateY(0px); } 98%, 100% { transform: translateY(-8px); } }

    /* Stage 3: Slide layers sliding onto the stack */
    .sl-1 { animation: slA 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .sl-2 { animation: slB 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .sl-3 { animation: slC 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    @keyframes slA { 0%, 30% { opacity: 0.2; transform: translateX(18px); } 36%, 94% { opacity: 1; transform: translateX(0); } 98%, 100% { opacity: 0.2; transform: translateX(18px); } }
    @keyframes slB { 0%, 34% { opacity: 0.2; transform: translateX(18px); } 40%, 94% { opacity: 1; transform: translateX(0); } 98%, 100% { opacity: 0.2; transform: translateX(18px); } }
    @keyframes slC { 0%, 38% { opacity: 0.2; transform: translateX(18px); } 44%, 94% { opacity: 1; transform: translateX(0); } 98%, 100% { opacity: 0.2; transform: translateX(18px); } }

    /* Stage 4: Chart bars growing inside top slide */
    .cbar-1, .cbar-2, .cbar-3 { transform-box: fill-box; transform-origin: bottom center; }
    .cbar-1 { animation: cb1 9s ease-out infinite; }
    .cbar-2 { animation: cb2 9s ease-out infinite; }
    .cbar-3 { animation: cb3 9s ease-out infinite; }
    @keyframes cb1 { 0%, 46% { transform: scaleY(0.15); } 53%, 94% { transform: scaleY(1); } 98%, 100% { transform: scaleY(0.15); } }
    @keyframes cb2 { 0%, 49% { transform: scaleY(0.15); } 56%, 94% { transform: scaleY(1); } 98%, 100% { transform: scaleY(0.15); } }
    @keyframes cb3 { 0%, 52% { transform: scaleY(0.15); } 59%, 94% { transform: scaleY(1); } 98%, 100% { transform: scaleY(0.15); } }

    /* Stage 5: Speaker note lines typing */
    .note-1, .note-2 { transform-box: fill-box; transform-origin: left center; }
    .note-1 { animation: nt1 9s ease-out infinite; }
    .note-2 { animation: nt2 9s ease-out infinite; }
    @keyframes nt1 { 0%, 59% { transform: scaleX(0.1); opacity: 0.2; } 66%, 94% { transform: scaleX(1); opacity: 0.9; } 98%, 100% { transform: scaleX(0.1); opacity: 0.2; } }
    @keyframes nt2 { 0%, 63% { transform: scaleX(0.1); opacity: 0.2; } 70%, 94% { transform: scaleX(1); opacity: 0.75; } 98%, 100% { transform: scaleX(0.1); opacity: 0.2; } }

    /* Stage 6 and 7 Ticks */
    .rev-tick { stroke-dasharray: 14; stroke-dashoffset: 14; animation: rtDraw 9s ease-out infinite; }
    .end-tick { stroke-dasharray: 16; stroke-dashoffset: 16; animation: etDraw 9s ease-out infinite; }
    @keyframes rtDraw { 0%, 75% { stroke-dashoffset: 14; } 81%, 94% { stroke-dashoffset: 0; } 98%, 100% { stroke-dashoffset: 14; } }
    @keyframes etDraw { 0%, 87% { stroke-dashoffset: 16; } 93%, 96% { stroke-dashoffset: 0; } 99%, 100% { stroke-dashoffset: 16; } }
  </style>

  <!-- Header -->
  <g id="header">
    <circle cx="20" cy="22" r="3.8" fill="var(--accent)" />
    <text x="30" y="26" class="title-main">AI Automation for Presentations &amp; Decks</text>
    <rect x="466" y="12" width="158" height="20" rx="10" class="chip-bg" />
    <circle cx="477" cy="22" r="2.2" fill="var(--accent)" />
    <text x="484" y="25" class="method-text">Forward-deployed · Embedded</text>
  </g>

  <!-- Flow Paths -->
  <g id="flow-paths">
    <path class="flow-path flow-accent" d="M 100 122 L 100 152" />
    <path class="flow-path" d="M 186 196 C 230 196, 250 180, 290 180" />
    <path class="flow-path flow-accent" d="M 430 190 L 430 140" />
    <path class="flow-path" d="M 290 220 C 230 250, 210 296, 186 296" />
    <path class="flow-path" d="M 186 334 L 222 350" />
    <path class="flow-path flow-accent" d="M 390 350 L 466 350" />
  </g>

  <g id="packets">
    <circle class="packet p-12" r="3" />
    <circle class="packet p-23" r="3" />
    <circle class="packet p-34" r="3" />
    <circle class="packet p-45" r="3" />
    <circle class="packet p-56" r="3" />
    <circle class="packet p-67" r="3.2" />
  </g>

  <!-- Connector Chips -->
  <g id="connector-chips">
    <rect x="46" y="130" width="90" height="14" rx="7" class="chip-bg" />
    <text x="53" y="139.5" class="chip-text-accent">Shared doc + Sheet</text>

    <rect x="192" y="164" width="76" height="14" rx="7" class="chip-bg" />
    <text x="199" y="173.5" class="chip-text">outline → sections</text>

    <rect x="192" y="206" width="108" height="14" rx="7" class="chip-bg" />
    <text x="198" y="215.5" class="chip-text-accent">Power Automate → PPT</text>

    <rect x="498" y="166" width="58" height="14" rx="7" class="chip-bg" />
    <text x="505" y="175.5" class="chip-text-accent">data → chart</text>

    <rect x="192" y="276" width="60" height="14" rx="7" class="chip-bg" />
    <text x="200" y="285.5" class="chip-text">→ notes pane</text>

    <rect x="382" y="343" width="96" height="15" rx="7.5" class="chip-bg" />
    <text x="387" y="353" class="chip-text-accent">→ Drive / SharePoint</text>
  </g>

  <!-- STAGE 1 (Left Top): TRIGGER Bullets + data land -->
  <g id="stage-1" class="node">
    <rect x="14" y="42" width="172" height="80" rx="10" class="card-bg" />
    <rect x="14" y="42" width="172" height="80" rx="10" class="highlight-ring" />
    <text x="24" y="56" class="stage-num">01 · TRIGGER</text>
    <text x="24" y="69" class="stage-title">Bullets + data land</text>
    <rect x="24" y="78" width="144" height="4" rx="2" fill="var(--accent)" class="bul-1" />
    <rect x="24" y="88" width="116" height="4" rx="2" fill="var(--accent)" fill-opacity="0.7" class="bul-2" />
    <text x="24" y="109" class="stage-copy">Rough notes + raw sheet</text>
  </g>

  <!-- STAGE 2 (Left Middle): Story structured -->
  <g id="stage-2" class="node">
    <rect x="14" y="152" width="172" height="90" rx="10" class="card-bg" />
    <rect x="14" y="152" width="172" height="90" rx="10" class="highlight-ring" />
    <text x="24" y="166" class="stage-num">02 · STRUCTURE</text>
    <circle cx="172" cy="164" r="2.6" class="ai-pulse" />
    <text x="24" y="179" class="stage-title">Story structured</text>
    <rect x="24" y="188" width="96" height="4" rx="2" fill="var(--accent)" class="shf-1" />
    <rect x="24" y="198" width="84" height="4" rx="2" fill="var(--accent)" fill-opacity="0.65" class="shf-2" />
    <g class="ai-badge">
      <rect x="24" y="214" width="46" height="15" rx="7.5" class="chip-bg" />
      <text x="33" y="224" class="chip-text-accent">Claude</text>
    </g>
  </g>

  <!-- STAGE 5 (Left Bottom): Speaker notes written -->
  <g id="stage-5" class="node">
    <rect x="14" y="264" width="172" height="74" rx="10" class="card-bg" />
    <rect x="14" y="264" width="172" height="74" rx="10" class="highlight-ring" />
    <text x="24" y="278" class="stage-num">05 · NOTES</text>
    <circle cx="172" cy="276" r="2.6" class="ai-pulse" />
    <text x="24" y="291" class="stage-title">Speaker notes written</text>
    <rect x="24" y="301" width="136" height="3.5" rx="1.5" fill="var(--accent)" class="note-1" />
    <rect x="24" y="310" width="108" height="3.5" rx="1.5" fill="var(--accent)" fill-opacity="0.7" class="note-2" />
    <text x="24" y="328" class="stage-copy">Talk track per slide</text>
  </g>

  <!-- STAGE 3 (Right Stack Base): Slides built -->
  <g id="stage-3" class="node">
    <text x="316" y="48" class="stage-num">03 · SLIDES BUILT (LAYERED STACK)</text>
    <rect x="306" y="168" width="286" height="122" rx="10" class="slide-layer sl-1" />
    <rect x="320" y="152" width="286" height="122" rx="10" class="slide-layer sl-2" />
    <rect x="334" y="136" width="286" height="122" rx="10" class="slide-layer sl-3" />
    <rect x="306" y="136" width="314" height="154" rx="10" class="highlight-ring" />
    <text x="320" y="276" class="stage-copy">Team template applied layer by layer</text>
  </g>

  <!-- STAGE 4 (Top Slide of Stack): Charts drawn -->
  <g id="stage-4" class="node">
    <rect x="348" y="60" width="276" height="114" rx="10" class="card-bg" />
    <rect x="348" y="60" width="276" height="114" rx="10" class="highlight-ring" />
    <text x="360" y="75" class="stage-num">04 · CHARTS DRAWN</text>
    <circle cx="610" cy="73" r="2.6" class="ai-pulse" />
    <text x="360" y="88" class="stage-title">Charts drawn from numbers</text>

    <!-- Growing bar chart inside top slide -->
    <g transform="translate(360, 98)">
      <rect x="0" y="0" width="76" height="44" rx="5" fill="none" stroke="var(--line)" stroke-width="0.8" />
      <rect x="12" y="20" width="11" height="18" rx="1.5" fill="var(--accent)" class="cbar-1" />
      <rect x="32" y="12" width="11" height="26" rx="1.5" fill="var(--accent)" fill-opacity="0.75" class="cbar-2" />
      <rect x="52" y="6" width="11" height="32" rx="1.5" fill="var(--accent)" class="cbar-3" />
    </g>

    <text x="450" y="114" class="brand-text">Microsoft Copilot</text>
    <text x="450" y="126" class="stage-copy">Live data charts</text>
  </g>

  <!-- STAGE 6 (Bottom Centre): You refine -->
  <g id="stage-6" class="node">
    <rect x="220" y="318" width="156" height="66" rx="10" class="card-bg" />
    <rect x="220" y="318" width="156" height="66" rx="10" class="highlight-ring" />
    <text x="230" y="333" class="stage-num">06 · REVIEW</text>
    <text x="230" y="346" class="stage-title">You refine</text>
    <g class="ai-badge">
      <rect x="230" y="356" width="92" height="15" rx="7.5" class="chip-bg" />
      <text x="238" y="366" class="chip-text-accent">human-in-the-loop</text>
    </g>
    <circle cx="354" cy="350" r="10" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="1.2" />
    <path d="M350 350 L352.8 352.8 L358 347.5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" class="rev-tick" />
  </g>

  <!-- STAGE 7 (Bottom Right): Deck ready -->
  <g id="stage-7" class="node">
    <rect x="484" y="318" width="142" height="66" rx="10" class="card-bg" />
    <rect x="484" y="318" width="142" height="66" rx="10" class="highlight-ring" />
    <text x="494" y="333" class="stage-num">07 · DELIVERED</text>
    <text x="494" y="346" class="stage-title">Deck ready</text>
    <text x="494" y="362" class="stage-copy">Polished &amp; shared</text>
    <circle cx="604" cy="350" r="10" fill="var(--accent)" />
    <path d="M599.5 350 L602.8 353 L608.5 347" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="end-tick" />
  </g>
</svg>
