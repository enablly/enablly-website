<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Onboarding &amp; Training</title>
  <desc id="svg-desc">Seven-stage checklist staircase workflow for employee onboarding and training: a new hire confirmed via HR email webhook climbs ascending stairs as accounts are created from an IT checklist, contracts go out for e-sign, Notion training modules assign, Power Automate tracks progress to 100%, a human-in-the-loop manager reviews one readiness summary, and the Day-one ready flag plants at the top platform.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(245, 158, 11, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #f59e0b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.4px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.4px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.3px; fill: var(--muted); }
    .chip-text { font-size: 6px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 71 336 L 71 310 L 96 310"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 155 286 L 155 260 L 178 260"); animation: p23 9s linear infinite; }
    .p-34 { offset-path: path("M 238 236 L 238 210 L 260 210"); animation: p34 9s linear infinite; }
    .p-45 { offset-path: path("M 321 186 L 321 160 L 344 160"); animation: p45 9s linear infinite; }
    .p-56 { offset-path: path("M 406 136 L 406 110 L 426 110"); animation: p56 9s linear infinite; }
    .p-67 { offset-path: path("M 493 86 L 493 58 L 506 58"); animation: p67 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 17% { opacity:1; offset-distance:100%; } 20%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,23% { opacity:0; offset-distance:0%; } 25% { opacity:1; } 30% { opacity:1; offset-distance:100%; } 33%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p34 { 0%,36% { opacity:0; offset-distance:0%; } 38% { opacity:1; } 43% { opacity:1; offset-distance:100%; } 46%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p45 { 0%,49% { opacity:0; offset-distance:0%; } 51% { opacity:1; } 56% { opacity:1; offset-distance:100%; } 59%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,62% { opacity:0; offset-distance:0%; } 64% { opacity:1; } 69% { opacity:1; offset-distance:100%; } 72%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p67 { 0%,75% { opacity:0; offset-distance:0%; } 77% { opacity:1; } 83% { opacity:1; offset-distance:100%; } 86%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .card-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }
    #stage-7 .card-bg { animation: s7Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,13% { stroke: var(--line); stroke-width: 1.1; } 16%,27% { stroke: var(--accent); stroke-width: 1.7; } 31%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,26% { stroke: var(--line); stroke-width: 1.1; } 29%,40% { stroke: var(--accent); stroke-width: 1.7; } 44%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,39% { stroke: var(--line); stroke-width: 1.1; } 42%,53% { stroke: var(--accent); stroke-width: 1.7; } 57%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,52% { stroke: var(--line); stroke-width: 1.1; } 55%,66% { stroke: var(--accent); stroke-width: 1.7; } 70%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,65% { stroke: var(--line); stroke-width: 1.1; } 68%,79% { stroke: var(--accent); stroke-width: 1.7; } 83%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s7Hi { 0%,79% { stroke: var(--line); stroke-width: 1.1; } 83%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Climbing Avatar Token */
    .avatar-climb { animation: climbStairs 9s ease-in-out infinite; }
    @keyframes climbStairs {
      0%,10% { transform: translate(116px, 344px); }
      18%,24% { transform: translate(202px, 294px); }
      31%,37% { transform: translate(286px, 244px); }
      44%,50% { transform: translate(370px, 194px); }
      57%,63% { transform: translate(454px, 144px); }
      70%,77% { transform: translate(548px, 94px); }
      85%,95% { transform: translate(574px, 44px); }
      100% { transform: translate(116px, 344px); }
    }

    /* Internal Step Animations */
    .acc-tick { stroke-dasharray: 12; stroke-dashoffset: 12; animation: acCk 9s ease-out infinite; }
    .esig-draw { stroke-dasharray: 32; stroke-dashoffset: 32; animation: esDraw 9s ease-out infinite; }
    .mod-stack { animation: mdSt 9s ease-out infinite; }
    .prog-fill { transform-box: fill-box; transform-origin: left center; animation: prFill 9s ease-out infinite; }
    .mgr-tick { stroke-dasharray: 14; stroke-dashoffset: 14; animation: mgCk 9s ease-out infinite; }
    .flag-plant { transform-box: fill-box; transform-origin: bottom center; animation: flPl 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 22; stroke-dashoffset: 22; animation: drawFinal 9s ease-out infinite; }

    @keyframes acCk { 0%,16% { stroke-dashoffset: 12; } 24%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 12; } }
    @keyframes esDraw { 0%,30% { stroke-dashoffset: 32; } 38%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 32; } }
    @keyframes mdSt { 0%,42% { opacity:0.25; transform:translateY(-5px); } 50%,92% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.25; } }
    @keyframes prFill { 0%,54% { transform: scaleX(0.1); } 65%,92% { transform: scaleX(1); } 98%,100% { transform: scaleX(0.1); } }
    @keyframes mgCk { 0%,68% { stroke-dashoffset: 14; } 76%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 14; } }
    @keyframes flPl { 0%,82% { opacity:0.25; transform:scaleY(0.4); } 88%,96% { opacity:1; transform:scaleY(1); } 100% { opacity:0.25; } }
    @keyframes drawFinal { 0%,86% { stroke-dashoffset: 22; } 93%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 22; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Onboarding &amp; Training</text>
  <text x="620" y="21" text-anchor="end" class="method-text">HR webhook → accounts → e-sign → Notion → Day-one ready</text>

  <!-- Staircase Riser Connectors -->
  <path d="M 71 336 L 71 310 L 96 310" class="flow-path" />
  <path d="M 155 286 L 155 260 L 178 260" class="flow-path flow-accent" />
  <path d="M 238 236 L 238 210 L 260 210" class="flow-path" />
  <path d="M 321 186 L 321 160 L 344 160" class="flow-path flow-accent" />
  <path d="M 406 136 L 406 110 L 426 110" class="flow-path" />
  <path d="M 493 86 L 493 58 L 506 58" class="flow-path flow-accent" />

  <!-- Travelling Packets -->
  <circle r="3" class="packet p-12" />
  <circle r="3" class="packet p-23" />
  <circle r="3" class="packet p-34" />
  <circle r="3" class="packet p-45" />
  <circle r="3" class="packet p-56" />
  <circle r="3" class="packet p-67" />

  <!-- Connector Chips -->
  <g transform="translate(56, 296)">
    <rect x="-38" y="-7" width="76" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text">HR email → webhook</text>
  </g>
  <g transform="translate(136, 246)">
    <rect x="-24" y="-7" width="48" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text-accent">IT checklist</text>
  </g>
  <g transform="translate(218, 196)">
    <rect x="-20" y="-7" width="40" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text">→ e-sign</text>
  </g>
  <g transform="translate(294, 146)">
    <rect x="-34" y="-7" width="68" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text-accent">Notion workspace</text>
  </g>
  <g transform="translate(446, 56)">
    <rect x="-36" y="-7" width="72" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text-accent">summary → manager</text>
  </g>

  <!-- STAGE 1: TRIGGER "Hire confirmed" (Ground Level) -->
  <g id="stage-1" class="node">
    <rect x="16" y="336" width="110" height="52" rx="8" class="card-bg" />
    <text x="24" y="350" class="stage-num">01 · TRIGGER</text>
    <text x="24" y="362" class="stage-title">Hire confirmed</text>
    <rect x="24" y="369" width="44" height="13" rx="6.5" class="chip-bg" />
    <text x="46" y="378" text-anchor="middle" class="chip-text-accent">Welcome</text>
  </g>

  <!-- STAGE 2: STEP 1 "Accounts created" -->
  <g id="stage-2" class="node">
    <rect x="96" y="286" width="118" height="48" rx="8" class="card-bg" />
    <text x="104" y="300" class="stage-num">02 · STEP 1</text>
    <text x="104" y="312" class="stage-title">Accounts created</text>
    <text x="104" y="325" class="stage-copy">Email · Chat · CRM</text>
    <path d="M 192 318 L 195 321 L 201 315" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" class="acc-tick" />
  </g>

  <!-- STAGE 3: STEP 2 "Documents sent + signed" -->
  <g id="stage-3" class="node">
    <rect x="178" y="236" width="120" height="48" rx="8" class="card-bg" />
    <text x="186" y="250" class="stage-num">03 · STEP 2</text>
    <text x="186" y="262" class="stage-title">Docs signed</text>
    <path d="M 188 275 Q 204 268 220 275 Q 236 270 250 274" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" class="esig-draw" />
  </g>

  <!-- STAGE 4: STEP 3 "Training assigned" -->
  <g id="stage-4" class="node">
    <rect x="260" y="186" width="122" height="48" rx="8" class="card-bg" />
    <text x="268" y="200" class="stage-num">04 · STEP 3</text>
    <text x="268" y="212" class="stage-title">Training assigned</text>
    <g transform="translate(268, 217)"><g class="mod-stack">
      <rect x="0" y="0" width="28" height="10" rx="2.5" class="chip-bg" />
      <rect x="32" y="0" width="28" height="10" rx="2.5" class="chip-bg" />
      <rect x="64" y="0" width="28" height="10" rx="2.5" class="chip-bg" />
    </g></g>
  </g>

  <!-- STAGE 5: STEP 4 "Progress tracked" -->
  <g id="stage-5" class="node">
    <rect x="344" y="136" width="124" height="48" rx="8" class="card-bg" />
    <text x="352" y="150" class="stage-num">05 · STEP 4</text>
    <text x="352" y="162" class="stage-title">Progress tracked</text>
    <g class="ai-badge">
      <rect x="404" y="140" width="58" height="12" rx="6" class="chip-bg" />
      <text x="433" y="148.5" text-anchor="middle" class="chip-text-accent">Power Automate</text>
    </g>
    <rect x="352" y="169" width="96" height="6" rx="3" fill="var(--line)" opacity="0.4" />
    <rect x="352" y="169" width="96" height="6" rx="3" fill="var(--accent)" class="prog-fill" />
  </g>

  <!-- STAGE 6: STEP 5 "Manager readiness check" -->
  <g id="stage-6" class="node">
    <rect x="426" y="86" width="134" height="48" rx="8" class="card-bg" />
    <text x="434" y="100" class="stage-num">06 · STEP 5</text>
    <text x="434" y="112" class="stage-title">Readiness check</text>
    <g class="ai-badge">
      <rect x="434" y="117" width="76" height="12" rx="6" class="chip-bg" />
      <text x="472" y="125.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>
    <path d="M 526 118 L 530 122 L 538 114" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="mgr-tick" />
  </g>

  <!-- STAGE 7: PLATFORM "Day-one ready" (Top Step, End) -->
  <g id="stage-7" class="node">
    <rect x="506" y="30" width="120" height="54" rx="9" class="card-bg" />
    <text x="514" y="45" class="stage-num">07 · DAY ONE</text>
    <text x="514" y="57" class="stage-title">Day-one ready</text>

    <!-- Flag -->
    <g transform="translate(518, 62)"><g class="flag-plant">
      <line x1="0" y1="0" x2="0" y2="16" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round" />
      <polygon points="0,0 12,3.5 0,7" fill="var(--accent)" />
    </g></g>

    <circle cx="604" cy="62" r="10" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 599 62 L 602.5 65.5 L 609.5 58.5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>

  <!-- Climbing New-Hire Avatar Token -->
  <g class="avatar-climb">
    <circle cx="0" cy="0" r="8" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="1.4" />
    <circle cx="0" cy="-2" r="2.2" fill="var(--accent)" />
    <path d="M -3.8 4 C -3.8 1.5 3.8 1.5 3.8 4" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round" />
  </g>
</svg>
