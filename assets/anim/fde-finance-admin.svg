<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Finance Admin &amp; Reconciliation</title>
  <desc id="svg-desc">Six-stage matching bridge workflow for finance administration: month-end bank feed and inbox records land in one folder, Claude pairs bank lines to invoices with matching arcs across a central ledger spine, near-matches propose with dashed arcs and question chips, unmatched items drop into an exceptions tray, a human-in-the-loop finance reviewer approves, and the reconciled books sync to accounting software.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(245, 158, 11, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #f59e0b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.5px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.5px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.4px; fill: var(--muted); }
    .chip-text { font-size: 6px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .spine-bg { fill: var(--surface); stroke: var(--accent); stroke-opacity: 0.45; stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-1l { offset-path: path("M 210 78 Q 110 82 86 98"); animation: p12 9s linear infinite; }
    .p-1r { offset-path: path("M 430 78 Q 530 82 554 98"); animation: p12 9s linear infinite; }
    .p-2a { offset-path: path("M 156 146 Q 320 122 484 146"); animation: p2a 9s linear infinite; }
    .p-2b { offset-path: path("M 156 178 Q 320 156 484 178"); animation: p2b 9s linear infinite; }
    .p-3a { offset-path: path("M 156 210 Q 320 192 484 210"); animation: p3a 9s linear infinite; }
    .p-4t { offset-path: path("M 86 264 L 86 296"); animation: p4t 9s linear infinite; }
    .p-45 { offset-path: path("M 182 342 L 198 342"); animation: p45 9s linear infinite; }
    .p-56 { offset-path: path("M 366 342 L 468 342"); animation: p56 9s linear infinite; }

    @keyframes p12 { 0%,8% { opacity:0; offset-distance:0%; } 10% { opacity:1; } 17% { opacity:1; offset-distance:100%; } 20%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p2a { 0%,18% { opacity:0; offset-distance:0%; } 20% { opacity:1; } 27% { opacity:1; offset-distance:100%; } 30%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p2b { 0%,24% { opacity:0; offset-distance:0%; } 26% { opacity:1; } 33% { opacity:1; offset-distance:100%; } 36%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p3a { 0%,35% { opacity:0; offset-distance:0%; } 37% { opacity:1; } 44% { opacity:1; offset-distance:100%; } 47%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p4t { 0%,47% { opacity:0; offset-distance:0%; } 49% { opacity:1; } 55% { opacity:1; offset-distance:100%; } 58%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p45 { 0%,58% { opacity:0; offset-distance:0%; } 60% { opacity:1; } 65% { opacity:1; offset-distance:100%; } 68%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,74% { opacity:0; offset-distance:0%; } 76% { opacity:1; } 85% { opacity:1; offset-distance:100%; } 88%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,46% { stroke: var(--line); stroke-width: 1.1; } 50%,62% { stroke: var(--accent); stroke-width: 1.7; } 66%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,60% { stroke: var(--line); stroke-width: 1.1; } 64%,78% { stroke: var(--accent); stroke-width: 1.7; } 82%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,78% { stroke: var(--line); stroke-width: 1.1; } 82%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Columns Slide In */
    .col-l { animation: cSlideL 9s ease-out infinite; }
    .col-r { animation: cSlideR 9s ease-out infinite; }
    @keyframes cSlideL { 0% { opacity:0.35; transform:translateX(-8px); } 10%,90% { opacity:1; transform:translateX(0); } 98%,100% { opacity:0.35; } }
    @keyframes cSlideR { 0% { opacity:0.35; transform:translateX(8px); } 10%,90% { opacity:1; transform:translateX(0); } 98%,100% { opacity:0.35; } }

    /* Matching Arcs Draw */
    .arc-draw-1 { stroke-dasharray: 350; stroke-dashoffset: 350; animation: aDraw1 9s ease-out infinite; }
    .arc-draw-2 { stroke-dasharray: 350; stroke-dashoffset: 350; animation: aDraw2 9s ease-out infinite; }
    .arc-pulse { animation: aPulse 9s ease-in-out infinite; }
    @keyframes aDraw1 { 0%,16% { stroke-dashoffset: 350; } 26%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 350; } }
    @keyframes aDraw2 { 0%,22% { stroke-dashoffset: 350; } 32%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 350; } }
    @keyframes aPulse { 0%,34%,52%,100% { opacity:0.45; } 42%,48% { opacity:1; } }

    /* Tray Drop, Approve Tick, Ledger Spine Ticks */
    .tray-item { animation: trDrop 9s ease-out infinite; }
    .app-tick { stroke-dasharray: 16; stroke-dashoffset: 16; animation: apCk 9s ease-out infinite; }
    .spine-tick { stroke-dasharray: 14; stroke-dashoffset: 14; animation: spCk 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }

    @keyframes trDrop { 0%,46% { opacity:0.25; transform:translateY(-8px); } 56%,92% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.25; } }
    @keyframes apCk { 0%,64% { stroke-dashoffset: 16; } 74%,94% { stroke-dashoffset: 0; } 99%,100% { stroke-dashoffset: 16; } }
    @keyframes spCk { 0%,74% { stroke-dashoffset: 14; } 85%,95% { stroke-dashoffset: 0; } 99%,100% { stroke-dashoffset: 14; } }
    @keyframes drawFinal { 0%,86% { stroke-dashoffset: 24; } 93%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Finance Admin &amp; Reconciliation</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Bank feed + inbox → matching bridge → ledger → accounting</text>

  <!-- Flow Connectors -->
  <path d="M 210 78 Q 110 82 86 98" class="flow-path" />
  <path d="M 430 78 Q 530 82 554 98" class="flow-path" />
  <path d="M 86 264 L 86 296" class="flow-path" />
  <path d="M 182 342 L 198 342" class="flow-path" />
  <path d="M 366 342 L 468 342" class="flow-path flow-accent" />

  <!-- Connector Chips -->
  <g transform="translate(120, 82)">
    <rect x="-24" y="-7" width="48" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text">bank feed</text>
  </g>
  <g transform="translate(520, 82)">
    <rect x="-36" y="-7" width="72" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text-accent">inbox → one folder</text>
  </g>
  <g transform="translate(417, 342)">
    <rect x="-44" y="-7.5" width="88" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ accounting software</text>
  </g>

  <!-- STAGE 1: TRIGGER "Month-end records land" (Top Centre) -->
  <g id="stage-1" class="node">
    <rect x="184" y="32" width="272" height="46" rx="10" class="card-bg" />
    <text x="194" y="47" class="stage-num">01 · TRIGGER</text>
    <text x="256" y="47" class="stage-title">Month-end records land</text>
    <text x="194" y="64" class="stage-copy">Bank statements, invoices &amp; receipts gathered</text>
  </g>

  <!-- Left Column: Bank Statement List -->
  <g class="col-l">
    <rect x="16" y="98" width="140" height="166" rx="10" class="card-bg" />
    <text x="26" y="114" class="stage-title">Bank statement</text>
    <text x="26" y="126" class="stage-copy">Money-out lines</text>
    <rect x="26" y="136" width="120" height="22" rx="4" class="chip-bg" /><text x="34" y="150" class="chip-text">-$420 · Acme Supply</text>
    <rect x="26" y="166" width="120" height="22" rx="4" class="chip-bg" /><text x="34" y="180" class="chip-text">-$185 · Cloud Host</text>
    <rect x="26" y="196" width="120" height="22" rx="4" class="chip-bg" /><text x="34" y="210" class="chip-text">-$960 · Studio Rent</text>
    <rect x="26" y="226" width="120" height="22" rx="4" class="chip-bg" /><text x="34" y="240" class="stage-copy">-$74 · Unmatched</text>
  </g>

  <!-- Right Column: Invoices / Receipts Stack -->
  <g class="col-r">
    <rect x="484" y="98" width="140" height="166" rx="10" class="card-bg" />
    <text x="494" y="114" class="stage-title">Invoices / receipts</text>
    <text x="494" y="126" class="stage-copy">Matched docs</text>
    <rect x="494" y="136" width="120" height="22" rx="4" class="chip-bg" /><text x="502" y="150" class="chip-text">Inv #104 · $420</text>
    <rect x="494" y="166" width="120" height="22" rx="4" class="chip-bg" /><text x="502" y="180" class="chip-text">Rec #88 · $185</text>
    <rect x="494" y="196" width="120" height="22" rx="4" class="chip-bg" /><text x="502" y="210" class="chip-text">Inv #119 · $958</text>
    <rect x="494" y="226" width="120" height="22" rx="4" class="chip-bg" /><text x="502" y="240" class="stage-copy">Rec #92 · $40</text>
  </g>

  <!-- Central Ledger Spine -->
  <rect x="304" y="96" width="32" height="170" rx="8" class="spine-bg" />
  <text x="320" y="110" text-anchor="middle" class="stage-num">LEDGER</text>
  <path d="M 314 134 L 318 138 L 325 130" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="spine-tick" />
  <path d="M 314 166 L 318 170 L 325 162" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="spine-tick" />
  <path d="M 314 198 L 318 202 L 325 194" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="spine-tick" />

  <!-- STAGE 2: "Matching runs" (Centre Matching Arcs) -->
  <g id="stage-2" class="node">
    <g class="ai-badge">
      <rect x="218" y="96" width="42" height="14" rx="7" class="chip-bg" />
      <text x="239" y="105.5" text-anchor="middle" class="chip-text-accent">Claude</text>
    </g>
    <path d="M 156 146 Q 320 122 484 146" fill="none" stroke="var(--accent)" stroke-width="1.6" class="arc-draw-1" />
    <path d="M 156 178 Q 320 156 484 178" fill="none" stroke="var(--accent)" stroke-width="1.6" class="arc-draw-2" />
    <rect x="224" y="128" width="18" height="14" rx="7" class="chip-bg" /><text x="233" y="137.5" text-anchor="middle" class="chip-text-accent">=</text>
    <rect x="224" y="160" width="18" height="14" rx="7" class="chip-bg" /><text x="233" y="169.5" text-anchor="middle" class="chip-text-accent">=</text>
  </g>

  <!-- STAGE 3: "Near-matches proposed" (Dashed Arc + ? Chip) -->
  <g id="stage-3" class="node">
    <path d="M 156 210 Q 320 192 484 210" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3" class="arc-pulse" />
    <rect x="224" y="194" width="18" height="14" rx="7" class="chip-bg" />
    <text x="233" y="203.5" text-anchor="middle" class="chip-text-accent">?</text>
    <rect x="358" y="194" width="76" height="14" rx="7" class="chip-bg" />
    <text x="396" y="203.5" text-anchor="middle" class="chip-text">amount + date close</text>
  </g>

  <!-- Travelling Packets -->
  <circle r="3" class="packet p-1l" />
  <circle r="3" class="packet p-1r" />
  <circle r="3" class="packet p-2a" />
  <circle r="3" class="packet p-2b" />
  <circle r="3" class="packet p-3a" />
  <circle r="3" class="packet p-4t" />
  <circle r="3" class="packet p-45" />
  <circle r="3.1" class="packet p-56" />

  <!-- STAGE 4: "Exceptions drop" (Bottom Left Tray) -->
  <g id="stage-4" class="node">
    <rect x="16" y="296" width="166" height="90" rx="10" class="card-bg" />
    <text x="26" y="312" class="stage-num">04 · EXCEPTIONS</text>
    <text x="26" y="325" class="stage-title">Exceptions drop</text>
    <g class="tray-item" transform="translate(26, 334)">
      <rect x="0" y="0" width="144" height="18" rx="4" class="chip-bg" />
      <text x="8" y="11.5" class="stage-copy">-$74 · receipt missing</text>
      <rect x="0" y="22" width="144" height="18" rx="4" class="chip-bg" />
      <text x="8" y="33.5" class="stage-copy">+$40 · no invoice</text>
    </g>
  </g>

  <!-- STAGE 5: "Finance approves" (Bottom Centre Gate) -->
  <g id="stage-5" class="node">
    <rect x="198" y="296" width="168" height="90" rx="10" class="card-bg" />
    <text x="208" y="312" class="stage-num">05 · APPROVE</text>
    <text x="208" y="325" class="stage-title">Finance approves</text>
    <g class="ai-badge">
      <rect x="208" y="333" width="84" height="14" rx="7" class="chip-bg" />
      <text x="250" y="342.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>
    <path d="M 326 356 L 330 360 L 338 352" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" class="app-tick" />
    <text x="208" y="366" class="stage-copy">Near-matches &amp; tray confirmed</text>
  </g>

  <!-- STAGE 6: "Books reconciled" (Bottom Right, End) -->
  <g id="stage-6" class="node">
    <rect x="468" y="296" width="156" height="90" rx="10" class="card-bg" />
    <text x="478" y="312" class="stage-num">06 · RECONCILED</text>
    <text x="478" y="325" class="stage-title">Books reconciled</text>
    <text x="478" y="343" class="stage-copy">Records clean</text>
    <text x="478" y="355" class="stage-copy">&amp; current</text>

    <circle cx="598" cy="354" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 593 354 L 596.5 357.5 L 603.5 350.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
