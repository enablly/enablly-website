<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for CRM Cleanup &amp; Updates</title>
  <desc id="svg-desc">Five-stage three-path sorter with approval gate workflow for CRM cleanup: messy records sync from HubSpot or Salesforce, a Clay enrichment sorter diamond checks every record and splits them into three paths (duplicates paired, missing fields filled via web lookup, clean records passing straight through), all three paths hit a single human-in-the-loop approval gate bar, and clean records settle into the CRM cylinder.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(59, 130, 246, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #3b82f6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.6px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.9px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 9px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.8px; fill: var(--muted); }
    .chip-text { font-size: 6.3px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.3px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 64 112 L 64 82 L 210 82 L 210 142"); animation: p12 9s linear infinite; }
    .p-23a { offset-path: path("M 252 178 Q 274 96 304 96"); animation: p23 9s linear infinite; }
    .p-23b { offset-path: path("M 268 210 L 304 210"); animation: p23 9s linear infinite; }
    .p-23c { offset-path: path("M 252 242 Q 274 324 304 324"); animation: p23 9s linear infinite; }
    .p-34a { offset-path: path("M 424 96 L 454 96"); animation: p34 9s linear infinite; }
    .p-34b { offset-path: path("M 424 210 L 454 210"); animation: p34 9s linear infinite; }
    .p-34c { offset-path: path("M 424 324 L 454 324"); animation: p34 9s linear infinite; }
    .p-45a { offset-path: path("M 500 96 L 544 128"); animation: p45 9s linear infinite; }
    .p-45b { offset-path: path("M 500 210 Q 522 210 544 166"); animation: p45 9s linear infinite; }
    .p-45c { offset-path: path("M 500 324 Q 524 324 544 188"); animation: p45 9s linear infinite; }
    .p-56 { offset-path: path("M 585 210 L 585 274"); animation: p56 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 20% { opacity:1; offset-distance:100%; } 23%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,29% { opacity:0; offset-distance:0%; } 31% { opacity:1; } 38% { opacity:1; offset-distance:100%; } 41%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p34 { 0%,56% { opacity:0; offset-distance:0%; } 58% { opacity:1; } 64% { opacity:1; offset-distance:100%; } 67%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p45 { 0%,71% { opacity:0; offset-distance:0%; } 73% { opacity:1; } 79% { opacity:1; offset-distance:100%; } 82%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,81% { opacity:0; offset-distance:0%; } 83% { opacity:1; } 89% { opacity:1; offset-distance:100%; } 92%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .lane-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,16% { stroke: var(--accent); stroke-width: 1.7; } 20%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,16% { stroke: var(--line); stroke-width: 1.1; } 20%,34% { stroke: var(--accent); stroke-width: 1.7; } 38%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,34% { stroke: var(--line); stroke-width: 1.1; } 38%,60% { stroke: var(--accent); stroke-width: 1.7; } 64%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,60% { stroke: var(--line); stroke-width: 1.1; } 64%,76% { stroke: var(--accent); stroke-width: 1.7; } 80%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,75% { stroke: var(--line); stroke-width: 1.1; } 78%,86% { stroke: var(--accent); stroke-width: 1.7; } 90%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,85% { stroke: var(--line); stroke-width: 1.1; } 88%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Messy Cards Jitter */
    .jitter-1 { animation: jitA 9s ease-in-out infinite; }
    .jitter-2 { animation: jitB 9s ease-in-out infinite; }
    @keyframes jitA { 0%,100% { transform: rotate(-2deg); } 6%,12% { transform: rotate(2deg); } 18% { transform: rotate(-2deg); } }
    @keyframes jitB { 0%,100% { transform: translate(0,0); } 8% { transform: translate(2px,-2px); } 16% { transform: translate(0,0); } }

    /* Stage 2: Scan Line Sweeps Diamond */
    .scan-line { animation: scanD 9s ease-in-out infinite; opacity: 0; }
    @keyframes scanD { 0%,17% { opacity:0; transform:translateY(-28px); } 22% { opacity:0.95; transform:translateY(-28px); } 31% { opacity:0.95; transform:translateY(28px); } 34%,100% { opacity:0; transform:translateY(28px); } }

    /* Stage 3: Three Lane Internal Animations */
    .dup-a { animation: dupL 9s ease-in-out infinite; }
    .dup-b { animation: dupR 9s ease-in-out infinite; }
    @keyframes dupL { 0%,37% { transform: translateX(0px); } 45%,90% { transform: translateX(12px); } 98%,100% { transform: translateX(0px); } }
    @keyframes dupR { 0%,37% { transform: translateX(0px); opacity:0.85; } 45%,90% { transform: translateX(-12px); opacity:0; } 98%,100% { transform: translateX(0px); opacity:0.85; } }

    .gap-1 { transform-box: fill-box; transform-origin: left center; animation: gp1 9s ease-out infinite; }
    .gap-2 { transform-box: fill-box; transform-origin: left center; animation: gp2 9s ease-out infinite; }
    @keyframes gp1 { 0%,41% { transform: scaleX(0.15); opacity:0.3; } 49%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.15); opacity:0.3; } }
    @keyframes gp2 { 0%,44% { transform: scaleX(0.15); opacity:0.3; } 52%,90% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.15); opacity:0.3; } }

    .clean-glide { animation: clGlide 9s ease-in-out infinite; }
    @keyframes clGlide { 0%,47% { transform: translateX(-14px); opacity:0.55; } 55%,90% { transform: translateX(14px); opacity:1; } 98%,100% { transform: translateX(-14px); opacity:0.55; } }

    /* Stage 4: Gate Tick then Lift */
    .gate-tick { stroke-dasharray: 20; stroke-dashoffset: 20; animation: gTick 9s ease-out infinite; }
    .gate-bar { animation: gLift 9s ease-in-out infinite; }
    @keyframes gTick { 0%,64% { stroke-dashoffset: 20; } 70%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 20; } }
    @keyframes gLift { 0%,69% { transform: translateY(0px); opacity:0.9; } 75%,90% { transform: translateY(-16px); opacity:0.35; } 98%,100% { transform: translateY(0px); opacity:0.9; } }

    /* Stage 5: CRM Cylinder Rows Settle + End Tick */
    .crm-row { animation: crmSettle 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }
    @keyframes crmSettle { 0%,81% { opacity:0.3; transform:translateY(-4px); } 88%,96% { opacity:1; transform:translateY(0); } 100% { opacity:0.3; } }
    @keyframes drawFinal { 0%,88% { stroke-dashoffset: 24; } 94%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">CRM Cleanup &amp; Enrichment</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Messy sync → 3-way sorter → approval gate → clean CRM</text>

  <!-- Flow Connectors -->
  <path d="M 64 112 L 64 82 L 210 82 L 210 142" class="flow-path" />
  <path d="M 252 178 Q 274 96 304 96" class="flow-path flow-accent" />
  <path d="M 268 210 L 304 210" class="flow-path flow-accent" />
  <path d="M 252 242 Q 274 324 304 324" class="flow-path" />
  <path d="M 424 96 L 454 96" class="flow-path" />
  <path d="M 424 210 L 454 210" class="flow-path flow-accent" />
  <path d="M 424 324 L 454 324" class="flow-path" />
  <path d="M 500 96 L 544 128" class="flow-path flow-accent" />
  <path d="M 500 210 Q 522 210 544 166" class="flow-path flow-accent" />
  <path d="M 500 324 Q 524 324 544 188" class="flow-path flow-accent" />
  <path d="M 585 210 L 585 274" class="flow-path flow-accent" />

  <!-- Travelling Packets -->
  <circle r="3.2" class="packet p-12" />
  <circle r="3.1" class="packet p-23a" />
  <circle r="3.1" class="packet p-23b" />
  <circle r="3.1" class="packet p-23c" />
  <circle r="3.1" class="packet p-34a" />
  <circle r="3.1" class="packet p-34b" />
  <circle r="3.1" class="packet p-34c" />
  <circle r="3.1" class="packet p-45a" />
  <circle r="3.1" class="packet p-45b" />
  <circle r="3.1" class="packet p-45c" />
  <circle r="3.2" class="packet p-56" />

  <!-- Connector Chips -->
  <g transform="translate(138, 82)">
    <rect x="-48" y="-8" width="96" height="16" rx="8" class="chip-bg" />
    <text x="0" y="2.3" text-anchor="middle" class="chip-text">HubSpot / Salesforce sync</text>
  </g>
  <g transform="translate(210, 112)">
    <rect x="-39" y="-7.5" width="78" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.3" text-anchor="middle" class="chip-text-accent">nightly sync · Make</text>
  </g>
  <g transform="translate(274, 118)">
    <rect x="-24" y="-7.5" width="48" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.3" text-anchor="middle" class="chip-text-accent">duplicates</text>
  </g>
  <g transform="translate(284, 210)">
    <rect x="-15" y="-7.5" width="30" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.3" text-anchor="middle" class="chip-text-accent">gaps</text>
  </g>
  <g transform="translate(274, 304)">
    <rect x="-17" y="-7.5" width="34" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.3" text-anchor="middle" class="chip-text">clean</text>
  </g>
  <g transform="translate(439, 194)">
    <rect x="-24" y="-7.5" width="48" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.3" text-anchor="middle" class="chip-text-accent">web lookup</text>
  </g>
  <g transform="translate(572, 242)">
    <rect x="-46" y="-8" width="92" height="16" rx="8" class="chip-bg" />
    <text x="0" y="2.3" text-anchor="middle" class="chip-text-accent">→ HubSpot / Salesforce</text>
  </g>

  <!-- STAGE 1: TRIGGER "Records flow in" (Far Left, Messy Pile) -->
  <g id="stage-1" class="node">
    <rect x="16" y="112" width="102" height="186" rx="10" class="card-bg" />
    <text x="25" y="128" class="stage-num">01 · TRIGGER</text>
    <text x="25" y="140" class="stage-title">Records flow in</text>
    <text x="25" y="152" class="stage-copy">Messy pile</text>

    <!-- Overlapping / Jittering Messy Cards -->
    <g class="jitter-1" transform="translate(25, 166)">
      <rect x="0" y="0" width="76" height="30" rx="5" class="chip-bg" />
      <text x="8" y="13" class="chip-text">Acme Co</text>
      <text x="8" y="23" class="stage-copy">no email</text>
    </g>
    <g class="jitter-2" transform="translate(30, 192)">
      <rect x="0" y="0" width="76" height="30" rx="5" class="chip-bg" />
      <text x="8" y="13" class="chip-text">Acme Co</text>
      <text x="8" y="23" class="stage-copy">duplicate</text>
    </g>
    <g class="jitter-1" transform="translate(25, 236)">
      <rect x="0" y="0" width="76" height="30" rx="5" class="chip-bg" />
      <text x="8" y="13" class="chip-text">Beta Ltd</text>
      <text x="8" y="23" class="stage-copy">stale phone</text>
    </g>
  </g>

  <!-- STAGE 2: "Sorter checks every record" (Centre Diamond) -->
  <g id="stage-2" class="node">
    <polygon points="210,142 268,210 210,278 152,210" class="card-bg" />
    <text x="210" y="198" text-anchor="middle" class="stage-num">02 · SORTER</text>
    <text x="210" y="211" text-anchor="middle" class="stage-title">Sorter checks</text>
    <text x="210" y="222" text-anchor="middle" class="stage-copy">every record</text>

    <line x1="170" y1="210" x2="250" y2="210" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="scan-line" />

    <g class="ai-badge">
      <rect x="148" y="286" width="80" height="15" rx="7.5" class="chip-bg" />
      <text x="188" y="296" text-anchor="middle" class="chip-text-accent">Clay · enrichment</text>
      <rect x="232" y="286" width="40" height="15" rx="7.5" class="chip-bg" />
      <text x="252" y="296" text-anchor="middle" class="chip-text-accent">Claude</text>
    </g>
  </g>

  <!-- STAGE 3: THREE PATHS (One Stage Group, Three Lane Cards) -->
  <g id="stage-3" class="node">
    <!-- Top Lane: Duplicates paired -->
    <rect x="304" y="54" width="120" height="84" rx="9" class="card-bg lane-bg" />
    <text x="313" y="69" class="stage-num">03A · DUPLICATES</text>
    <text x="313" y="81" class="stage-title">Duplicates paired</text>
    <rect x="318" y="92" width="38" height="28" rx="4" class="chip-bg dup-a" />
    <rect x="364" y="92" width="38" height="28" rx="4" class="chip-bg dup-b" />
    <text x="364" y="131" text-anchor="middle" class="stage-copy">2 → 1 merged</text>

    <!-- Middle Lane: Missing fields filled -->
    <rect x="304" y="168" width="120" height="84" rx="9" class="card-bg lane-bg" />
    <text x="313" y="183" class="stage-num">03B · GAPS</text>
    <text x="313" y="195" class="stage-title">Missing fields filled</text>
    <rect x="314" y="206" width="96" height="5" rx="2.5" fill="var(--accent)" fill-opacity="0.7" class="gap-1" />
    <rect x="314" y="216" width="80" height="5" rx="2.5" fill="var(--ink)" fill-opacity="0.45" class="gap-2" />
    <text x="313" y="238" class="stage-copy">From web + docs</text>

    <!-- Bottom Lane: Clean — passes through -->
    <rect x="304" y="282" width="120" height="84" rx="9" class="card-bg lane-bg" />
    <text x="313" y="297" class="stage-num">03C · CLEAN</text>
    <text x="313" y="309" class="stage-title">Clean — passes</text>
    <g class="clean-glide" transform="translate(342, 322)">
      <rect x="0" y="0" width="44" height="24" rx="4" class="chip-bg" />
      <path d="M 16 12 L 20 16 L 28 8" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <text x="364" y="358" text-anchor="middle" class="stage-copy">Straight through</text>
  </g>

  <!-- STAGE 4: "You approve changes" (Vertical Gate Bar, Right Centre) -->
  <g id="stage-4" class="node">
    <rect x="454" y="54" width="46" height="312" rx="10" class="card-bg" />
    <g class="ai-badge">
      <rect x="435" y="34" width="84" height="14" rx="7" class="chip-bg" />
      <text x="477" y="43.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>

    <text x="477" y="76" text-anchor="middle" class="stage-num">04 · GATE</text>
    <text x="477" y="90" text-anchor="middle" class="stage-title">Approve</text>

    <!-- Gate Barrier + Tick -->
    <rect x="466" y="130" width="22" height="140" rx="5" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.2" class="gate-bar" />
    <circle cx="477" cy="316" r="11" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="1.2" />
    <path d="M 472 316 L 475.5 319.5 L 482.5 312.5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="gate-tick" />
  </g>

  <!-- STAGE 5: "CRM updated" (Far Right, Cylinder) -->
  <g id="stage-5" class="node">
    <path d="M 544 76 V 196 A 41 12 0 0 0 626 196 V 76 Z" class="card-bg" />
    <ellipse cx="585" cy="76" rx="41" ry="12" class="card-bg" />

    <text x="585" y="104" text-anchor="middle" class="stage-num">05 · CRM</text>
    <text x="585" y="117" text-anchor="middle" class="stage-title">CRM updated</text>

    <!-- Clean Settling Rows -->
    <g class="crm-row">
      <rect x="556" y="130" width="58" height="5" rx="2.5" fill="var(--accent)" fill-opacity="0.6" />
      <rect x="556" y="140" width="52" height="5" rx="2.5" fill="var(--ink)" fill-opacity="0.45" />
      <rect x="556" y="150" width="56" height="5" rx="2.5" fill="var(--ink)" fill-opacity="0.45" />
    </g>
    <text x="585" y="176" text-anchor="middle" class="stage-copy">1 record / acct</text>
  </g>

  <!-- STAGE 6: "Pipeline you can trust" (Far Right Bottom, End) -->
  <g id="stage-6" class="node">
    <rect x="516" y="274" width="112" height="114" rx="10" class="card-bg" />
    <text x="525" y="290" class="stage-num">06 · TRUSTED</text>
    <text x="525" y="303" class="stage-title">Pipeline you</text>
    <text x="525" y="314" class="stage-title">can trust</text>

    <text x="525" y="332" class="stage-copy">Open deals only</text>
    <text x="525" y="343" class="stage-copy">Follow-ups set</text>
    <text x="525" y="354" class="stage-copy">Stale ones cleared</text>

    <circle cx="604" cy="368" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 599 368 L 602.5 371.5 L 609.5 364.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
