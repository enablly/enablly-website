<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Spreadsheets &amp; Data</title>
  <desc id="svg-desc">Seven-stage three-stream confluence and exception side-tray workflow for spreadsheets and data: three messy files arrive from email attachments, form export and supplier file, pass through a Power Automate standardisation gate, deduplicate, match VLOOKUP-style via Claude, divert unclear rows into an exception side-tray for human-in-the-loop resolution, and rejoin into one clean table in Google Sheets or Excel.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(20, 184, 166, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #14b8a6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.6px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.6px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.5px; fill: var(--muted); }
    .chip-text { font-size: 6.1px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.1px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12a { offset-path: path("M 118 76 L 184 134"); animation: p12 9s linear infinite; }
    .p-12b { offset-path: path("M 118 156 L 184 156"); animation: p12 9s linear infinite; }
    .p-12c { offset-path: path("M 118 236 L 184 178"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 274 156 L 334 156"); animation: p23 9s linear infinite; }
    .p-34 { offset-path: path("M 422 156 L 438 156"); animation: p34 9s linear infinite; }
    .p-45 { offset-path: path("M 378 214 L 378 256 L 255 256 L 255 292"); animation: p45 9s linear infinite; }
    .p-56 { offset-path: path("M 326 338 L 350 338"); animation: p56 9s linear infinite; }
    .p-47 { offset-path: path("M 526 156 L 576 156 L 576 244"); animation: p47 9s linear infinite; }
    .p-67 { offset-path: path("M 484 338 L 516 338"); animation: p67 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 18% { opacity:1; offset-distance:100%; } 21%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,24% { opacity:0; offset-distance:0%; } 26% { opacity:1; } 31% { opacity:1; offset-distance:100%; } 34%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p34 { 0%,38% { opacity:0; offset-distance:0%; } 40% { opacity:1; } 44% { opacity:1; offset-distance:100%; } 47%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p45 { 0%,52% { opacity:0; offset-distance:0%; } 54% { opacity:1; } 61% { opacity:1; offset-distance:100%; } 64%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,65% { opacity:0; offset-distance:0%; } 67% { opacity:1; } 71% { opacity:1; offset-distance:100%; } 74%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p47 { 0%,75% { opacity:0; offset-distance:0%; } 77% { opacity:1; } 85% { opacity:1; offset-distance:100%; } 88%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p67 { 0%,77% { opacity:0; offset-distance:0%; } 79% { opacity:1; } 85% { opacity:1; offset-distance:100%; } 88%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .src-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .card-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }
    #stage-7 .card-bg { animation: s7Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.6; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 17%,29% { stroke: var(--accent); stroke-width: 1.7; } 33%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,28% { stroke: var(--line); stroke-width: 1.1; } 31%,43% { stroke: var(--accent); stroke-width: 1.7; } 47%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,42% { stroke: var(--line); stroke-width: 1.1; } 45%,57% { stroke: var(--accent); stroke-width: 1.7; } 61%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,56% { stroke: var(--line); stroke-width: 1.1; } 59%,70% { stroke: var(--accent); stroke-width: 1.7; } 74%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,68% { stroke: var(--line); stroke-width: 1.1; } 71%,82% { stroke: var(--accent); stroke-width: 1.7; } 86%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s7Hi { 0%,82% { stroke: var(--line); stroke-width: 1.1; } 85%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Mini-Tables Slide In */
    .src-slide { animation: sSlide 9s ease-out infinite; }
    @keyframes sSlide { 0% { opacity:0.35; transform:translateX(-8px); } 10%,90% { opacity:1; transform:translateX(0); } 98%,100% { opacity:0.35; transform:translateX(-8px); } }

    /* Stage 2: Column Headers Snap Aligned */
    .col-snap-l { animation: snapL 9s ease-in-out infinite; }
    .col-snap-r { animation: snapR 9s ease-in-out infinite; }
    @keyframes snapL { 0%,16% { transform: translateX(10px); } 26%,90% { transform: translateX(0px); } 98%,100% { transform: translateX(10px); } }
    @keyframes snapR { 0%,16% { transform: translateX(-10px); } 26%,90% { transform: translateX(0px); } 98%,100% { transform: translateX(-10px); } }

    /* Stage 3: Duplicate Row Dissolves */
    .dup-dissolve { animation: dissRow 9s ease-in-out infinite; }
    @keyframes dissRow { 0%,32% { opacity: 0.9; transform: translateY(0px); } 40%,90% { opacity: 0; transform: translateY(-6px); } 98%,100% { opacity: 0.9; transform: translateY(0px); } }

    /* Stage 4: Dotted Match-Lines Connect */
    .match-line { stroke-dasharray: 28; stroke-dashoffset: 28; animation: drawMatch 9s ease-out infinite; }
    @keyframes drawMatch { 0%,44% { stroke-dashoffset: 28; } 54%,90% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 28; } }

    /* Stage 5: Exception Rows Slide into Tray */
    .exc-drop { animation: excIn 9s ease-out infinite; }
    @keyframes excIn { 0%,56% { opacity:0.25; transform:translateY(-8px); } 66%,90% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.25; } }

    /* Stage 6 and 7: Tray Ticks + Final Table Settle */
    .tray-tick { stroke-dasharray: 16; stroke-dashoffset: 16; animation: drawTray 9s ease-out infinite; }
    .clean-row { animation: rowSet 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }
    @keyframes drawTray { 0%,71% { stroke-dashoffset: 16; } 78%,94% { stroke-dashoffset: 0; } 99%,100% { stroke-dashoffset: 16; } }
    @keyframes rowSet { 0%,82% { opacity:0.3; transform:translateY(-4px); } 89%,96% { opacity:1; transform:translateY(0); } 100% { opacity:0.3; } }
    @keyframes drawFinal { 0%,88% { stroke-dashoffset: 24; } 94%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Spreadsheets &amp; Data Cleanup</text>
  <text x="620" y="21" text-anchor="end" class="method-text">3 messy files → Power Automate → match + tray → Sheets / Excel</text>

  <!-- Flow Connectors -->
  <path d="M 118 76 L 184 134" class="flow-path" />
  <path d="M 118 156 L 184 156" class="flow-path flow-accent" />
  <path d="M 118 236 L 184 178" class="flow-path" />
  <path d="M 274 156 L 334 156" class="flow-path flow-accent" />
  <path d="M 422 156 L 438 156" class="flow-path flow-accent" />
  <path d="M 378 214 L 378 256 L 255 256 L 255 292" class="flow-path" />
  <path d="M 326 338 L 350 338" class="flow-path" />
  <path d="M 526 156 L 576 156 L 576 244" class="flow-path flow-accent" />
  <path d="M 484 338 L 516 338" class="flow-path flow-accent" />

  <!-- Travelling Packets -->
  <circle r="3" class="packet p-12a" />
  <circle r="3" class="packet p-12b" />
  <circle r="3" class="packet p-12c" />
  <circle r="3.1" class="packet p-23" />
  <circle r="3.1" class="packet p-34" />
  <circle r="3.1" class="packet p-45" />
  <circle r="3.1" class="packet p-56" />
  <circle r="3.2" class="packet p-47" />
  <circle r="3.1" class="packet p-67" />

  <!-- Connector Chips -->
  <g transform="translate(148, 86)">
    <rect x="-34" y="-7" width="68" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text">email attachments</text>
  </g>
  <g transform="translate(150, 156)">
    <rect x="-26" y="-7" width="52" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text-accent">form export</text>
  </g>
  <g transform="translate(148, 226)">
    <rect x="-28" y="-7" width="56" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text">supplier file</text>
  </g>
  <g transform="translate(304, 156)">
    <rect x="-38" y="-7.5" width="76" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">Power Automate flow</text>
  </g>
  <g transform="translate(322, 256)">
    <rect x="-28" y="-7.5" width="56" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">can't resolve</text>
  </g>
  <g transform="translate(576, 200)">
    <rect x="-44" y="-7.5" width="88" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ Google Sheets / Excel</text>
  </g>

  <!-- STAGE 1: TRIGGER "Files land" (Far Left, Three Stream Sources) -->
  <g id="stage-1" class="node">
    <!-- Stream A -->
    <g class="src-slide">
      <rect x="16" y="44" width="102" height="62" rx="9" class="card-bg src-bg" />
      <text x="24" y="58" class="stage-num">01A · TRIGGER</text>
      <text x="24" y="70" class="stage-title">Files land</text>
      <rect x="24" y="78" width="24" height="4" rx="1.5" fill="var(--accent)" />
      <rect x="52" y="78" width="20" height="4" rx="1.5" fill="var(--muted)" />
      <rect x="76" y="78" width="28" height="4" rx="1.5" fill="var(--ink)" fill-opacity="0.45" />
      <rect x="24" y="88" width="78" height="4" rx="1.5" fill="var(--muted)" fill-opacity="0.4" />
    </g>

    <!-- Stream B -->
    <g class="src-slide">
      <rect x="16" y="124" width="102" height="62" rx="9" class="card-bg src-bg" />
      <text x="24" y="138" class="stage-num">01B · FORM</text>
      <text x="24" y="150" class="stage-title">Web export</text>
      <rect x="24" y="158" width="20" height="4" rx="1.5" fill="var(--muted)" />
      <rect x="48" y="158" width="28" height="4" rx="1.5" fill="var(--accent)" />
      <rect x="80" y="158" width="24" height="4" rx="1.5" fill="var(--ink)" fill-opacity="0.45" />
      <rect x="24" y="168" width="74" height="4" rx="1.5" fill="var(--muted)" fill-opacity="0.4" />
    </g>

    <!-- Stream C -->
    <g class="src-slide">
      <rect x="16" y="204" width="102" height="62" rx="9" class="card-bg src-bg" />
      <text x="24" y="218" class="stage-num">01C · SUPPLIER</text>
      <text x="24" y="230" class="stage-title">CSV sheet</text>
      <rect x="24" y="238" width="28" height="4" rx="1.5" fill="var(--ink)" fill-opacity="0.45" />
      <rect x="56" y="238" width="20" height="4" rx="1.5" fill="var(--accent)" />
      <rect x="80" y="238" width="24" height="4" rx="1.5" fill="var(--muted)" />
      <rect x="24" y="248" width="76" height="4" rx="1.5" fill="var(--muted)" fill-opacity="0.4" />
    </g>
  </g>

  <!-- STAGE 2: "Formats standardised" (Filter Gate) -->
  <g id="stage-2" class="node">
    <rect x="184" y="110" width="90" height="94" rx="10" class="card-bg" />
    <text x="192" y="125" class="stage-num">02 · GATE</text>
    <text x="192" y="137" class="stage-title">Formats</text>
    <text x="192" y="148" class="stage-title">standardised</text>

    <!-- Snapping Column Headers -->
    <rect x="194" y="162" width="20" height="7" rx="2" fill="var(--accent)" class="col-snap-l" />
    <rect x="218" y="162" width="22" height="7" rx="2" fill="var(--ink)" fill-opacity="0.55" />
    <rect x="244" y="162" width="20" height="7" rx="2" fill="var(--muted)" class="col-snap-r" />
    <text x="194" y="186" class="stage-copy">Columns aligned</text>
  </g>

  <!-- STAGE 3: "Duplicates removed" (Centre) -->
  <g id="stage-3" class="node">
    <rect x="334" y="98" width="88" height="116" rx="10" class="card-bg" />
    <text x="342" y="114" class="stage-num">03 · DEDUPE</text>
    <text x="342" y="126" class="stage-title">Duplicates</text>
    <text x="342" y="137" class="stage-title">removed</text>

    <rect x="342" y="150" width="70" height="10" rx="3" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="0.9" />
    <rect x="342" y="166" width="70" height="10" rx="3" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="0.9" class="dup-dissolve" />
    <rect x="342" y="182" width="70" height="10" rx="3" fill="var(--surface)" stroke="var(--line)" stroke-width="0.9" />
  </g>

  <!-- STAGE 4: "Records matched" (Centre Right) -->
  <g id="stage-4" class="node">
    <rect x="438" y="98" width="88" height="116" rx="10" class="card-bg" />
    <text x="446" y="114" class="stage-num">04 · MATCH</text>
    <text x="446" y="126" class="stage-title">Records</text>
    <text x="446" y="137" class="stage-title">matched</text>

    <g class="ai-badge">
      <rect x="446" y="143" width="38" height="13" rx="6.5" class="chip-bg" />
      <text x="465" y="152" text-anchor="middle" class="chip-text-accent">Claude</text>
    </g>

    <!-- Dotted VLOOKUP-style Match Lines -->
    <circle cx="452" cy="172" r="3" fill="var(--accent)" />
    <line x1="455" y1="172" x2="508" y2="172" stroke="var(--accent)" stroke-width="1.3" stroke-dasharray="2 2" class="match-line" />
    <circle cx="511" cy="172" r="3" fill="var(--accent)" />

    <circle cx="452" cy="190" r="3" fill="var(--accent)" />
    <line x1="455" y1="190" x2="508" y2="190" stroke="var(--accent)" stroke-width="1.3" stroke-dasharray="2 2" class="match-line" />
    <circle cx="511" cy="190" r="3" fill="var(--accent)" />
  </g>

  <!-- STAGE 5: "Exceptions peel off" (Side-Tray, Bottom Centre) -->
  <g id="stage-5" class="node">
    <rect x="184" y="292" width="142" height="94" rx="10" class="card-bg" />
    <text x="194" y="307" class="stage-num">05 · SIDE-TRAY</text>
    <text x="194" y="319" class="stage-title">Exceptions peel off</text>

    <g class="exc-drop">
      <rect x="194" y="330" width="120" height="18" rx="4" class="chip-bg" />
      <text x="202" y="341.5" class="stage-copy">Row #14 · missing ID</text>
      <text x="304" y="342" text-anchor="middle" class="chip-text-accent">?</text>

      <rect x="194" y="354" width="120" height="18" rx="4" class="chip-bg" />
      <text x="202" y="365.5" class="stage-copy">Row #29 · mismatch</text>
      <text x="304" y="366" text-anchor="middle" class="chip-text-accent">?</text>
    </g>
  </g>

  <!-- STAGE 6: "You resolve the tray" (Tray Gate) -->
  <g id="stage-6" class="node">
    <rect x="350" y="292" width="134" height="94" rx="10" class="card-bg" />
    <text x="360" y="307" class="stage-num">06 · RESOLVE</text>
    <text x="360" y="319" class="stage-title">You resolve tray</text>

    <g class="ai-badge">
      <rect x="360" y="325" width="84" height="14" rx="7" class="chip-bg" />
      <text x="402" y="334.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>

    <path d="M 364 356 L 368 360 L 375 352" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="tray-tick" />
    <text x="382" y="358" class="stage-copy">Row #14 fixed</text>

    <path d="M 364 371 L 368 375 L 375 367" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" class="tray-tick" />
    <text x="382" y="373" class="stage-copy">Row #29 fixed</text>
  </g>

  <!-- STAGE 7: "One clean table" (Far Right, End) -->
  <g id="stage-7" class="node">
    <rect x="516" y="244" width="110" height="142" rx="10" class="card-bg" />
    <text x="524" y="260" class="stage-num">07 · TABLE</text>
    <text x="524" y="272" class="stage-title">One clean table</text>

    <g class="clean-row">
      <rect x="524" y="284" width="94" height="9" rx="2" fill="var(--accent)" fill-opacity="0.25" />
      <rect x="524" y="297" width="94" height="9" rx="2" fill="var(--ink)" fill-opacity="0.16" />
      <rect x="524" y="310" width="94" height="9" rx="2" fill="var(--ink)" fill-opacity="0.16" />
      <rect x="524" y="323" width="94" height="9" rx="2" fill="var(--ink)" fill-opacity="0.16" />
    </g>

    <circle cx="571" cy="360" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 566 360 L 569.5 363.5 L 576.5 356.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
