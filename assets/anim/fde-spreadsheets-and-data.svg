<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Spreadsheets &amp; Data</title>
  <desc id="svg-desc">Animated workflow showing how Enablly's forward-deployed AI automation cleans and enriches spreadsheets: a messy sheet arrives, duplicate rows fade out during cleanup, Microsoft Copilot and OpenAI fill formulas down a column, errors are flagged, a human checks, and a tidy sheet with a growing bar chart is delivered.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(20, 184, 166, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #14b8a6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }
    .title-main { font-size: 14.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .stage-num { font-size: 8.5px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 10.5px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 8.2px; fill: var(--muted); }
    .tag-text { font-size: 7.4px; font-weight: 600; fill: var(--ink); }
    .tag-text-accent { font-size: 7.4px; font-weight: 600; fill: var(--accent); }
    .brand-text { font-size: 7.6px; font-weight: 600; fill: var(--ink); }
    .method-text { font-size: 8px; font-weight: 600; fill: var(--muted); }
    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .pill-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.9; }
    .ai-badge .pill-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 5 5; animation: dashFlow 1s linear infinite; }
    @keyframes dashFlow { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .packet-1 { offset-path: path("M 102 174 C 102 204, 128 204, 128 232"); animation: pkt1 9s linear infinite; }
    .packet-2 { offset-path: path("M 218 278 C 248 278, 250 232, 250 194"); animation: pkt2 9s linear infinite; }
    .packet-3 { offset-path: path("M 332 132 C 354 132, 354 188, 354 224"); animation: pkt3 9s linear infinite; }
    .packet-4 { offset-path: path("M 440 280 C 468 280, 468 220, 468 178"); animation: pkt4 9s linear infinite; }
    .packet-5 { offset-path: path("M 526 126 C 562 126, 562 182, 562 224"); animation: pkt5 9s linear infinite; }

    @keyframes pkt1 { 0%, 10% { offset-distance: 0%; opacity: 0; } 12% { opacity: 1; } 20% { offset-distance: 100%; opacity: 1; } 22%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes pkt2 { 0%, 25% { offset-distance: 0%; opacity: 0; } 27% { opacity: 1; } 35% { offset-distance: 100%; opacity: 1; } 37%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes pkt3 { 0%, 44% { offset-distance: 0%; opacity: 0; } 46% { opacity: 1; } 54% { offset-distance: 100%; opacity: 1; } 56%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes pkt4 { 0%, 62% { offset-distance: 0%; opacity: 0; } 64% { opacity: 1; } 72% { offset-distance: 100%; opacity: 1; } 74%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes pkt5 { 0%, 76% { offset-distance: 0%; opacity: 0; } 78% { opacity: 1; } 85% { offset-distance: 100%; opacity: 1; } 87%, 100% { offset-distance: 100%; opacity: 0; } }

    .highlight-ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; }
    #stage-1 .highlight-ring { animation: lit1 9s ease-in-out infinite; }
    #stage-2 .highlight-ring { animation: lit2 9s ease-in-out infinite; }
    #stage-3 .highlight-ring { animation: lit3 9s ease-in-out infinite; }
    #stage-4 .highlight-ring { animation: lit4 9s ease-in-out infinite; }
    #stage-5 .highlight-ring { animation: lit5 9s ease-in-out infinite; }
    #stage-6 .highlight-ring { animation: lit6 9s ease-in-out infinite; }

    @keyframes lit1 { 0%, 96%, 100% { opacity: 0.15; } 4%, 14% { opacity: 1; } 20% { opacity: 0.25; } }
    @keyframes lit2 { 0%, 15% { opacity: 0; } 20%, 30% { opacity: 1; } 36%, 95% { opacity: 0.25; } 100% { opacity: 0; } }
    @keyframes lit3 { 0%, 30% { opacity: 0; } 35%, 48% { opacity: 1; } 54%, 95% { opacity: 0.25; } 100% { opacity: 0; } }
    @keyframes lit4 { 0%, 48% { opacity: 0; } 53%, 66% { opacity: 1; } 72%, 95% { opacity: 0.25; } 100% { opacity: 0; } }
    @keyframes lit5 { 0%, 66% { opacity: 0; } 71%, 80% { opacity: 1; } 86%, 95% { opacity: 0.25; } 100% { opacity: 0; } }
    @keyframes lit6 { 0%, 80% { opacity: 0; } 85%, 95% { opacity: 1; } 100% { opacity: 0; } }

    .ai-pulse-dot { fill: var(--accent); transform-box: fill-box; transform-origin: center; animation: aiPulse 1.5s ease-in-out infinite; }
    @keyframes aiPulse { 0%, 100% { opacity: 0.45; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.25); } }

    /* Stage 2: Duplicate rows fading out inside Clean */
    .dupe-row-fade { animation: dupeFade 9s ease-out infinite; }
    @keyframes dupeFade { 0%, 18% { opacity: 0.9; } 28%, 94% { opacity: 0.12; } 98%, 100% { opacity: 0.9; } }

    /* Stage 3: Cells highlighting and filling down a column */
    .cell-f1 { animation: cf1 9s ease-out infinite; }
    .cell-f2 { animation: cf2 9s ease-out infinite; }
    .cell-f3 { animation: cf3 9s ease-out infinite; }
    @keyframes cf1 { 0%, 33% { fill-opacity: 0.12; } 38%, 94% { fill-opacity: 0.85; } 98%, 100% { fill-opacity: 0.12; } }
    @keyframes cf2 { 0%, 37% { fill-opacity: 0.12; } 42%, 94% { fill-opacity: 0.85; } 98%, 100% { fill-opacity: 0.12; } }
    @keyframes cf3 { 0%, 41% { fill-opacity: 0.12; } 46%, 94% { fill-opacity: 0.85; } 98%, 100% { fill-opacity: 0.12; } }

    /* Stage 5: Self-drawing check */
    .check-pop { transform-box: fill-box; transform-origin: center; animation: checkPop 9s ease-out infinite; }
    .check-stroke { stroke-dasharray: 16; stroke-dashoffset: 16; animation: checkDraw 9s ease-out infinite; }
    @keyframes checkPop { 0%, 70% { opacity: 0.25; transform: scale(0.75); } 74%, 94% { opacity: 1; transform: scale(1.05); } 98%, 100% { opacity: 0.25; transform: scale(0.75); } }
    @keyframes checkDraw { 0%, 71% { stroke-dashoffset: 16; } 78%, 94% { stroke-dashoffset: 0; } 98%, 100% { stroke-dashoffset: 16; } }

    /* Stage 6: Bar chart growing in final card */
    .fbar-1, .fbar-2, .fbar-3 { transform-box: fill-box; transform-origin: bottom center; }
    .fbar-1 { animation: fb1 9s ease-out infinite; }
    .fbar-2 { animation: fb2 9s ease-out infinite; }
    .fbar-3 { animation: fb3 9s ease-out infinite; }
    @keyframes fb1 { 0%, 80% { transform: scaleY(0.15); } 87%, 95% { transform: scaleY(1); } 99%, 100% { transform: scaleY(0.15); } }
    @keyframes fb2 { 0%, 82% { transform: scaleY(0.15); } 89%, 95% { transform: scaleY(1); } 99%, 100% { transform: scaleY(0.15); } }
    @keyframes fb3 { 0%, 84% { transform: scaleY(0.15); } 91%, 95% { transform: scaleY(1); } 99%, 100% { transform: scaleY(0.15); } }

    .progress-fill { fill: var(--accent); transform-box: fill-box; transform-origin: left center; animation: progressLoop 9s linear infinite; }
    @keyframes progressLoop { 0% { transform: scaleX(0.05); opacity: 0.8; } 94% { transform: scaleX(1); opacity: 1; } 99%, 100% { transform: scaleX(0.05); opacity: 0.3; } }
  </style>

  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="var(--line)" opacity="0.55" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="640" height="400" fill="url(#dot-grid)" opacity="0.5" />

  <g id="header">
    <circle cx="24" cy="28" r="4" fill="var(--accent)" />
    <text x="34" y="32" class="title-main">AI Automation for Spreadsheets &amp; Data</text>
    <rect x="462" y="18" width="160" height="20" rx="10" class="pill-bg" />
    <circle cx="474" cy="28" r="2.5" fill="var(--accent)" />
    <text x="481" y="31" class="method-text">Forward-deployed · Embedded</text>
  </g>

  <g id="flow-paths">
    <path class="flow-path" d="M 102 174 C 102 204, 128 204, 128 232" />
    <path class="flow-path" d="M 218 278 C 248 278, 250 232, 250 194" />
    <path class="flow-path" d="M 332 132 C 354 132, 354 188, 354 224" />
    <path class="flow-path" d="M 440 280 C 468 280, 468 220, 468 178" />
    <path class="flow-path" d="M 526 126 C 562 126, 562 182, 562 224" />
  </g>

  <g id="packets">
    <circle class="packet packet-1" r="3.5" />
    <circle class="packet packet-2" r="3.5" />
    <circle class="packet packet-3" r="3.5" />
    <circle class="packet packet-4" r="3.5" />
    <circle class="packet packet-5" r="3.5" />
  </g>

  <!-- STAGE 1: Messy Spreadsheet In -->
  <g id="stage-1" class="node">
    <rect x="16" y="70" width="108" height="104" rx="10" class="card-bg" />
    <rect x="16" y="70" width="108" height="104" rx="10" class="highlight-ring" />
    <text x="26" y="86" class="stage-num">01 · SHEET IN</text>
    <text x="26" y="101" class="stage-title">Messy sheet</text>
    <rect x="26" y="110" width="88" height="28" rx="5" fill="var(--accent)" fill-opacity="0.08" stroke="var(--line)" stroke-width="0.7" />
    <line x1="26" y1="119" x2="114" y2="119" stroke="var(--line)" stroke-width="0.7" />
    <line x1="26" y1="128" x2="114" y2="128" stroke="var(--line)" stroke-width="0.7" />
    <line x1="56" y1="110" x2="56" y2="138" stroke="var(--line)" stroke-width="0.7" />
    <text x="26" y="152" class="stage-copy">Raw CSVs, dupes &amp;</text>
    <text x="26" y="163" class="stage-copy">broken formats</text>
  </g>

  <!-- STAGE 2: Cleaned & De-duplicated (Duplicate rows fading out) -->
  <g id="stage-2" class="node">
    <rect x="92" y="232" width="126" height="114" rx="10" class="card-bg" />
    <rect x="92" y="232" width="126" height="114" rx="10" class="highlight-ring" />
    <text x="102" y="248" class="stage-num">02 · CLEAN</text>
    <text x="102" y="263" class="stage-title">De-duplicated</text>

    <!-- Duplicate rows fading out -->
    <g transform="translate(102, 272)">
      <rect x="0" y="0" width="104" height="6" rx="2" fill="var(--accent)" fill-opacity="0.65" />
      <rect x="0" y="9" width="104" height="6" rx="2" fill="var(--accent)" fill-opacity="0.65" class="dupe-row-fade" />
      <rect x="0" y="18" width="104" height="6" rx="2" fill="var(--accent)" fill-opacity="0.65" />
      <rect x="0" y="27" width="104" height="6" rx="2" fill="var(--accent)" fill-opacity="0.65" class="dupe-row-fade" />
    </g>

    <g class="ai-badge">
      <rect x="102" y="318" width="54" height="16" rx="8" class="pill-bg" />
      <circle cx="111" cy="326" r="2.2" class="ai-pulse-dot" />
      <text x="117" y="328.5" class="tag-text-accent">AI agent</text>
    </g>
  </g>

  <!-- STAGE 3: Formulas & Enrichment Added (Cells filling down a column) -->
  <g id="stage-3" class="node">
    <rect x="190" y="62" width="142" height="132" rx="10" class="card-bg" />
    <rect x="190" y="62" width="142" height="132" rx="10" class="highlight-ring" />
    <text x="200" y="78" class="stage-num">03 · AI STAGE A</text>
    <circle cx="318" cy="75" r="3" class="ai-pulse-dot" />
    <text x="200" y="92" class="stage-title">Formulas &amp; enrich</text>
    <text x="200" y="104" class="stage-copy">Auto-fills column logic</text>

    <!-- Cells filling down a column -->
    <g transform="translate(200, 114)">
      <rect x="0" y="0" width="32" height="28" rx="4" fill="none" stroke="var(--line)" stroke-width="0.8" />
      <rect x="4" y="4" width="24" height="5" rx="1.5" fill="var(--accent)" class="cell-f1" />
      <rect x="4" y="11" width="24" height="5" rx="1.5" fill="var(--accent)" class="cell-f2" />
      <rect x="4" y="18" width="24" height="5" rx="1.5" fill="var(--accent)" class="cell-f3" />
    </g>

    <!-- Logos: Microsoft Copilot, OpenAI -->
    <g transform="translate(238, 115)">
      <rect x="1" y="1" width="3.5" height="3.5" rx="0.8" fill="var(--accent)" />
      <rect x="5" y="1" width="3.5" height="3.5" rx="0.8" fill="var(--ink)" fill-opacity="0.55" />
      <rect x="1" y="5" width="3.5" height="3.5" rx="0.8" fill="var(--ink)" fill-opacity="0.55" />
      <rect x="5" y="5" width="3.5" height="3.5" rx="0.8" fill="var(--accent)" fill-opacity="0.7" />
      <text x="11" y="7.5" class="brand-text">Microsoft Copilot</text>
    </g>
    <g transform="translate(238, 131)">
      <polygon points="4.5,0.6 8,2.6 8,6.6 4.5,8.6 1,6.6 1,2.6" fill="none" stroke="var(--accent)" stroke-width="1.1" />
      <text x="11" y="7.5" class="brand-text">OpenAI</text>
    </g>

    <g class="ai-badge">
      <rect x="200" y="162" width="54" height="15" rx="7.5" class="pill-bg" />
      <text x="208" y="172" class="tag-text-accent">AI copilot</text>
    </g>
  </g>

  <!-- STAGE 4: Errors Flagged -->
  <g id="stage-4" class="node">
    <rect x="302" y="224" width="138" height="130" rx="10" class="card-bg" />
    <rect x="302" y="224" width="138" height="130" rx="10" class="highlight-ring" />
    <text x="312" y="240" class="stage-num">04 · AI STAGE B</text>
    <circle cx="426" cy="237" r="3" class="ai-pulse-dot" />
    <text x="312" y="254" class="stage-title">Errors flagged</text>
    <text x="312" y="266" class="stage-copy">Outliers &amp; mismatches</text>
    <text x="312" y="276" class="stage-copy">highlighted for review</text>

    <rect x="312" y="286" width="118" height="24" rx="5" fill="var(--accent)" fill-opacity="0.08" stroke="var(--line)" stroke-width="0.7" />
    <circle cx="323" cy="298" r="5" fill="var(--accent)" fill-opacity="0.25" />
    <text x="321.5" y="301" fill="var(--accent)" font-size="8" font-weight="800">!</text>
    <text x="333" y="300.5" class="tag-text">2 anomalies flagged</text>

    <g class="ai-badge">
      <rect x="312" y="326" width="42" height="16" rx="8" class="pill-bg" />
      <circle cx="321" cy="334" r="2" class="ai-pulse-dot" />
      <text x="327" y="336.5" class="tag-text-accent">LLM</text>
    </g>
  </g>

  <!-- STAGE 5: Human Check -->
  <g id="stage-5" class="node">
    <rect x="416" y="70" width="110" height="108" rx="10" class="card-bg" />
    <rect x="416" y="70" width="110" height="108" rx="10" class="highlight-ring" />
    <text x="426" y="86" class="stage-num">05 · REVIEW</text>
    <text x="426" y="100" class="stage-title">Human check</text>
    <text x="426" y="113" class="stage-copy">Analyst confirms</text>
    <text x="426" y="123" class="stage-copy">flagged cells</text>
    <g class="check-pop" transform="translate(494, 92)">
      <circle cx="10" cy="10" r="9" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="1.2" />
      <path d="M6 10.2 L8.8 13 L14.2 7.5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="check-stroke" />
    </g>
    <rect x="425" y="148" width="92" height="16" rx="8" class="pill-bg" />
    <text x="433" y="158.5" class="tag-text-accent">human-in-the-loop</text>
  </g>

  <!-- STAGE 6: Tidy Sheet + Chart Out (Bar chart growing) -->
  <g id="stage-6" class="node">
    <rect x="502" y="224" width="122" height="130" rx="10" class="card-bg" />
    <rect x="502" y="224" width="122" height="130" rx="10" class="highlight-ring" />
    <text x="512" y="240" class="stage-num">06 · DELIVERED</text>
    <text x="512" y="254" class="stage-title">Tidy sheet + chart</text>

    <g transform="translate(512, 263)">
      <rect x="0" y="0" width="102" height="44" rx="6" fill="var(--accent)" fill-opacity="0.06" stroke="var(--line)" stroke-width="0.8" />
      <!-- Growing bar chart -->
      <rect x="12" y="20" width="9" height="18" rx="1.5" fill="var(--accent)" class="fbar-1" />
      <rect x="26" y="13" width="9" height="25" rx="1.5" fill="var(--accent)" fill-opacity="0.8" class="fbar-2" />
      <rect x="40" y="7" width="9" height="31" rx="1.5" fill="var(--accent)" class="fbar-3" />
      <circle cx="84" cy="22" r="8" fill="var(--accent)" />
      <path d="M80.5 22 L83 24.5 L87.8 19.8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="512" y="324" class="stage-copy">Clean table &amp; live</text>
    <text x="512" y="335" class="stage-copy">summary chart ready</text>
  </g>

  <g id="footer">
    <rect x="16" y="376" width="104" height="16" rx="8" class="pill-bg" />
    <text x="24" y="386.5" class="tag-text">workflow automation</text>
    <rect x="132" y="382" width="492" height="4" rx="2" fill="var(--line)" opacity="0.4" />
    <rect x="132" y="382" width="492" height="4" rx="2" class="progress-fill" />
  </g>
</svg>
