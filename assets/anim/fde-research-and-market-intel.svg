<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Research &amp; Market Intel</title>
  <desc id="svg-desc">Seven-stage radar watch loop workflow for market intelligence: a watchlist triggers a daily scheduled radar scan powered by Perplexity and Gemini, three competitor blips flare as the sweep arm passes (price drop, new launch, new ads), evidence snapshots save to Notion, Claude compiles a plain-English brief, a human skims and decides, and the weekly brief delivers to the inbox on Fridays.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(20, 184, 166, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #14b8a6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.6px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.6px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.5px; fill: var(--muted); }
    .chip-text { font-size: 6.1px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.1px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .radar-ring { fill: none; stroke: var(--line); stroke-width: 1; }
    .radar-outer { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 230 80 L 200 104"); animation: p12 9s linear infinite; }
    .p-34 { offset-path: path("M 250 156 Q 324 72 388 72"); animation: p34 9s linear infinite; }
    .p-45 { offset-path: path("M 506 108 L 506 126"); animation: p45 9s linear infinite; }
    .p-56 { offset-path: path("M 506 218 L 506 234"); animation: p56 9s linear infinite; }
    .p-67 { offset-path: path("M 506 304 L 506 330"); animation: p67 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 18% { opacity:1; offset-distance:100%; } 21%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p34 { 0%,46% { opacity:0; offset-distance:0%; } 48% { opacity:1; } 56% { opacity:1; offset-distance:100%; } 59%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p45 { 0%,58% { opacity:0; offset-distance:0%; } 60% { opacity:1; } 64% { opacity:1; offset-distance:100%; } 67%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,72% { opacity:0; offset-distance:0%; } 74% { opacity:1; } 78% { opacity:1; offset-distance:100%; } 81%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p67 { 0%,82% { opacity:0; offset-distance:0%; } 84% { opacity:1; } 89% { opacity:1; offset-distance:100%; } 92%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .radar-outer { animation: s2Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }
    #stage-7 .card-bg { animation: s7Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.2; } 18%,46% { stroke: var(--accent); stroke-width: 1.7; } 50%,100% { stroke: var(--line); stroke-width: 1.2; } }
    @keyframes s4Hi { 0%,46% { stroke: var(--line); stroke-width: 1.1; } 50%,62% { stroke: var(--accent); stroke-width: 1.7; } 66%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,60% { stroke: var(--line); stroke-width: 1.1; } 64%,76% { stroke: var(--accent); stroke-width: 1.7; } 80%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,74% { stroke: var(--line); stroke-width: 1.1; } 78%,86% { stroke: var(--accent); stroke-width: 1.7; } 90%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s7Hi { 0%,84% { stroke: var(--line); stroke-width: 1.1; } 87%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Watchlist Chips Slot In */
    .wl-chip { animation: wlIn 9s ease-out infinite; }
    @keyframes wlIn { 0% { opacity:0.25; transform:translateY(-4px); } 10%,90% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.25; } }

    /* Stage 2: Continuous Radar Sweep Arm */
    .sweep-arm { transform-origin: 176px 242px; animation: sweepRot 4.5s linear infinite; }
    @keyframes sweepRot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Stage 3: Blips Flare in Sequence */
    .blip-1 { transform-box: fill-box; transform-origin: center; animation: bl1 9s ease-out infinite; }
    .blip-2 { transform-box: fill-box; transform-origin: center; animation: bl2 9s ease-out infinite; }
    .blip-3 { transform-box: fill-box; transform-origin: center; animation: bl3 9s ease-out infinite; }
    @keyframes bl1 { 0%,20% { opacity:0.35; transform:scale(0.8); } 28%,90% { opacity:1; transform:scale(1.1); } 98%,100% { opacity:0.35; } }
    @keyframes bl2 { 0%,30% { opacity:0.35; transform:scale(0.8); } 38%,90% { opacity:1; transform:scale(1.1); } 98%,100% { opacity:0.35; } }
    @keyframes bl3 { 0%,40% { opacity:0.35; transform:scale(0.8); } 48%,90% { opacity:1; transform:scale(1.1); } 98%,100% { opacity:0.35; } }

    /* Stage 4: Evidence Snapshots Stack */
    .ev-stack { animation: evIn 9s ease-out infinite; }
    @keyframes evIn { 0%,48% { opacity:0.25; transform:translateX(8px); } 58%,92% { opacity:1; transform:translateX(0); } 98%,100% { opacity:0.25; } }

    /* Stage 5: Brief Lines Type */
    .br-1 { transform-box: fill-box; transform-origin: left center; animation: br1 9s ease-out infinite; }
    .br-2 { transform-box: fill-box; transform-origin: left center; animation: br2 9s ease-out infinite; }
    .br-3 { transform-box: fill-box; transform-origin: left center; animation: br3 9s ease-out infinite; }
    @keyframes br1 { 0%,60% { transform: scaleX(0.05); opacity:0.25; } 66%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.25; } }
    @keyframes br2 { 0%,63% { transform: scaleX(0.05); opacity:0.25; } 69%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.25; } }
    @keyframes br3 { 0%,66% { transform: scaleX(0.05); opacity:0.25; } 72%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.25; } }

    /* Stage 6 and 7: Reading Highlight Sweep + End Tick */
    .read-hl { animation: rdSweep 9s ease-in-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }
    @keyframes rdSweep { 0%,74% { opacity:0.2; transform:translateY(0); } 81% { opacity:0.8; transform:translateY(14px); } 88%,100% { opacity:0.2; transform:translateY(0); } }
    @keyframes drawFinal { 0%,88% { stroke-dashoffset: 24; } 94%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Research &amp; Market Intel</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Watchlist → daily radar → Notion log → Friday brief</text>

  <!-- Flow Connectors -->
  <path d="M 230 80 L 200 104" class="flow-path" />
  <path d="M 250 156 Q 324 72 388 72" class="flow-path flow-accent" />
  <path d="M 506 108 L 506 126" class="flow-path" />
  <path d="M 506 218 L 506 234" class="flow-path" />
  <path d="M 506 304 L 506 330" class="flow-path flow-accent" />

  <!-- Travelling Packets -->
  <circle r="3.1" class="packet p-12" />
  <circle r="3.2" class="packet p-34" />
  <circle r="3" class="packet p-45" />
  <circle r="3" class="packet p-56" />
  <circle r="3.1" class="packet p-67" />

  <!-- Connector Chips -->
  <g transform="translate(226, 92)">
    <rect x="-32" y="-7" width="64" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text">your watchlist</text>
  </g>
  <g transform="translate(332, 72)">
    <rect x="-32" y="-7.5" width="64" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ Notion log</text>
  </g>
  <g transform="translate(506, 317)">
    <rect x="-46" y="-7.5" width="92" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ your inbox, Fridays</text>
  </g>

  <!-- STAGE 1: TRIGGER "Watchlist set" (Top Centre) -->
  <g id="stage-1" class="node">
    <rect x="180" y="34" width="194" height="46" rx="10" class="card-bg" />
    <text x="190" y="48" class="stage-num">01 · TRIGGER</text>
    <text x="248" y="48" class="stage-title">Watchlist set</text>
    <g class="wl-chip">
      <rect x="190" y="56" width="56" height="16" rx="8" class="chip-bg" /><text x="218" y="66.5" text-anchor="middle" class="chip-text">Competitors</text>
      <rect x="252" y="56" width="46" height="16" rx="8" class="chip-bg" /><text x="275" y="66.5" text-anchor="middle" class="chip-text">Pricing</text>
      <rect x="304" y="56" width="46" height="16" rx="8" class="chip-bg" /><text x="327" y="66.5" text-anchor="middle" class="chip-text-accent">Topics</text>
    </g>
  </g>

  <!-- STAGE 2: "Radar watching" (Large Radar Circle) -->
  <g id="stage-2" class="node">
    <circle cx="176" cy="242" r="136" class="radar-outer" />
    <circle cx="176" cy="242" r="94" class="radar-ring" />
    <circle cx="176" cy="242" r="50" class="radar-ring" />
    <line x1="40" y1="242" x2="312" y2="242" stroke="var(--line)" stroke-width="0.8" />
    <line x1="176" y1="106" x2="176" y2="378" stroke="var(--line)" stroke-width="0.8" />

    <!-- Sweep Arm -->
    <g class="sweep-arm">
      <path d="M 176 242 L 176 108 A 134 134 0 0 1 268 145 Z" fill="var(--accent)" fill-opacity="0.14" />
      <line x1="176" y1="242" x2="176" y2="108" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" />
    </g>
    <circle cx="176" cy="242" r="4" fill="var(--accent)" />

    <!-- Radar Header & Badges -->
    <text x="16" y="102" class="stage-num">02 · RADAR</text>
    <text x="16" y="115" class="stage-title">Radar watching</text>
    <g class="ai-badge">
      <rect x="16" y="122" width="46" height="13" rx="6.5" class="chip-bg" />
      <text x="39" y="131" text-anchor="middle" class="chip-text-accent">Perplexity</text>
      <rect x="66" y="122" width="40" height="13" rx="6.5" class="chip-bg" />
      <text x="86" y="131" text-anchor="middle" class="chip-text-accent">Gemini</text>
    </g>
    <rect x="276" y="234" width="96" height="15" rx="7.5" class="chip-bg" />
    <text x="324" y="244" text-anchor="middle" class="chip-text">scheduled scans · daily</text>
  </g>

  <!-- STAGE 3: "Changes blip" (Three Nodes on Radar) -->
  <g id="stage-3" class="node">
    <g class="blip-1" transform="translate(244, 156)">
      <circle cx="0" cy="0" r="8" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="1.4" />
      <rect x="10" y="-8" width="42" height="15" rx="7.5" class="chip-bg" />
      <text x="31" y="2" text-anchor="middle" class="chip-text-accent">price ↓</text>
    </g>
    <g class="blip-2" transform="translate(238, 286)">
      <circle cx="0" cy="0" r="8" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="1.4" />
      <rect x="10" y="-8" width="54" height="15" rx="7.5" class="chip-bg" />
      <text x="37" y="2" text-anchor="middle" class="chip-text-accent">new launch</text>
    </g>
    <g class="blip-3" transform="translate(108, 304)">
      <circle cx="0" cy="0" r="8" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="1.4" />
      <rect x="-54" y="-8" width="44" height="15" rx="7.5" class="chip-bg" />
      <text x="-32" y="2" text-anchor="middle" class="chip-text-accent">new ads</text>
    </g>
  </g>

  <!-- STAGE 4: "Evidence captured" (Right Top) -->
  <g id="stage-4" class="node">
    <rect x="388" y="36" width="236" height="72" rx="10" class="card-bg" />
    <text x="398" y="51" class="stage-num">04 · EVIDENCE</text>
    <text x="398" y="63" class="stage-title">Evidence captured</text>
    <text x="398" y="75" class="stage-copy">Source link + snapshot saved</text>
    <g class="ev-stack" transform="translate(528, 46)">
      <rect x="0" y="0" width="80" height="22" rx="4" class="chip-bg" />
      <rect x="6" y="18" width="80" height="22" rx="4" class="chip-bg" />
      <text x="46" y="32" text-anchor="middle" class="chip-text-accent">3 snapshots</text>
    </g>
  </g>

  <!-- STAGE 5: "Brief compiled" (Right Centre) -->
  <g id="stage-5" class="node">
    <rect x="388" y="126" width="236" height="92" rx="10" class="card-bg" />
    <text x="398" y="142" class="stage-num">05 · BRIEF</text>
    <text x="398" y="155" class="stage-title">Brief compiled</text>
    <g class="ai-badge">
      <rect x="572" y="135" width="42" height="14" rx="7" class="chip-bg" />
      <text x="593" y="144.5" text-anchor="middle" class="chip-text-accent">Claude</text>
    </g>

    <rect x="398" y="168" width="196" height="5" rx="2.5" fill="var(--accent)" fill-opacity="0.7" class="br-1" />
    <rect x="398" y="182" width="174" height="5" rx="2.5" fill="var(--ink)" fill-opacity="0.45" class="br-2" />
    <rect x="398" y="196" width="186" height="5" rx="2.5" fill="var(--ink)" fill-opacity="0.45" class="br-3" />
  </g>

  <!-- STAGE 6: "You skim + decide" (Right Bottom) -->
  <g id="stage-6" class="node">
    <rect x="388" y="234" width="236" height="70" rx="10" class="card-bg" />
    <text x="398" y="249" class="stage-num">06 · SKIM</text>
    <text x="398" y="261" class="stage-title">You skim + decide</text>
    <g class="ai-badge">
      <rect x="528" y="242" width="84" height="14" rx="7" class="chip-bg" />
      <text x="570" y="251.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>
    <rect x="398" y="270" width="160" height="10" rx="3" fill="var(--accent)" fill-opacity="0.16" class="read-hl" />
    <text x="398" y="294" class="stage-copy">5-minute executive read</text>
  </g>

  <!-- STAGE 7: "Weekly brief delivered" (Bottom Right, End) -->
  <g id="stage-7" class="node">
    <rect x="388" y="330" width="236" height="58" rx="10" class="card-bg" />
    <text x="398" y="346" class="stage-num">07 · DELIVERED</text>
    <text x="398" y="359" class="stage-title">Weekly brief delivered</text>
    <text x="398" y="373" class="stage-copy">Lands every Friday on schedule</text>

    <circle cx="598" cy="359" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 593 359 L 596.5 362.5 L 603.5 355.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
