<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Reporting &amp; Dashboards</title>
  <desc id="svg-desc">Seven-stage scheduled pipeline and chart wall workflow for reporting and dashboards: a Monday 8:00 cron schedule triggers an API pull from Ads, CRM and Sheets into a central chart wall where Microsoft Copilot and Gemini build bar charts, line charts and KPI counters, changes vs baseline are highlighted, Claude drafts plain-English commentary in a bottom ribbon, a human checks accuracy, and the report delivers to Looker Studio and email.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(20, 184, 166, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #14b8a6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.5px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.7px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.8px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.6px; fill: var(--muted); }
    .chip-text { font-size: 6.2px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.2px; font-weight: 700; fill: var(--accent); }
    .kpi-num { font-size: 10.5px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 196 66 L 266 66"); animation: p12 9s linear infinite; }
    .p-23 { offset-path: path("M 394 98 L 394 128"); animation: p23 9s linear infinite; }
    .p-34 { offset-path: path("M 444 206 L 454 206"); animation: p34 9s linear infinite; }
    .p-35 { offset-path: path("M 146 286 L 146 316"); animation: p35 9s linear infinite; }
    .p-56 { offset-path: path("M 244 352 L 262 352"); animation: p56 9s linear infinite; }
    .p-67 { offset-path: path("M 392 352 L 502 352"); animation: p67 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 18% { opacity:1; offset-distance:100%; } 21%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,22% { opacity:0; offset-distance:0%; } 24% { opacity:1; } 30% { opacity:1; offset-distance:100%; } 33%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p34 { 0%,44% { opacity:0; offset-distance:0%; } 46% { opacity:1; } 51% { opacity:1; offset-distance:100%; } 54%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p35 { 0%,56% { opacity:0; offset-distance:0%; } 58% { opacity:1; } 64% { opacity:1; offset-distance:100%; } 67%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,70% { opacity:0; offset-distance:0%; } 72% { opacity:1; } 77% { opacity:1; offset-distance:100%; } 80%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p67 { 0%,80% { opacity:0; offset-distance:0%; } 82% { opacity:1; } 89% { opacity:1; offset-distance:100%; } 92%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .card-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-4 .card-bg { animation: s4Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }
    #stage-7 .card-bg { animation: s7Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,13% { stroke: var(--line); stroke-width: 1.1; } 17%,28% { stroke: var(--accent); stroke-width: 1.7; } 32%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,27% { stroke: var(--line); stroke-width: 1.1; } 30%,47% { stroke: var(--accent); stroke-width: 1.7; } 51%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s4Hi { 0%,45% { stroke: var(--line); stroke-width: 1.1; } 48%,61% { stroke: var(--accent); stroke-width: 1.7; } 65%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,59% { stroke: var(--line); stroke-width: 1.1; } 62%,74% { stroke: var(--accent); stroke-width: 1.7; } 78%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,72% { stroke: var(--line); stroke-width: 1.1; } 75%,84% { stroke: var(--accent); stroke-width: 1.7; } 88%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s7Hi { 0%,83% { stroke: var(--line); stroke-width: 1.1; } 86%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: Clock Hand Sweeps to 8:00 */
    .clk-hand { transform-box: fill-box; transform-origin: 0px 100%; animation: clkSweep 9s ease-out infinite; }
    @keyframes clkSweep { 0% { transform: rotate(-90deg); } 12%,92% { transform: rotate(240deg); } 100% { transform: rotate(-90deg); } }

    /* Stage 2: Three Streams Pour into Funnel */
    .strm { stroke-dasharray: 24; stroke-dashoffset: 24; animation: pourIn 9s ease-out infinite; }
    @keyframes pourIn { 0%,15% { stroke-dashoffset: 24; } 26%,90% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 24; } }

    /* Stage 3: Bars Grow, Line Chart Draws, KPI Ticks Up */
    .bar-g { transform-box: fill-box; transform-origin: bottom center; animation: barGrow 9s ease-out infinite; }
    .line-draw { stroke-dasharray: 140; stroke-dashoffset: 140; animation: drawChart 9s ease-out infinite; }
    @keyframes barGrow { 0%,28% { transform: scaleY(0.1); opacity:0.35; } 42%,92% { transform: scaleY(1); opacity:1; } 98%,100% { transform: scaleY(0.1); opacity:0.35; } }
    @keyframes drawChart { 0%,30% { stroke-dashoffset: 140; } 46%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 140; } }

    .kpi-1 { opacity: 1; animation: k1 9s linear infinite; }
    .kpi-2 { opacity: 0; animation: k2 9s linear infinite; }
    .kpi-3 { opacity: 0; animation: k3 9s linear infinite; }
    @keyframes k1 { 0%,34% { opacity:1; } 36%,95% { opacity:0; } 98%,100% { opacity:1; } }
    @keyframes k2 { 0%,34% { opacity:0; } 36%,41% { opacity:1; } 43%,100% { opacity:0; } }
    @keyframes k3 { 0%,41% { opacity:0; } 43%,94% { opacity:1; } 98%,100% { opacity:0; } }

    /* Stage 4: Mover Flash + Highlight Ring */
    .mover-ring { opacity: 0; animation: ringPulse 9s ease-in-out infinite; }
    @keyframes ringPulse { 0%,48% { opacity:0; } 53%,60% { opacity:1; } 64%,92% { opacity:0.55; } 98%,100% { opacity:0; } }

    /* Stage 5: Commentary Types Out */
    .com-1 { transform-box: fill-box; transform-origin: left center; animation: cm1 9s ease-out infinite; }
    .com-2 { transform-box: fill-box; transform-origin: left center; animation: cm2 9s ease-out infinite; }
    @keyframes cm1 { 0%,61% { transform: scaleX(0.05); opacity:0.3; } 68%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.3; } }
    @keyframes cm2 { 0%,64% { transform: scaleX(0.05); opacity:0.3; } 71%,92% { transform: scaleX(1); opacity:1; } 98%,100% { transform: scaleX(0.05); opacity:0.3; } }

    /* Stage 6 and 7: Human Tick + Final Delivery Tick */
    .hum-tick { stroke-dasharray: 18; stroke-dashoffset: 18; animation: drawHum 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }
    @keyframes drawHum { 0%,75% { stroke-dashoffset: 18; } 82%,94% { stroke-dashoffset: 0; } 99%,100% { stroke-dashoffset: 18; } }
    @keyframes drawFinal { 0%,87% { stroke-dashoffset: 24; } 94%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Reporting &amp; Dashboards</text>
  <text x="620" y="21" text-anchor="end" class="method-text">Monday 8:00 cron → API pull → chart wall → Looker Studio</text>

    <defs>
    <mask id="cutout-reporting-and-dashboards">
      <rect width="640" height="400" fill="white" />
      <rect x="199.5" y="57.0" width="63.0" height="18.0" rx="7.5" fill="black" />
      <rect x="368.5" y="104.0" width="51.0" height="18.0" rx="7.5" fill="black" />
      <rect x="106.5" y="292.0" width="79.0" height="18.0" rx="7.5" fill="black" />
      <rect x="397.5" y="342.5" width="99.0" height="19.0" rx="8.0" fill="black" />
    </mask>
  </defs>

  <!-- Flow Connectors -->
  <g mask="url(#cutout-reporting-and-dashboards)">
  <path d="M 196 66 L 266 66" class="flow-path" />
  <path d="M 394 98 L 394 128" class="flow-path flow-accent" />
  <path d="M 444 206 L 454 206" class="flow-path flow-accent" />
  <path d="M 146 286 L 146 316" class="flow-path" />
  <path d="M 244 352 L 262 352" class="flow-path" />
  <path d="M 392 352 L 502 352" class="flow-path flow-accent" />
  </g>
<!-- Travelling Packets -->
  <circle r="3.1" class="packet p-12" />
  <circle r="3.1" class="packet p-23" />
  <circle r="3.1" class="packet p-34" />
  <circle r="3.1" class="packet p-35" />
  <circle r="3.1" class="packet p-56" />
  <circle r="3.2" class="packet p-67" />

  <!-- Connector Chips -->
  <g transform="translate(231, 66)">
    <rect x="-30" y="-7.5" width="60" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">cron schedule</text>
  </g>
  <g transform="translate(394, 113)">
    <rect x="-24" y="-7.5" width="48" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">API pull</text>
  </g>
  <g transform="translate(146, 301)">
    <rect x="-38" y="-7.5" width="76" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">draft commentary</text>
  </g>
  <g transform="translate(447, 352)">
    <rect x="-48" y="-8" width="96" height="16" rx="8" class="chip-bg" />
    <text x="0" y="2.3" text-anchor="middle" class="chip-text-accent">→ Looker Studio + email</text>
  </g>

  <!-- STAGE 1: TRIGGER "Monday 8:00 — schedule fires" -->
  <g id="stage-1" class="node">
    <rect x="16" y="34" width="180" height="64" rx="10" class="card-bg" />
    <text x="26" y="49" class="stage-num">01 · TRIGGER</text>
    <text x="26" y="61" class="stage-title">Monday 8:00</text>
    <text x="26" y="74" class="stage-copy">Schedule fires</text>

    <!-- Clock Face -->
    <g transform="translate(162, 66)">
      <circle cx="0" cy="0" r="16" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.3" />
      <line x1="0" y1="0" x2="-8" y2="-4" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" />
      <line x1="0" y1="0" x2="0" y2="-11" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" class="clk-hand" />
      <circle cx="0" cy="0" r="1.8" fill="var(--accent)" />
    </g>
  </g>

  <!-- STAGE 2: "Numbers pulled" (Top Centre, 3 Source Chips + Funnel Streams) -->
  <g id="stage-2" class="node">
    <rect x="266" y="34" width="256" height="64" rx="10" class="card-bg" />
    <text x="276" y="49" class="stage-num">02 · INGEST</text>
    <text x="276" y="61" class="stage-title">Numbers pulled</text>

    <rect x="372" y="42" width="38" height="14" rx="7" class="chip-bg" />
    <text x="391" y="51.5" text-anchor="middle" class="chip-text">Ads</text>
    <rect x="416" y="42" width="38" height="14" rx="7" class="chip-bg" />
    <text x="435" y="51.5" text-anchor="middle" class="chip-text">CRM</text>
    <rect x="460" y="42" width="46" height="14" rx="7" class="chip-bg" />
    <text x="483" y="51.5" text-anchor="middle" class="chip-text">Sheets</text>

    <path d="M 391 56 L 435 84" fill="none" stroke="var(--accent)" stroke-width="1.3" class="strm" />
    <path d="M 435 56 L 435 84" fill="none" stroke="var(--accent)" stroke-width="1.3" class="strm" />
    <path d="M 483 56 L 435 84" fill="none" stroke="var(--accent)" stroke-width="1.3" class="strm" />
    <polygon points="424,84 446,84 440,92 430,92" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="1" />
  </g>

  <!-- STAGE 3: "Dashboard builds" (Centre Chart Wall) -->
  <g id="stage-3" class="node">
    <rect x="16" y="128" width="428" height="158" rx="10" class="card-bg" />
    <text x="28" y="145" class="stage-num">03 · CHART WALL</text>
    <text x="28" y="158" class="stage-title">Dashboard builds</text>

    <g class="ai-badge">
      <rect x="292" y="136" width="84" height="14" rx="7" class="chip-bg" />
      <text x="334" y="145.5" text-anchor="middle" class="chip-text-accent">Microsoft Copilot</text>
      <rect x="382" y="136" width="48" height="14" rx="7" class="chip-bg" />
      <text x="406" y="145.5" text-anchor="middle" class="chip-text-accent">Gemini</text>
    </g>

    <!-- Growing Bar Chart -->
    <g transform="translate(30, 178)">
      <rect x="0" y="0" width="128" height="90" rx="6" class="chip-bg" />
      <text x="10" y="15" class="stage-copy">Weekly Revenue</text>
      <rect x="16" y="48" width="14" height="32" rx="2" fill="var(--accent)" fill-opacity="0.45" class="bar-g" />
      <rect x="36" y="38" width="14" height="42" rx="2" fill="var(--accent)" fill-opacity="0.6" class="bar-g" />
      <rect x="56" y="44" width="14" height="36" rx="2" fill="var(--accent)" fill-opacity="0.55" class="bar-g" />
      <rect x="76" y="26" width="14" height="54" rx="2" fill="var(--accent)" fill-opacity="0.8" class="bar-g" />
      <rect x="96" y="18" width="14" height="62" rx="2" fill="var(--accent)" class="bar-g" />
    </g>

    <!-- Self-Drawing Line Chart -->
    <g transform="translate(172, 178)">
      <rect x="0" y="0" width="142" height="90" rx="6" class="chip-bg" />
      <text x="10" y="15" class="stage-copy">Conversion Trend</text>
      <path d="M 14 72 L 38 60 L 62 64 L 88 42 L 110 46 L 128 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="line-draw" />
    </g>

    <!-- Ticking KPI Counter -->
    <g transform="translate(328, 178)">
      <rect x="0" y="0" width="102" height="90" rx="6" class="chip-bg" />
      <text x="10" y="15" class="stage-copy">Pipeline</text>
      <text x="10" y="44" class="kpi-num kpi-1">$48k</text>
      <text x="10" y="44" class="kpi-num kpi-2">$64k</text>
      <text x="10" y="44" class="kpi-num kpi-3">$82k</text>
      <text x="10" y="64" class="stage-copy">vs last week</text>
    </g>
  </g>

  <!-- STAGE 4: "Changes spotted" (Right of Panel) -->
  <g id="stage-4" class="node">
    <rect x="454" y="128" width="170" height="158" rx="10" class="card-bg" />
    <text x="466" y="145" class="stage-num">04 · MOVERS</text>
    <text x="466" y="158" class="stage-title">Changes spotted</text>

    <!-- Two KPI Chips + Highlight Ring on Biggest Mover -->
    <g transform="translate(468, 178)">
      <rect x="0" y="0" width="142" height="36" rx="7" class="chip-bg" />
      <rect x="-3" y="-3" width="148" height="42" rx="9" fill="none" stroke="var(--accent)" stroke-width="1.6" class="mover-ring" />
      <text x="12" y="16" class="stage-title">▲ +18% Leads</text>
      <text x="12" y="28" class="stage-copy">Biggest mover</text>
    </g>

    <g transform="translate(468, 228)">
      <rect x="0" y="0" width="142" height="36" rx="7" class="chip-bg" />
      <text x="12" y="16" class="stage-title">▼ -6% CPL</text>
      <text x="12" y="28" class="stage-copy">Improved cost</text>
    </g>
  </g>

  <!-- STAGE 5: "Story explained" (Bottom Ribbon) -->
  <g id="stage-5" class="node">
    <rect x="16" y="316" width="228" height="72" rx="10" class="card-bg" />
    <text x="26" y="331" class="stage-num">05 · NARRATIVE</text>
    <text x="26" y="343" class="stage-title">Story explained</text>
    <g class="ai-badge">
      <rect x="192" y="322" width="42" height="14" rx="7" class="chip-bg" />
      <text x="213" y="331.5" text-anchor="middle" class="chip-text-accent">Claude</text>
    </g>

    <rect x="26" y="354" width="194" height="5" rx="2.5" fill="var(--accent)" fill-opacity="0.7" class="com-1" />
    <rect x="26" y="366" width="166" height="5" rx="2.5" fill="var(--ink)" fill-opacity="0.45" class="com-2" />
  </g>

  <!-- STAGE 6: "Human check" (Bottom Right-Centre) -->
  <g id="stage-6" class="node">
    <rect x="262" y="316" width="130" height="72" rx="10" class="card-bg" />
    <text x="272" y="331" class="stage-num">06 · CHECK</text>
    <text x="272" y="343" class="stage-title">Human check</text>
    <g class="ai-badge">
      <rect x="272" y="352" width="84" height="14" rx="7" class="chip-bg" />
      <text x="314" y="361.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>
    <path d="M 368 358 L 372 362 L 380 353" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hum-tick" />
  </g>

  <!-- STAGE 7: "Report delivered" (Far Right, End) -->
  <g id="stage-7" class="node">
    <rect x="502" y="316" width="122" height="72" rx="10" class="card-bg" />
    <text x="512" y="331" class="stage-num">07 · DELIVERED</text>
    <text x="512" y="343" class="stage-title">Report ready</text>
    <text x="512" y="358" class="stage-copy">On schedule</text>

    <circle cx="598" cy="364" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 593 364 L 596.5 367.5 L 603.5 360.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
