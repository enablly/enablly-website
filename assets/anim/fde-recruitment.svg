<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">AI Automation for Recruitment &amp; Screening</title>
  <desc id="svg-desc">Six-stage criteria sieve and three-piles workflow for recruitment: CVs pour in via ATS or inbox webhook, Claude and OpenAI evaluate each CV against a must-have checklist gate, cards drop into three physical piles (Shortlist, Maybe, No) with reason tags attached, a human-in-the-loop makes the final call on shortlist candidates, and calendar invites are drafted.</desc>

  <style>
    svg {
      --bg: transparent;
      --surface: rgba(245, 158, 11, 0.06);
      --ink: #18181b;
      --muted: #71717a;
      --line: rgba(113, 113, 122, 0.32);
      --accent: #f59e0b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
    }

    .title-main { font-size: 13.5px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .method-text { font-size: 7.4px; font-weight: 600; fill: var(--muted); }
    .stage-num { font-size: 6.6px; font-weight: 700; fill: var(--accent); letter-spacing: 0.04em; }
    .stage-title { font-size: 8.6px; font-weight: 700; fill: var(--ink); }
    .stage-copy { font-size: 6.5px; fill: var(--muted); }
    .chip-text { font-size: 6.1px; font-weight: 600; fill: var(--ink); }
    .chip-text-accent { font-size: 6.1px; font-weight: 700; fill: var(--accent); }
    .counter-text { font-size: 9.5px; font-weight: 700; fill: var(--accent); }

    .card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.1; }
    .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 0.85; }
    .ai-badge .chip-bg { stroke: var(--accent); stroke-opacity: 0.55; }
    .node { transform-box: fill-box; transform-origin: center; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: dashFlow 1s linear infinite;
    }
    .flow-accent { stroke: var(--accent); stroke-opacity: 0.55; }
    @keyframes dashFlow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .packet { fill: var(--accent); opacity: 0; }
    .p-12 { offset-path: path("M 184 78 L 284 78"); animation: p12 9s linear infinite; }
    .p-23a { offset-path: path("M 340 124 L 106 166"); animation: p23 9s linear infinite; }
    .p-23b { offset-path: path("M 440 124 L 318 166"); animation: p23 9s linear infinite; }
    .p-23c { offset-path: path("M 540 124 L 530 166"); animation: p23 9s linear infinite; }
    .p-35 { offset-path: path("M 107 268 L 107 306"); animation: p35 9s linear infinite; }
    .p-56 { offset-path: path("M 312 346 L 418 346"); animation: p56 9s linear infinite; }

    @keyframes p12 { 0%,10% { opacity:0; offset-distance:0%; } 12% { opacity:1; } 18% { opacity:1; offset-distance:100%; } 21%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p23 { 0%,28% { opacity:0; offset-distance:0%; } 30% { opacity:1; } 37% { opacity:1; offset-distance:100%; } 40%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p35 { 0%,64% { opacity:0; offset-distance:0%; } 66% { opacity:1; } 72% { opacity:1; offset-distance:100%; } 75%,100% { opacity:0; offset-distance:100%; } }
    @keyframes p56 { 0%,78% { opacity:0; offset-distance:0%; } 80% { opacity:1; } 87% { opacity:1; offset-distance:100%; } 90%,100% { opacity:0; offset-distance:100%; } }

    /* Stage Active Highlights */
    #stage-1 .card-bg { animation: s1Hi 9s ease-in-out infinite; }
    #stage-2 .card-bg { animation: s2Hi 9s ease-in-out infinite; }
    #stage-3 .pile-bg { animation: s3Hi 9s ease-in-out infinite; }
    #stage-5 .card-bg { animation: s5Hi 9s ease-in-out infinite; }
    #stage-6 .card-bg { animation: s6Hi 9s ease-in-out infinite; }

    @keyframes s1Hi { 0%,14% { stroke: var(--accent); stroke-width: 1.7; } 18%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s2Hi { 0%,14% { stroke: var(--line); stroke-width: 1.1; } 18%,34% { stroke: var(--accent); stroke-width: 1.7; } 38%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s3Hi { 0%,34% { stroke: var(--line); stroke-width: 1.1; } 38%,64% { stroke: var(--accent); stroke-width: 1.7; } 68%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s5Hi { 0%,66% { stroke: var(--line); stroke-width: 1.1; } 70%,82% { stroke: var(--accent); stroke-width: 1.7; } 86%,100% { stroke: var(--line); stroke-width: 1.1; } }
    @keyframes s6Hi { 0%,80% { stroke: var(--line); stroke-width: 1.1; } 84%,98% { stroke: var(--accent); stroke-width: 1.7; } 100% { stroke: var(--line); stroke-width: 1.1; } }

    /* Stage 1: CV Shuffle + Counter Past 50 */
    .cv-shuf { animation: shuf 9s ease-in-out infinite; }
    @keyframes shuf { 0%,100% { transform: translateY(0); } 6% { transform: translateY(-3px); } 12% { transform: translateY(0); } }
    .cnt-1 { opacity: 1; animation: c1 9s linear infinite; }
    .cnt-2 { opacity: 0; animation: c2 9s linear infinite; }
    .cnt-3 { opacity: 0; animation: c3 9s linear infinite; }
    @keyframes c1 { 0%,5% { opacity:1; } 7%,95% { opacity:0; } 98%,100% { opacity:1; } }
    @keyframes c2 { 0%,5% { opacity:0; } 7%,11% { opacity:1; } 13%,100% { opacity:0; } }
    @keyframes c3 { 0%,11% { opacity:0; } 13%,94% { opacity:1; } 98%,100% { opacity:0; } }

    /* Stage 2: Criteria Checklist Ticks */
    .ck-1 { stroke-dasharray: 12; stroke-dashoffset: 12; animation: ckA 9s ease-out infinite; }
    .ck-2 { stroke-dasharray: 12; stroke-dashoffset: 12; animation: ckB 9s ease-out infinite; }
    @keyframes ckA { 0%,18% { stroke-dashoffset: 12; } 24%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 12; } }
    @keyframes ckB { 0%,22% { stroke-dashoffset: 12; } 28%,92% { stroke-dashoffset: 0; } 98%,100% { stroke-dashoffset: 12; } }

    /* Stage 3 and 4: Piles Drop + Reason Tags Flip */
    .pile-drop-1 { animation: pd1 9s ease-out infinite; }
    .pile-drop-2 { animation: pd2 9s ease-out infinite; }
    .pile-drop-3 { animation: pd3 9s ease-out infinite; }
    .tag-flip { transform-box: fill-box; transform-origin: center; animation: tfPop 9s ease-out infinite; }
    @keyframes pd1 { 0%,34% { opacity:0.25; transform:translateY(-10px); } 44%,92% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.25; } }
    @keyframes pd2 { 0%,38% { opacity:0.25; transform:translateY(-10px); } 48%,92% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.25; } }
    @keyframes pd3 { 0%,42% { opacity:0.25; transform:translateY(-10px); } 52%,92% { opacity:1; transform:translateY(0); } 98%,100% { opacity:0.25; } }
    @keyframes tfPop { 0%,54% { opacity:0.2; transform:scale(0.75); } 62%,92% { opacity:1; transform:scale(1); } 98%,100% { opacity:0.2; } }

    /* Stage 5 and 6: Shortlist Lift + Calendar Fill + End Tick */
    .sl-lift { animation: slUp 9s ease-out infinite; }
    .cal-fill { transform-box: fill-box; transform-origin: left center; animation: calIn 9s ease-out infinite; }
    .final-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: drawFinal 9s ease-out infinite; }
    @keyframes slUp { 0%,68% { transform:translateY(0); } 75%,92% { transform:translateY(-3px); } 98%,100% { transform:translateY(0); } }
    @keyframes calIn { 0%,82% { transform: scaleX(0.1); opacity:0.3; } 89%,96% { transform: scaleX(1); opacity:1; } 100% { transform: scaleX(0.1); } }
    @keyframes drawFinal { 0%,88% { stroke-dashoffset: 24; } 94%,97% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
  </style>

  <!-- Header -->
  <text x="20" y="21" class="title-main">Recruitment &amp; CV Screening</text>
  <text x="620" y="21" text-anchor="end" class="method-text">ATS / inbox → criteria sieve → 3 piles → calendar invites</text>

    <defs>
    <mask id="cutout-recruitment">
      <rect width="640" height="400" fill="white" />
      <rect x="192.5" y="69.0" width="83.0" height="18.0" rx="7.5" fill="black" />
      <rect x="182.5" y="135.5" width="67.0" height="17.0" rx="7.0" fill="black" />
      <rect x="350.5" y="135.5" width="55.0" height="17.0" rx="7.0" fill="black" />
      <rect x="497.5" y="135.5" width="75.0" height="17.0" rx="7.0" fill="black" />
      <rect x="327.5" y="337.0" width="75.0" height="18.0" rx="7.5" fill="black" />
    </mask>
  </defs>

  <!-- Flow Connectors -->
  <g mask="url(#cutout-recruitment)">
  <path d="M 184 78 L 284 78" class="flow-path" />
  <path d="M 340 124 L 106 166" class="flow-path flow-accent" />
  <path d="M 440 124 L 318 166" class="flow-path" />
  <path d="M 540 124 L 530 166" class="flow-path" />
  <path d="M 107 268 L 107 306" class="flow-path flow-accent" />
  <path d="M 312 346 L 418 346" class="flow-path flow-accent" />
  </g>
<!-- Travelling Packets -->
  <circle r="3.1" class="packet p-12" />
  <circle r="3" class="packet p-23a" />
  <circle r="3" class="packet p-23b" />
  <circle r="3" class="packet p-23c" />
  <circle r="3.1" class="packet p-35" />
  <circle r="3.2" class="packet p-56" />

  <!-- Connector Chips -->
  <g transform="translate(234, 78)">
    <rect x="-40" y="-7.5" width="80" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text">ATS / inbox webhook</text>
  </g>
  <g transform="translate(216, 144)">
    <rect x="-32" y="-7" width="64" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text-accent">all must-haves</text>
  </g>
  <g transform="translate(378, 144)">
    <rect x="-26" y="-7" width="52" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text">borderline</text>
  </g>
  <g transform="translate(535, 144)">
    <rect x="-36" y="-7" width="72" height="14" rx="7" class="chip-bg" />
    <text x="0" y="2" text-anchor="middle" class="chip-text">missing must-have</text>
  </g>
  <g transform="translate(365, 346)">
    <rect x="-36" y="-7.5" width="72" height="15" rx="7.5" class="chip-bg" />
    <text x="0" y="2.2" text-anchor="middle" class="chip-text-accent">→ calendar invites</text>
  </g>

  <!-- STAGE 1: TRIGGER "CVs pour in" (Top Left, Tall Stack) -->
  <g id="stage-1" class="node">
    <rect x="16" y="34" width="168" height="90" rx="10" class="card-bg" />
    <text x="26" y="49" class="stage-num">01 · TRIGGER</text>
    <text x="26" y="61" class="stage-title">CVs pour in</text>

    <g transform="translate(26, 70)"><g class="cv-shuf">
      <rect x="0" y="6" width="58" height="34" rx="4" class="chip-bg" />
      <rect x="4" y="3" width="58" height="34" rx="4" class="chip-bg" />
      <rect x="8" y="0" width="58" height="34" rx="4" class="chip-bg" />
      <rect x="14" y="8" width="38" height="4" rx="2" fill="var(--accent)" />
      <rect x="14" y="16" width="32" height="3.5" rx="1.5" fill="var(--ink)" fill-opacity="0.4" />
    </g></g>

    <text x="142" y="86" text-anchor="middle" class="counter-text cnt-1">18</text>
    <text x="142" y="86" text-anchor="middle" class="counter-text cnt-2">34</text>
    <text x="142" y="86" text-anchor="middle" class="counter-text cnt-3">52</text>
    <text x="142" y="99" text-anchor="middle" class="stage-copy">CVs</text>
  </g>

  <!-- STAGE 2: "Criteria applied" (Checklist Gate, Centre Top) -->
  <g id="stage-2" class="node">
    <rect x="284" y="34" width="340" height="90" rx="10" class="card-bg" />
    <text x="294" y="49" class="stage-num">02 · CHECKLIST GATE</text>
    <text x="294" y="61" class="stage-title">Criteria applied</text>

    <g class="ai-badge">
      <rect x="294" y="68" width="36" height="13" rx="6.5" class="chip-bg" />
      <text x="312" y="77" text-anchor="middle" class="chip-text-accent">Claude</text>
      <rect x="334" y="68" width="38" height="13" rx="6.5" class="chip-bg" />
      <text x="353" y="77" text-anchor="middle" class="chip-text-accent">OpenAI</text>
    </g>

    <!-- Checklist Items -->
    <g transform="translate(420, 48)">
      <path d="M 0 6 L 3 9 L 8 3" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" class="ck-1" />
      <text x="14" y="8.5" class="stage-copy">Must-have 1 · 5+ yrs ops</text>

      <path d="M 0 24 L 3 27 L 8 21" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" class="ck-2" />
      <text x="14" y="26.5" class="stage-copy">Must-have 2 · Team lead</text>

      <text x="2" y="45" class="chip-text-accent">✗</text>
      <text x="14" y="44.5" class="stage-copy">Must-have 3 · Licence</text>
    </g>
  </g>

  <!-- STAGE 3: THREE PILES (Bottom Row) -->
  <g id="stage-3" class="node">
    <!-- Shortlist (Neat Tall Stack) -->
    <rect x="16" y="166" width="182" height="102" rx="10" class="card-bg pile-bg" />
    <text x="26" y="182" class="stage-num">03A · PILE 1</text>
    <text x="26" y="195" class="stage-title">Shortlist</text>
    <g transform="translate(26, 206)"><g class="pile-drop-1">
      <rect x="0" y="12" width="66" height="16" rx="3" class="chip-bg" />
      <rect x="0" y="6" width="66" height="16" rx="3" class="chip-bg" />
      <rect x="0" y="0" width="66" height="16" rx="3" class="chip-bg" />
    </g></g>

    <!-- Maybe (Medium Stack) -->
    <rect x="226" y="166" width="182" height="102" rx="10" class="card-bg pile-bg" />
    <text x="236" y="182" class="stage-num">03B · PILE 2</text>
    <text x="236" y="195" class="stage-title">Maybe</text>
    <g transform="translate(236, 212)"><g class="pile-drop-2">
      <rect x="0" y="6" width="66" height="16" rx="3" class="chip-bg" />
      <rect x="0" y="0" width="66" height="16" rx="3" class="chip-bg" />
    </g></g>

    <!-- No (Flat Stack) -->
    <rect x="436" y="166" width="188" height="102" rx="10" class="card-bg pile-bg" />
    <text x="446" y="182" class="stage-num">03C · PILE 3</text>
    <text x="446" y="195" class="stage-title">No</text>
    <g transform="translate(446, 218)"><g class="pile-drop-3">
      <rect x="0" y="0" width="66" height="16" rx="3" class="chip-bg" />
    </g></g>
  </g>

  <!-- STAGE 4: "Reasons attached" (Over the Piles) -->
  <g id="stage-4" class="node">
    <g class="tag-flip">
      <rect x="104" y="236" width="80" height="16" rx="8" class="chip-bg" />
      <text x="144" y="246.5" text-anchor="middle" class="chip-text-accent">5 yrs ops ✓</text>

      <rect x="314" y="236" width="80" height="16" rx="8" class="chip-bg" />
      <text x="354" y="246.5" text-anchor="middle" class="chip-text">gap in SaaS ?</text>

      <rect x="524" y="236" width="84" height="16" rx="8" class="chip-bg" />
      <text x="566" y="246.5" text-anchor="middle" class="chip-text">no licence ✗</text>
    </g>
  </g>

  <!-- STAGE 5: "You decide" (Bottom Centre-Left) -->
  <g id="stage-5" class="node">
    <rect x="16" y="306" width="296" height="82" rx="10" class="card-bg" />
    <text x="26" y="322" class="stage-num">05 · DECIDE</text>
    <text x="26" y="335" class="stage-title">You decide</text>
    <g class="ai-badge">
      <rect x="26" y="343" width="84" height="14" rx="7" class="chip-bg" />
      <text x="68" y="352.5" text-anchor="middle" class="chip-text-accent">human-in-the-loop</text>
    </g>

    <g transform="translate(132, 322)"><g class="sl-lift">
      <rect x="0" y="0" width="78" height="46" rx="6" class="chip-bg" />
      <text x="10" y="18" class="chip-text-accent">Candidate A ✓</text>
      <text x="10" y="32" class="stage-copy">Advance</text>

      <rect x="86" y="0" width="78" height="46" rx="6" class="chip-bg" />
      <text x="96" y="18" class="chip-text-accent">Candidate B ✓</text>
      <text x="96" y="32" class="stage-copy">Advance</text>
    </g></g>
  </g>

  <!-- STAGE 6: "Interviews arranged" (Bottom Right, End) -->
  <g id="stage-6" class="node">
    <rect x="418" y="306" width="206" height="82" rx="10" class="card-bg" />
    <text x="428" y="322" class="stage-num">06 · SCHEDULED</text>
    <text x="428" y="335" class="stage-title">Interviews arranged</text>

    <rect x="428" y="346" width="134" height="9" rx="3" fill="var(--accent)" fill-opacity="0.35" class="cal-fill" />
    <rect x="428" y="361" width="112" height="9" rx="3" fill="var(--accent)" fill-opacity="0.6" class="cal-fill" />

    <circle cx="598" cy="356" r="11" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="1.3" />
    <path d="M 593 356 L 596.5 359.5 L 603.5 352.5" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="final-tick" />
  </g>
</svg>
